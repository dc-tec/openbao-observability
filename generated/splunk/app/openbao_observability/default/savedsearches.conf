[OpenBaoAuditConfigurationActivity]
description = OpenBao audit logs show create, update, or delete activity against audit configuration paths. Five-minute audited activity over the configured log host scope; aggregates that scope into one deployment alert. Counts include request and response entries. No request payload, caller, or token field is retained.
search = `openbao_audit_events` | search host="openbao-node*" | addinfo | where _time>info_max_time-300 | where match(operation,"^(create|update|delete)$") AND match(request_path,"^sys/audit(/.*)?$") | stats count AS value | where value>0 | addinfo | eval bucket_time=floor(info_max_time/15)*15-15, instance="(deployment)", condition=1  | eval cluster="compose", scrape_profile="all_nodes" | eval kubernetes_namespace=coalesce(kubernetes_namespace,"(none)"), instance=coalesce(instance,"(cluster)") | eval condition_at=bucket_time | eval alert_key=sha256(cluster . "|" . kubernetes_namespace . "|" . scrape_profile . "|" . instance) | appendpipe [ stats count BY alert_key cluster kubernetes_namespace scrape_profile instance   | addinfo | eval anchor=floor(info_max_time/15)*15-15, bucket_time=mvrange(anchor-0,anchor+1,15)   | mvexpand bucket_time | fields - count ] | stats max(condition) AS condition max(condition_at) AS condition_at max(value) AS value   BY bucket_time alert_key cluster kubernetes_namespace scrape_profile instance | eval _time=bucket_time | sort 0 alert_key bucket_time | streamstats last(condition) AS held last(condition_at) AS held_at last(value) AS value BY alert_key | addinfo | eval anchor=floor(info_max_time/15)*15-15 | where bucket_time>=anchor-0 AND bucket_time<=anchor | eval satisfied=if(held=1 AND bucket_time-held_at<=30,1,0) | stats min(satisfied) AS sustained count AS steps latest(value) AS value   BY cluster kubernetes_namespace scrape_profile instance | where sustained=1 AND steps>=1 | eval alert_id="OpenBaoAuditConfigurationActivity", severity="warning", summary="OpenBao audit configuration changed", runbook_url="https://dc-tec.github.io/openbao-observability/runbooks/security-audit-detections/" | fields alert_id severity summary runbook_url cluster kubernetes_namespace scrape_profile instance value

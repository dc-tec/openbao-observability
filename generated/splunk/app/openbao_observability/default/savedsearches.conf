[OpenBaoExpirationBacklogGrowing]
description = Waiting expiration jobs have a positive five-minute net growth rate for at least 15 minutes. Check issuance, cleanup, leadership changes, and application latency. Current observations supply condition history; missing inputs reset persistence.
search = | `openbao_metric_alert_samples(filter=metric_name="vault_core_active" OR metric_name="vault_expire_job_manager_total_jobs")` | search cluster="compose" scrape_profile="all_nodes" | `openbao_metric_active_expiration` | where match(metric_name,"_expire_job_manager_total_jobs$") | stats max(value) AS queue max(_time) AS _time BY bucket_time cluster kubernetes_namespace scrape_profile instance | eval value=queue | `openbao_metric_slope5m` | eval condition=if(queue>0 AND value>0,1,0), value=queue  | eval kubernetes_namespace=coalesce(kubernetes_namespace,"(none)"), instance=coalesce(instance,"(cluster)") | eval condition_at=bucket_time | eval alert_key=sha256(cluster . "|" . kubernetes_namespace . "|" . scrape_profile . "|" . instance) | appendpipe [ stats count BY alert_key cluster kubernetes_namespace scrape_profile instance   | addinfo | eval anchor=floor(info_max_time/15)*15-15, bucket_time=mvrange(anchor-900,anchor+1,15)   | mvexpand bucket_time | fields - count ] | stats max(condition) AS condition max(condition_at) AS condition_at max(value) AS value   BY bucket_time alert_key cluster kubernetes_namespace scrape_profile instance | eval _time=bucket_time | sort 0 alert_key bucket_time | streamstats last(condition) AS held last(condition_at) AS held_at last(value) AS value BY alert_key | addinfo | eval anchor=floor(info_max_time/15)*15-15 | where bucket_time>=anchor-900 AND bucket_time<=anchor | eval satisfied=if(held=1 AND bucket_time-held_at<=30,1,0) | stats min(satisfied) AS sustained count AS steps latest(value) AS value   BY cluster kubernetes_namespace scrape_profile instance | where sustained=1 AND steps>=61 | eval alert_id="OpenBaoExpirationBacklogGrowing", severity="warning", summary="OpenBao expiration backlog is growing", runbook_url="https://dc-tec.github.io/openbao-observability/runbooks/expiration-backlog/" | fields alert_id severity summary runbook_url cluster kubernetes_namespace scrape_profile instance value
disabled = 1
is_scheduled = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -21m
dispatch.latest_time = -30s
dispatch.ttl = 1h
max_concurrent = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
alert.digest_mode = 0
alert.severity = 3
alert.expires = 1d
alert.suppress = 0
actions =

[OpenBaoExpirationBacklogWithHighLatency]
description = Waiting expiration jobs coincide with mean regular or login handler latency above the reference limit of 1000 milliseconds for at least 15 minutes. This can persist while the queue drains; correlation does not establish the cause or LDAP-specific latency. Current observations supply condition history; missing inputs reset persistence.
search = | `openbao_metric_alert_samples(filter=metric_name="vault_core_active" OR metric_name="vault_expire_job_manager_total_jobs" OR metric_name="vault_core_handle_request_*" OR metric_name="vault_core_handle_login_request_*")` | search cluster="compose" scrape_profile="all_nodes" | `openbao_metric_active_expiration` | eventstats max(eval(if(match(metric_name,"_expire_job_manager_total_jobs$"),value,null()))) AS queue BY bucket_time cluster kubernetes_namespace scrape_profile instance | where match(metric_name,"_core_handle_(login_)?request_(sum|count)$") | eval operation=if(match(metric_name,"login"),"login","request") | `openbao_metric_rate5m` | stats sum(eval(if(match(metric_name,"_sum$"),value,null()))) AS total sum(eval(if(match(metric_name,"_count$"),value,null()))) AS observations max(queue) AS queue BY bucket_time cluster kubernetes_namespace scrape_profile instance operation | eval value=if(observations>0,total/observations,null()), condition=case(isnull(queue) OR isnull(value),-1,queue>0 AND value>1000,1,1=1,0) | stats max(condition) AS condition max(value) AS value BY bucket_time cluster kubernetes_namespace scrape_profile instance  | eval kubernetes_namespace=coalesce(kubernetes_namespace,"(none)"), instance=coalesce(instance,"(cluster)") | eval condition_at=bucket_time | eval alert_key=sha256(cluster . "|" . kubernetes_namespace . "|" . scrape_profile . "|" . instance) | appendpipe [ stats count BY alert_key cluster kubernetes_namespace scrape_profile instance   | addinfo | eval anchor=floor(info_max_time/15)*15-15, bucket_time=mvrange(anchor-900,anchor+1,15)   | mvexpand bucket_time | fields - count ] | stats max(condition) AS condition max(condition_at) AS condition_at max(value) AS value   BY bucket_time alert_key cluster kubernetes_namespace scrape_profile instance | eval _time=bucket_time | sort 0 alert_key bucket_time | streamstats last(condition) AS held last(condition_at) AS held_at last(value) AS value BY alert_key | addinfo | eval anchor=floor(info_max_time/15)*15-15 | where bucket_time>=anchor-900 AND bucket_time<=anchor | eval satisfied=if(held=1 AND bucket_time-held_at<=30,1,0) | stats min(satisfied) AS sustained count AS steps latest(value) AS value   BY cluster kubernetes_namespace scrape_profile instance | where sustained=1 AND steps>=61 | eval alert_id="OpenBaoExpirationBacklogWithHighLatency", severity="warning", summary="OpenBao expiration backlog coincides with high request latency", runbook_url="https://dc-tec.github.io/openbao-observability/runbooks/expiration-backlog/" | fields alert_id severity summary runbook_url cluster kubernetes_namespace scrape_profile instance value

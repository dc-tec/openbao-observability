# Generated; use local/macros.conf for installation overrides.
[openbao_audit_source]
definition = index="openbao_audit" sourcetype="openbao:audit"
iseval = 0

[openbao_audit_events]
definition = `openbao_audit_source` | fields _raw _time host | spath input=_raw path=type output=audit_type | spath input=_raw path=request.id output=request_id | spath input=_raw path=request.path output=request_path | spath input=_raw path=request.operation output=operation | spath input=_raw path=request.namespace.path output=logical_namespace | spath input=_raw path=auth.display_name output=caller | spath input=_raw path=request.remote_address output=client_ip | spath input=_raw path=error output=audit_error | eval logical_namespace=coalesce(logical_namespace,"(root)"), caller=coalesce(caller,"(missing)"), client_ip=coalesce(client_ip,"(missing)"), request_id=coalesce(request_id,"(missing)"), request_path=coalesce(request_path,"(missing)"), operation=coalesce(operation,"(missing)"), audit_type=coalesce(audit_type,"(missing)"), audit_error=coalesce(audit_error,"") | fields _time host audit_type request_id request_path operation logical_namespace caller client_ip audit_error | fields - _raw
iseval = 0

[openbao_metric_source]
definition = index="openbao_metrics"
iseval = 0

[openbao_operational_source]
definition = index="openbao_operational" sourcetype="openbao:operational"
iseval = 0

[openbao_operational_events]
definition = `openbao_operational_source` | fields _raw _time host | spath input=_raw path=@level output=severity | spath input=_raw path=@module output=module | spath input=_raw path=@message output=message | eval severity=lower(coalesce(severity,"(missing)")), module=coalesce(module,"(missing)"), message=coalesce(message,"(unparsed JSON)") | fields _time host severity module message | fields - _raw
iseval = 0

[openbao_completed_source]
definition = index="openbao_completed" sourcetype="openbao:completed"
iseval = 0

[openbao_completed_events]
definition = `openbao_completed_source` | fields _raw _time host | spath input=_raw path=@message output=event_kind | where event_kind="completed_request" | fields _time host event_kind | fields - _raw
iseval = 0

[openbao_platform_source]
definition = index="openbao_platform" sourcetype="openbao:platform"
iseval = 0

[openbao_platform_events]
definition = `openbao_platform_source` | fields _raw _time host cluster | spath input=_raw path=cluster output=deployment_cluster | spath input=_raw path=object output=event_json | eval event_json=coalesce(event_json,_raw) | spath input=event_json path=type output=event_type | spath input=event_json path=reason output=reason | spath input=event_json path=message output=message | spath input=event_json path=note output=note | spath input=event_json path=metadata.namespace output=event_namespace | spath input=event_json path=involvedObject.name output=core_name | spath input=event_json path=involvedObject.kind output=core_kind | spath input=event_json path=regarding.name output=regarding_name | spath input=event_json path=regarding.kind output=regarding_kind | spath input=event_json path=source.host output=node | eval cluster=coalesce(deployment_cluster,cluster,"(missing)"), kubernetes_namespace=coalesce(event_namespace,"(missing)"), object_name=coalesce(core_name,regarding_name,"(missing)"), object_kind=coalesce(core_kind,regarding_kind,"(missing)"), message=coalesce(message,note,""), event_type=coalesce(event_type,"(missing)"), reason=coalesce(reason,"(missing)"), node=coalesce(node,"(missing)") | eval pod=if(object_kind="Pod",object_name,"(not a Pod)") | fields _time host cluster kubernetes_namespace pod node object_kind object_name event_type reason message | fields - _raw
iseval = 0

[openbao_metric_samples(1)]
definition = mstats latest(_value) AS value latest_time(_value) AS observed_at WHERE `openbao_metric_source` metric_name=$metric$ BY _timeseries span=15s | spath input=_timeseries | eval bucket_time=_time, _time=observed_at | eval kubernetes_namespace=coalesce(kubernetes_namespace,"(none)"), openbao_namespace=coalesce(openbao_namespace,"(root)"), instance=coalesce(instance,"(missing)") | eval scrape_profile=coalesce(scrape_profile,"external"), kubernetes_namespace=if(kubernetes_namespace="(none)",coalesce(namespace,"(none)"),kubernetes_namespace)
iseval = 0
args = metric

[openbao_metric_fresh]
definition = addinfo | where _time >= info_max_time-45
iseval = 0

[openbao_metric_rate5m]
definition = sort 0 _time | streamstats current=f last(value) AS previous BY _timeseries | eval reset=if(value<previous,previous,0) | streamstats sum(reset) AS correction BY _timeseries | eval corrected=value+correction | streamstats time_window=5m count AS samples first(corrected) AS first_value first(_time) AS first_time first(value) AS first_raw BY _timeseries | eval duration=_time-first_time, delta=corrected-first_value | where samples>1 AND duration>0 | eval interval=duration/(samples-1), to_start=300-duration | eval to_start=if(delta>0 AND first_raw>=0,min(to_start,duration*first_raw/delta),to_start) | eval extrapolated=if(to_start<interval*1.1,to_start,interval/2) | eval value=delta*(duration+extrapolated)/duration/300 | fields - previous reset correction corrected samples first_value first_time first_raw duration delta interval to_start extrapolated
iseval = 0

[openbao_metric_slope5m]
definition = addinfo | eval x=_time-info_min_time, xy=x*value, xx=x*x | sort 0 _time | streamstats time_window=5m count AS n sum(x) AS sx sum(value) AS sy sum(xy) AS sxy sum(xx) AS sxx BY instance cluster scrape_profile | eval denominator=n*sxx-sx*sx | where n>1 AND denominator>0 | eval value=(n*sxy-sx*sy)/denominator | fields - x xy xx n sx sy sxy sxx denominator
iseval = 0

[openbao_metric_active_expiration]
definition = eval active_marker=if(match(metric_name,"_core_active$"),value,null()) | eventstats max(active_marker) AS active BY bucket_time instance cluster scrape_profile | where active=1 AND NOT match(metric_name,"_core_active$") | fields - active_marker active
iseval = 0


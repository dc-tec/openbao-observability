definition = sort 0 _time | streamstats current=f last(value) AS previous BY _timeseries | eval reset=if(value<previous,previous,0) | streamstats sum(reset) AS correction BY _timeseries | eval corrected=value+correction | streamstats time_window=30m count AS samples first(corrected) AS first_value first(_time) AS first_time first(value) AS first_raw BY _timeseries | eval duration=_time-first_time, delta=corrected-first_value | where samples>1 AND duration>0 | eval interval=duration/(samples-1), to_start=1800-duration | eval to_start=if(delta>0 AND first_raw>=0,min(to_start,duration*first_raw/delta),to_start) | eval extrapolated=if(to_start<interval*1.1,to_start,interval/2) | eval value=delta*(duration+extrapolated)/duration/1800 | fields - previous reset correction corrected samples first_value first_time first_raw duration delta interval to_start extrapolated

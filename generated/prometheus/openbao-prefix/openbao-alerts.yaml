# Code generated by openbao-observability; DO NOT EDIT.
groups:
    - name: openbao.alerts
      rules:
        - alert: OpenBaoUnreachable
          expr: (up{job="openbao"} == 0) or absent(up{job="openbao"})
          for: 5m
          labels:
            severity: critical
            signal: metrics
            source_prefix: openbao
          annotations:
            description: An OpenBao scrape target is down, or the canonical OpenBao job is missing, for at least 5 minutes.
            runbook_url: https://github.com/dc-tec/openbao-observability/blob/main/docs/runbooks/openbao-metrics-scrape-failing.md
            summary: OpenBao metrics scrape is failing
        - alert: OpenBaoSealedUnexpectedly
          expr: openbao:core_unsealed:min == 0
          for: 2m
          labels:
            severity: critical
            signal: metrics
            source_prefix: openbao
          annotations:
            description: A scraped OpenBao node reports that it is sealed.
            runbook_url: https://github.com/dc-tec/openbao-observability/blob/main/docs/runbooks/openbao-sealed-unexpectedly.md
            summary: OpenBao is sealed
        - alert: OpenBaoNoActiveNode
          expr: openbao:core_active:sum == 0
          for: 2m
          labels:
            severity: critical
            signal: metrics
            source_prefix: openbao
          annotations:
            description: No active OpenBao node is visible to Prometheus.
            runbook_url: https://github.com/dc-tec/openbao-observability/blob/main/docs/runbooks/no-active-openbao-leader.md
            summary: OpenBao has no active node
        - alert: OpenBaoCoreActiveSignalMissing
          expr: max by (cluster, kubernetes_namespace, scrape_profile) (up{job="openbao"} == 1) unless on (cluster, kubernetes_namespace, scrape_profile) openbao:core_active:sum
          for: 5m
          labels:
            severity: critical
            signal: metrics
            source_prefix: openbao
          annotations:
            description: Prometheus can scrape OpenBao, but the required normalized active-node signal is missing.
            runbook_url: https://github.com/dc-tec/openbao-observability/blob/main/docs/runbooks/no-active-openbao-leader.md
            summary: OpenBao active-node signal is missing
        - alert: OpenBaoMultipleActiveNodes
          expr: openbao:core_active:sum > 1
          for: 2m
          labels:
            severity: critical
            signal: metrics
            source_prefix: openbao
          annotations:
            description: More than one active OpenBao node is visible to Prometheus.
            runbook_url: https://github.com/dc-tec/openbao-observability/blob/main/docs/runbooks/multiple-active-nodes.md
            summary: OpenBao has multiple active nodes
        - alert: OpenBaoAllPodsUnavailable
          expr: sum by (cluster, namespace) (kube_pod_container_status_ready{pod=~"openbao.*",container=~"openbao|bao"}) == 0
          for: 5m
          labels:
            component: kubernetes
            severity: critical
            signal: platform
            source_prefix: openbao
            subsystem: workload
          annotations:
            description: Kubernetes reports no ready OpenBao workload containers for the selected platform metrics.
            runbook_url: https://github.com/dc-tec/openbao-observability/blob/main/docs/runbooks/kubernetes-platform-health.md
            summary: All OpenBao Kubernetes pods are unavailable
        - alert: OpenBaoAuditPVCPressure
          expr: 100 * min by (cluster, namespace, persistentvolumeclaim) (kubelet_volume_stats_available_bytes{persistentvolumeclaim=~".*(openbao|bao|audit|data).*"}) / min by (cluster, namespace, persistentvolumeclaim) (kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~".*(openbao|bao|audit|data).*"}) < 15
          for: 10m
          labels:
            component: kubernetes
            severity: critical
            signal: platform
            source_prefix: openbao
            subsystem: storage
          annotations:
            description: A matching OpenBao audit or data PVC has less than 15 percent free space.
            runbook_url: https://github.com/dc-tec/openbao-observability/blob/main/docs/runbooks/kubernetes-platform-health.md
            summary: OpenBao audit or data PVC free space is low
        - alert: OpenBaoRaftPeerCountLow
          expr: openbao:raft_peers:max < 3
          for: 2m
          labels:
            component: raft
            severity: critical
            signal: metrics
            source_prefix: openbao
          annotations:
            description: OpenBao Raft reports fewer than three peers, which removes the baseline redundancy expected for this reference architecture.
            runbook_url: https://github.com/dc-tec/openbao-observability/blob/main/docs/runbooks/raft-autopilot-health.md
            summary: OpenBao Raft peer count is below the HA baseline
        - alert: OpenBaoAutopilotUnhealthy
          expr: openbao:autopilot_healthy:max == 0
          for: 2m
          labels:
            component: raft
            severity: critical
            signal: metrics
            source_prefix: openbao
            subsystem: autopilot
          annotations:
            description: OpenBao Autopilot reports that the integrated storage cluster is unhealthy.
            runbook_url: https://github.com/dc-tec/openbao-observability/blob/main/docs/runbooks/raft-autopilot-health.md
            summary: OpenBao Autopilot reports an unhealthy cluster
        - alert: OpenBaoAutopilotFailureToleranceLost
          expr: openbao:raft_peers:max >= 3 and openbao:autopilot_failure_tolerance:max < 1
          for: 2m
          labels:
            component: raft
            severity: critical
            signal: metrics
            source_prefix: openbao
            subsystem: autopilot
          annotations:
            description: OpenBao Autopilot reports that the Raft cluster cannot lose a voter while maintaining the configured HA baseline.
            runbook_url: https://github.com/dc-tec/openbao-observability/blob/main/docs/runbooks/raft-autopilot-health.md
            summary: OpenBao Autopilot has no tolerated voter failure
        - alert: OpenBaoAutopilotNodeUnhealthy
          expr: openbao:autopilot_node_healthy:min == 0
          for: 2m
          labels:
            component: raft
            severity: critical
            signal: metrics
            source_prefix: openbao
            subsystem: autopilot
          annotations:
            description: OpenBao Autopilot reports that at least one known Raft node is unhealthy.
            runbook_url: https://github.com/dc-tec/openbao-observability/blob/main/docs/runbooks/raft-autopilot-health.md
            summary: OpenBao Autopilot reports an unhealthy node
        - alert: OpenBaoAuditRequestFailures
          expr: openbao:audit_log_request_failure:increase5m > 0
          for: 0m
          labels:
            severity: critical
            signal: metrics
            source_prefix: openbao
          annotations:
            description: OpenBao reported at least one audit request logging failure.
            runbook_url: https://github.com/dc-tec/openbao-observability/blob/main/docs/runbooks/audit-request-response-failures.md
            summary: OpenBao audit request logging failed
        - alert: OpenBaoAuditResponseFailures
          expr: openbao:audit_log_response_failure:increase5m > 0
          for: 0m
          labels:
            severity: critical
            signal: metrics
            source_prefix: openbao
          annotations:
            description: OpenBao reported at least one audit response logging failure.
            runbook_url: https://github.com/dc-tec/openbao-observability/blob/main/docs/runbooks/audit-request-response-failures.md
            summary: OpenBao audit response logging failed
        - alert: OpenBaoAuditArchiveDegraded
          expr: |-
            (max by (cluster, environment, backend, pipeline) (openbao_audit_archive_enabled) == 1) and on (cluster, environment, backend, pipeline) (
              min by (cluster, environment, backend, pipeline) (openbao_audit_archive_delivery_success) == 0
              or (
                (max by (cluster, environment, backend, pipeline) (openbao_audit_archive_enabled) == 1)
                unless on (cluster, environment, backend, pipeline)
                min by (cluster, environment, backend, pipeline) (openbao_audit_archive_delivery_success)
              )
              or (
                (max by (cluster, environment, backend, pipeline) (openbao_audit_archive_enabled) == 1)
                unless on (cluster, environment, backend, pipeline)
                max by (cluster, environment, backend, pipeline) (openbao_audit_archive_last_success_timestamp_seconds)
              )
              or (
                (max by (cluster, environment, backend, pipeline) (openbao_audit_archive_enabled) == 1)
                unless on (cluster, environment, backend, pipeline)
                sum by (cluster, environment, backend, pipeline) (openbao_audit_archive_delivery_failures_total)
              )
              or (
                (max by (cluster, environment, backend, pipeline) (openbao_audit_archive_enabled) == 1)
                unless on (cluster, environment, backend, pipeline)
                sum by (cluster, environment, backend, pipeline) (openbao_audit_archive_dead_letter_records_total)
              )
              or (time() - max by (cluster, environment, backend, pipeline) (openbao_audit_archive_last_success_timestamp_seconds)) > 900
              or sum by (cluster, environment, backend, pipeline) (increase(openbao_audit_archive_delivery_failures_total[15m])) > 0
              or sum by (cluster, environment, backend, pipeline) (increase(openbao_audit_archive_dead_letter_records_total[15m])) > 0
            )
          for: 10m
          labels:
            component: audit
            severity: critical
            signal: archive
            source_prefix: openbao
            subsystem: archive
          annotations:
            description: The durable OpenBao audit archive path is enabled but missing, stale, failing, or dead-lettering records.
            runbook_url: https://github.com/dc-tec/openbao-observability/blob/main/docs/runbooks/audit-archive-degraded.md
            summary: OpenBao audit archive is degraded
        - alert: OpenBaoAuditArchiveSignalMissing
          expr: openbao_observability_signal_expected{signal="audit_archive"} == 1 unless on (cluster, environment, backend, pipeline) max by (cluster, environment, backend, pipeline) (openbao_audit_archive_enabled)
          for: 10m
          labels:
            component: audit
            severity: critical
            signal: archive
            source_prefix: openbao
            subsystem: archive
          annotations:
            description: The archive health signal is required for this pipeline, but Prometheus has no matching enabled marker.
            runbook_url: https://github.com/dc-tec/openbao-observability/blob/main/docs/runbooks/audit-archive-degraded.md
            summary: OpenBao audit archive health signal is missing

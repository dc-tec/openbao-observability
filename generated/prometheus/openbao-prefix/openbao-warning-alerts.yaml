# Code generated by openbao-observability; DO NOT EDIT.
groups:
    - name: openbao.alerts
      rules:
        - alert: OpenBaoIrrevocableLeasesPresent
          expr: openbao:expire_num_irrevocable_leases:max > 0
          for: 10m
          labels:
            component: leases
            severity: warning
            signal: metrics
            source_prefix: openbao
          annotations:
            description: OpenBao reports one or more leases that it cannot automatically revoke.
            runbook_url: docs/runbooks/irrevocable-leases.md
            summary: OpenBao reports irrevocable leases
        - alert: OpenBaoStorageBarrierLatencyElevated
          expr: (openbao:barrier_get:avg5m > 3 * clamp_min(avg_over_time(openbao:barrier_get:avg5m[1h]), 0.001)) or (openbao:barrier_put:avg5m > 3 * clamp_min(avg_over_time(openbao:barrier_put:avg5m[1h]), 0.001)) or (openbao:barrier_list:avg5m > 3 * clamp_min(avg_over_time(openbao:barrier_list:avg5m[1h]), 0.001)) or (openbao:barrier_delete:avg5m > 3 * clamp_min(avg_over_time(openbao:barrier_delete:avg5m[1h]), 0.001))
          for: 15m
          labels:
            component: storage
            severity: warning
            signal: metrics
            source_prefix: openbao
            subsystem: barrier
          annotations:
            description: OpenBao storage barrier latency is more than three times its recent baseline.
            runbook_url: docs/runbooks/runtime-storage-warnings.md
            summary: OpenBao storage barrier latency is elevated
        - alert: OpenBaoStorageCacheHitRatioLow
          expr: (openbao:cache_hit:rate5m + openbao:cache_miss:rate5m) > 1 and openbao:cache_hit_ratio:ratio5m < 0.50
          for: 15m
          labels:
            component: storage
            severity: warning
            signal: metrics
            source_prefix: openbao
            subsystem: cache
          annotations:
            description: OpenBao storage cache hit ratio is below 50 percent while cache traffic is active.
            runbook_url: docs/runbooks/runtime-storage-warnings.md
            summary: OpenBao storage cache hit ratio is low
        - alert: OpenBaoRuntimeMemoryGrowth
          expr: predict_linear(openbao:runtime_sys_bytes:max[30m], 3600) > openbao:runtime_sys_bytes:max * 1.5 and openbao:runtime_sys_bytes:max > 0
          for: 15m
          labels:
            component: runtime
            severity: warning
            signal: metrics
            source_prefix: openbao
            subsystem: memory
          annotations:
            description: OpenBao Go runtime system memory is projected to grow by more than 50 percent over the next hour.
            runbook_url: docs/runbooks/runtime-storage-warnings.md
            summary: OpenBao runtime memory is projected to grow
        - alert: OpenBaoMountTableGrowth
          expr: sum(openbao:core_mount_table_num_entries:max) - sum(openbao:core_mount_table_num_entries:max offset 1h) > 5
          for: 10m
          labels:
            component: core
            severity: warning
            signal: metrics
            source_prefix: openbao
            subsystem: mounts
          annotations:
            description: OpenBao reports more than five additional mount table entries compared with one hour ago.
            runbook_url: docs/runbooks/runtime-storage-warnings.md
            summary: OpenBao mount table grew quickly
        - alert: OpenBaoPKIOperationFailures
          expr: (openbao:pki_issue_failure:increase15m > 0) or (openbao:pki_revoke_failure:increase15m > 0)
          for: 5m
          labels:
            component: secret-engines
            severity: warning
            signal: metrics
            source_prefix: openbao
            subsystem: pki
          annotations:
            description: OpenBao reports failed PKI issue or revoke operations over the alert window.
            runbook_url: docs/runbooks/secret-engine-feature-warnings.md
            summary: OpenBao PKI operations are failing
        - alert: OpenBaoPKIOperationLatencyElevated
          expr: ((openbao:pki_issue:rate5m > 0) and (openbao:pki_issue:avg5m > 3 * clamp_min(avg_over_time(openbao:pki_issue:avg5m[1h]), 0.001))) or ((openbao:pki_revoke:rate5m > 0) and (openbao:pki_revoke:avg5m > 3 * clamp_min(avg_over_time(openbao:pki_revoke:avg5m[1h]), 0.001)))
          for: 15m
          labels:
            component: secret-engines
            severity: warning
            signal: metrics
            source_prefix: openbao
            subsystem: pki
          annotations:
            description: OpenBao PKI issue or revoke latency is more than three times its recent baseline while PKI operations are active.
            runbook_url: docs/runbooks/secret-engine-feature-warnings.md
            summary: OpenBao PKI operation latency is elevated
        - alert: OpenBaoDatabaseCredentialOperationFailures
          expr: (openbao:database_initialize_error:increase15m > 0) or (openbao:database_new_user_error:increase15m > 0) or (openbao:database_update_user_error:increase15m > 0) or (openbao:database_delete_user_error:increase15m > 0)
          for: 5m
          labels:
            component: secret-engines
            severity: warning
            signal: metrics
            source_prefix: openbao
            subsystem: database
          annotations:
            description: OpenBao reports failed database secrets engine initialize, create, renew, or revoke operations over the alert window.
            runbook_url: docs/runbooks/secret-engine-feature-warnings.md
            summary: OpenBao database credential operations are failing
        - alert: OpenBaoDatabaseCredentialOperationLatencyElevated
          expr: ((openbao:database_new_user:rate5m > 0) and (openbao:database_new_user:avg5m > 3 * clamp_min(avg_over_time(openbao:database_new_user:avg5m[1h]), 0.001))) or ((openbao:database_update_user:rate5m > 0) and (openbao:database_update_user:avg5m > 3 * clamp_min(avg_over_time(openbao:database_update_user:avg5m[1h]), 0.001))) or ((openbao:database_delete_user:rate5m > 0) and (openbao:database_delete_user:avg5m > 3 * clamp_min(avg_over_time(openbao:database_delete_user:avg5m[1h]), 0.001)))
          for: 15m
          labels:
            component: secret-engines
            severity: warning
            signal: metrics
            source_prefix: openbao
            subsystem: database
          annotations:
            description: OpenBao database credential create, renew, or revoke latency is more than three times its recent baseline while database operations are active.
            runbook_url: docs/runbooks/secret-engine-feature-warnings.md
            summary: OpenBao database credential operation latency is elevated
        - alert: OpenBaoSyntheticProbeFailing
          expr: min_over_time(probe_success{job=~".*openbao.*"}[5m]) == 0
          for: 5m
          labels:
            component: availability
            severity: warning
            signal: availability
            source_prefix: openbao
            subsystem: synthetic-probe
          annotations:
            description: A synthetic probe for OpenBao has failed for the alert window.
            runbook_url: docs/runbooks/slo-availability.md
            summary: OpenBao synthetic probe is failing
        - alert: OpenBaoAvailabilityFastBurn
          expr: ((1 - avg_over_time(probe_success{job=~".*openbao.*"}[5m])) / 0.001 > 14.4) and ((1 - avg_over_time(probe_success{job=~".*openbao.*"}[1h])) / 0.001 > 14.4)
          for: 5m
          labels:
            component: availability
            severity: warning
            signal: availability
            source_prefix: openbao
            subsystem: error-budget
          annotations:
            description: Synthetic probe failures are consuming the 99.9 percent availability error budget across short and medium windows.
            runbook_url: docs/runbooks/slo-availability.md
            summary: OpenBao availability error budget has high burn rate
        - alert: OpenBaoAvailabilitySlowBurn
          expr: ((1 - avg_over_time(probe_success{job=~".*openbao.*"}[30m])) / 0.001 > 6) and ((1 - avg_over_time(probe_success{job=~".*openbao.*"}[6h])) / 0.001 > 6)
          for: 30m
          labels:
            component: availability
            severity: warning
            signal: availability
            source_prefix: openbao
            subsystem: error-budget
          annotations:
            description: Synthetic probe failures are consuming the 99.9 percent availability error budget across medium and long windows.
            runbook_url: docs/runbooks/slo-availability.md
            summary: OpenBao availability error budget is burning
        - alert: OpenBaoSyntheticProbeLatencyElevated
          expr: avg_over_time(probe_duration_seconds{job=~".*openbao.*"}[5m]) > 3 * clamp_min(avg_over_time(probe_duration_seconds{job=~".*openbao.*"}[1h]), 0.001)
          for: 15m
          labels:
            component: availability
            severity: warning
            signal: availability
            source_prefix: openbao
            subsystem: synthetic-probe
          annotations:
            description: Synthetic probe duration is more than three times its recent baseline.
            runbook_url: docs/runbooks/slo-availability.md
            summary: OpenBao synthetic probe latency is elevated
        - alert: OpenBaoKubernetesPodNotReady
          expr: min by (namespace, pod) (kube_pod_container_status_ready{pod=~"openbao.*",container=~"openbao|bao"}) == 0
          for: 10m
          labels:
            component: kubernetes
            severity: warning
            signal: platform
            source_prefix: openbao
            subsystem: workload
          annotations:
            description: Kubernetes reports an OpenBao workload container as not ready for at least 10 minutes.
            runbook_url: docs/runbooks/kubernetes-platform-health.md
            summary: OpenBao Kubernetes pod is not ready
        - alert: OpenBaoKubernetesPodRestartsIncreasing
          expr: sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total{pod=~"openbao.*",container=~"openbao|bao"}[15m])) > 0
          for: 5m
          labels:
            component: kubernetes
            severity: warning
            signal: platform
            source_prefix: openbao
            subsystem: workload
          annotations:
            description: Kubernetes reports OpenBao workload container restarts in the last 15 minutes.
            runbook_url: docs/runbooks/kubernetes-platform-health.md
            summary: OpenBao Kubernetes pod restarted
        - alert: OpenBaoKubernetesNodePressure
          expr: max by (node, condition) (kube_node_status_condition{condition=~"DiskPressure|MemoryPressure|PIDPressure",status="true"}) == 1
          for: 10m
          labels:
            component: kubernetes
            severity: warning
            signal: platform
            source_prefix: openbao
            subsystem: node
          annotations:
            description: Kubernetes reports node pressure that can disrupt OpenBao scheduling, storage, or runtime behavior.
            runbook_url: docs/runbooks/kubernetes-platform-health.md
            summary: Kubernetes node pressure may affect OpenBao
        - alert: OpenBaoLogCollectorTargetDown
          expr: min_over_time(up{job=~".*(alloy|grafana-alloy|promtail).*"}[10m]) == 0
          for: 10m
          labels:
            component: collector
            severity: warning
            signal: platform
            source_prefix: openbao
            subsystem: logs
          annotations:
            description: Prometheus reports a log collector scrape target as down, which can break OpenBao log and audit-log exploration.
            runbook_url: docs/runbooks/kubernetes-platform-health.md
            summary: OpenBao log collector scrape target is down

# Code generated by openbao-observability; DO NOT EDIT.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
    name: openbao-alerts
spec:
    groups:
        - name: openbao.alerts
          rules:
            - alert: OpenBaoUnreachable
              expr: min_over_time(up{job=~"openbao.*"}[5m]) == 0
              for: 5m
              labels:
                severity: critical
                signal: metrics
                source_prefix: vault
              annotations:
                description: Prometheus cannot scrape OpenBao for at least 5 minutes.
                runbook_url: https://github.com/dc-tec/openbao-observability/blob/main/docs/runbooks/openbao-metrics-scrape-failing.md
                summary: OpenBao metrics scrape is failing
            - alert: OpenBaoSealedUnexpectedly
              expr: vault_core_unsealed{cluster!=""} == 0
              for: 2m
              labels:
                severity: critical
                signal: metrics
                source_prefix: vault
              annotations:
                description: A scraped OpenBao node reports that it is sealed.
                runbook_url: https://github.com/dc-tec/openbao-observability/blob/main/docs/runbooks/openbao-sealed-unexpectedly.md
                summary: OpenBao is sealed
            - alert: OpenBaoNoActiveNode
              expr: openbao:core_active:sum == 0
              for: 2m
              labels:
                severity: critical
                signal: metrics
                source_prefix: vault
              annotations:
                description: No active OpenBao node is visible to Prometheus.
                runbook_url: https://github.com/dc-tec/openbao-observability/blob/main/docs/runbooks/no-active-openbao-leader.md
                summary: OpenBao has no active node
            - alert: OpenBaoMultipleActiveNodes
              expr: openbao:core_active:sum > 1
              for: 2m
              labels:
                severity: critical
                signal: metrics
                source_prefix: vault
              annotations:
                description: More than one active OpenBao node is visible to Prometheus.
                runbook_url: https://github.com/dc-tec/openbao-observability/blob/main/docs/runbooks/multiple-active-nodes.md
                summary: OpenBao has multiple active nodes
            - alert: OpenBaoAllPodsUnavailable
              expr: sum by (namespace) (kube_pod_container_status_ready{pod=~"openbao.*",container=~"openbao|bao"}) == 0
              for: 5m
              labels:
                component: kubernetes
                severity: critical
                signal: platform
                source_prefix: vault
                subsystem: workload
              annotations:
                description: Kubernetes reports no ready OpenBao workload containers for the selected platform metrics.
                runbook_url: https://github.com/dc-tec/openbao-observability/blob/main/docs/runbooks/kubernetes-platform-health.md
                summary: All OpenBao Kubernetes pods are unavailable
            - alert: OpenBaoAuditPVCPressure
              expr: 100 * min by (namespace, persistentvolumeclaim) (kubelet_volume_stats_available_bytes{persistentvolumeclaim=~".*(openbao|bao|audit|data).*"}) / min by (namespace, persistentvolumeclaim) (kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~".*(openbao|bao|audit|data).*"}) < 15
              for: 10m
              labels:
                component: kubernetes
                severity: critical
                signal: platform
                source_prefix: vault
                subsystem: storage
              annotations:
                description: A matching OpenBao audit or data PVC has less than 15 percent free space.
                runbook_url: https://github.com/dc-tec/openbao-observability/blob/main/docs/runbooks/kubernetes-platform-health.md
                summary: OpenBao audit or data PVC free space is low
            - alert: OpenBaoRaftPeerCountLow
              expr: openbao:raft_peers:max < 3
              for: 2m
              labels:
                component: raft
                severity: critical
                signal: metrics
                source_prefix: vault
              annotations:
                description: OpenBao Raft reports fewer than three peers, which removes the baseline redundancy expected for this reference architecture.
                runbook_url: https://github.com/dc-tec/openbao-observability/blob/main/docs/runbooks/raft-autopilot-health.md
                summary: OpenBao Raft peer count is below the HA baseline
            - alert: OpenBaoAutopilotUnhealthy
              expr: openbao:autopilot_healthy:max == 0
              for: 2m
              labels:
                component: raft
                severity: critical
                signal: metrics
                source_prefix: vault
                subsystem: autopilot
              annotations:
                description: OpenBao Autopilot reports that the integrated storage cluster is unhealthy.
                runbook_url: https://github.com/dc-tec/openbao-observability/blob/main/docs/runbooks/raft-autopilot-health.md
                summary: OpenBao Autopilot reports an unhealthy cluster
            - alert: OpenBaoAutopilotFailureToleranceLost
              expr: openbao:raft_peers:max >= 3 and openbao:autopilot_failure_tolerance:max < 1
              for: 2m
              labels:
                component: raft
                severity: critical
                signal: metrics
                source_prefix: vault
                subsystem: autopilot
              annotations:
                description: OpenBao Autopilot reports that the Raft cluster cannot lose a voter while maintaining the configured HA baseline.
                runbook_url: https://github.com/dc-tec/openbao-observability/blob/main/docs/runbooks/raft-autopilot-health.md
                summary: OpenBao Autopilot has no tolerated voter failure
            - alert: OpenBaoAutopilotNodeUnhealthy
              expr: openbao:autopilot_node_healthy:min == 0
              for: 2m
              labels:
                component: raft
                severity: critical
                signal: metrics
                source_prefix: vault
                subsystem: autopilot
              annotations:
                description: OpenBao Autopilot reports that at least one known Raft node is unhealthy.
                runbook_url: https://github.com/dc-tec/openbao-observability/blob/main/docs/runbooks/raft-autopilot-health.md
                summary: OpenBao Autopilot reports an unhealthy node
            - alert: OpenBaoAuditRequestFailures
              expr: sum(increase(vault_audit_log_request_failure[5m])) > 0
              for: 0m
              labels:
                severity: critical
                signal: metrics
                source_prefix: vault
              annotations:
                description: OpenBao reported at least one audit request logging failure.
                runbook_url: https://github.com/dc-tec/openbao-observability/blob/main/docs/runbooks/audit-request-response-failures.md
                summary: OpenBao audit request logging failed
            - alert: OpenBaoAuditResponseFailures
              expr: sum(increase(vault_audit_log_response_failure[5m])) > 0
              for: 0m
              labels:
                severity: critical
                signal: metrics
                source_prefix: vault
              annotations:
                description: OpenBao reported at least one audit response logging failure.
                runbook_url: https://github.com/dc-tec/openbao-observability/blob/main/docs/runbooks/audit-request-response-failures.md
                summary: OpenBao audit response logging failed
            - alert: OpenBaoAuditArchiveDegraded
              expr: |-
                (max(openbao_audit_archive_enabled) == 1) and (
                  absent(openbao_audit_archive_delivery_success)
                  or min(openbao_audit_archive_delivery_success) == 0
                  or absent(openbao_audit_archive_last_success_timestamp_seconds)
                  or (time() - max(openbao_audit_archive_last_success_timestamp_seconds)) > 900
                  or sum(increase(openbao_audit_archive_delivery_failures_total[15m])) > 0
                  or sum(increase(openbao_audit_archive_dead_letter_records_total[15m])) > 0
                )
              for: 10m
              labels:
                component: audit
                severity: critical
                signal: archive
                source_prefix: vault
                subsystem: archive
              annotations:
                description: The durable OpenBao audit archive path is enabled but missing, stale, failing, or dead-lettering records.
                runbook_url: https://github.com/dc-tec/openbao-observability/blob/main/docs/runbooks/audit-archive-degraded.md
                summary: OpenBao audit archive is degraded

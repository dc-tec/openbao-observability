name: Exporter Alpine builder qualification

on:
  pull_request:

permissions:
  contents: read

jobs:
  exporter:
    name: Go 1.27.4 Alpine / scratch exporter
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check qualification harness
        run: python3 -m unittest discover -s hack/qualification -p 'test_exporter_builder.py' -v
      - name: Build and exercise the candidate Dockerfile
        run: python3 hack/qualification/exporter_builder.py
      - name: Save qualification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: exporter-builder-qualification-${{ github.sha }}
          path: tmp/qualification/exporter-builder.json
          if-no-files-found: warn
          retention-days: 7

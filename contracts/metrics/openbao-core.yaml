  - id: runtime_gc_pause_ns
    docsName: vault.runtime.gc_pause_ns
    prometheusName: ${p}_runtime_gc_pause_ns
    required: true
    overview: false
    notes:
      - Observed as a summary in OpenBao 2.5.4 fixtures.
      - Quantile samples can be NaN in quiet HA/Raft captures; generated rules use sum and count.
  - id: runtime_total_gc_pause_ns
    docsName: vault.runtime.total_gc_pause_ns

version: v0.1
status: draft
openbaoVersion: "2.5.4"
metricPrefixes:
  supported:
    - vault
    - openbao
  default: vault
normalization:
  recordingRulePrefix: openbao
  notes:
    - Raw OpenBao metrics do not expose a consistent cluster label across all families.
    - Recording rules should add or normalize cluster, namespace, pod, job, and instance labels from scrape metadata.
fixtures:
  required:
    - fixtures/captured/openbao-2.5.4/metrics/openbao-2.5.4-vault-prefix.prom
    - fixtures/captured/openbao-2.5.4/metrics/openbao-2.5.4-openbao-prefix.prom
metrics:
  - id: core_active
    docsName: vault.core.active
    prometheusName: ${p}_core_active
    required: true
    overview: true
    notes:
      - Observed with a cluster label in OpenBao 2.5.4 dev mode.
  - id: core_unsealed
    docsName: vault.core.unsealed
    prometheusName: ${p}_core_unsealed
    required: true
    overview: true
    notes:
      - Observed with both cluster="" and a real cluster label in OpenBao 2.5.4 dev mode.
      - Generated rules must exclude or normalize the empty cluster series.
  - id: core_handle_request
    docsName: vault.core.handle_request
    prometheusName: ${p}_core_handle_request
    required: true
    overview: true
    notes:
      - Observed as a summary in OpenBao 2.5.4 fixtures.
      - Used for regular request rate and request handling latency.
  - id: core_handle_login_request
    docsName: vault.core.handle_login_request
    prometheusName: ${p}_core_handle_login_request
    required: true
    overview: true
    notes:
      - Observed as a summary in OpenBao 2.5.4 fixtures.
      - Used for login request latency.
  - id: core_check_token
    docsName: vault.core.check_token
    prometheusName: ${p}_core_check_token
    required: true
    overview: true
    notes:
      - Observed as a summary in OpenBao 2.5.4 fixtures.
      - Used for token check latency.
  - id: core_in_flight_requests
    docsName: vault.core.in_flight_requests
    prometheusName: ${p}_core_in_flight_requests
    required: true
    overview: true
    notes:
      - Observed as a gauge in OpenBao 2.5.4 fixtures and HA/Raft captures.
      - Used as a request pressure indicator.
  - id: core_mount_table_num_entries
    docsName: vault.core.mount_table.num_entries
    prometheusName: ${p}_core_mount_table_num_entries
    required: true
    overview: false
    notes:
      - Observed with cluster, local, and type labels in OpenBao 2.5.4 fixtures.
      - Type and local are bounded labels suitable for aggregate mount inventory panels.
  - id: core_mount_table_size
    docsName: vault.core.mount_table.size
    prometheusName: ${p}_core_mount_table_size
    required: true
    overview: false
    notes:
      - Observed with cluster, local, and type labels in OpenBao 2.5.4 fixtures.
      - Use as a coarse mount-table size signal, not as mount-path inventory.
  - id: raft_peers
    docsName: vault.raft.peers
    prometheusName: ${p}_raft_peers
    required: false
    overview: false
    notes:
      - Observed in the OpenBao 2.5.4 HA/Raft fixture on the active node.
      - Not always present in current live all-node scrapes.
      - Recording rules fall back to counting raft_storage_stats_commit_index by peer_id.
  - id: raft_storage_stats_commit_index
    docsName: vault.raft_storage.stats.commit_index
    prometheusName: ${p}_raft_storage_stats_commit_index
    required: false
    overview: false
    notes:
      - Observed in the OpenBao 2.5.4 HA/Raft fixture and live Compose HA stack.
      - Used as the fallback source for normalized Raft peer count.
  - id: autopilot_healthy
    docsName: vault.autopilot.healthy
    prometheusName: ${p}_autopilot_healthy
    required: false
    overview: false
    notes:
      - Observed on the active node in the OpenBao 2.5.4 HA/Raft fixture.
  - id: autopilot_failure_tolerance
    docsName: vault.autopilot.failure_tolerance
    prometheusName: ${p}_autopilot_failure_tolerance
    required: false
    overview: false
    notes:
      - Observed on the active node in the OpenBao 2.5.4 HA/Raft fixture.
  - id: autopilot_node_healthy
    docsName: vault.autopilot.node_healthy
    prometheusName: ${p}_autopilot_node_healthy
    required: false
    overview: false
    notes:
      - Observed with a node_id label in the OpenBao 2.5.4 HA/Raft fixture.
  - id: audit_log_request_failure
    docsName: vault.audit.log_request_failure
    prometheusName: ${p}_audit_log_request_failure
    required: true
    overview: true
  - id: audit_log_response_failure
    docsName: vault.audit.log_response_failure
    prometheusName: ${p}_audit_log_response_failure
    required: true
    overview: true
  - id: audit_log_request
    docsName: vault.audit.log_request
    prometheusName: ${p}_audit_log_request
    required: true
    overview: true
    notes:
      - Observed as a summary in OpenBao 2.5.4 fixtures.
  - id: audit_log_response
    docsName: vault.audit.log_response
    prometheusName: ${p}_audit_log_response
    required: true
    overview: true
    notes:
      - Observed as a summary in OpenBao 2.5.4 fixtures.
  - id: audit_device_log_request
    docsName: vault.audit.{DEVICE}.log_request
    prometheusName: ${p}_audit_<device>__log_request
    fixturePrometheusName: ${p}_audit_local_file__log_request
    required: true
    overview: false
    notes:
      - Device name local-file is sanitized as local_file.
  - id: expire_num_leases
    docsName: vault.expire.num_leases
    prometheusName: ${p}_expire_num_leases
    required: true
    overview: true
    notes:
      - Observed without a cluster label in OpenBao 2.5.4 dev mode.
  - id: expire_num_irrevocable_leases
    docsName: vault.expire.num_irrevocable_leases
    prometheusName: ${p}_expire_num_irrevocable_leases
    required: true
    overview: false
    notes:
      - Observed without a cluster label in OpenBao 2.5.4 fixtures.
  - id: expire_revoke
    docsName: vault.expire.revoke
    prometheusName: ${p}_expire_revoke
    required: true
    overview: false
    notes:
      - Observed as a summary in OpenBao 2.5.4 fixtures.
  - id: expire_register_auth
    docsName: vault.expire.register_auth
    prometheusName: ${p}_expire_register_auth
    required: true
    overview: false
    notes:
      - Observed as a summary in OpenBao 2.5.4 fixtures.
  - id: token_count
    docsName: vault.token.count
    prometheusName: ${p}_token_count
    required: false
    overview: true
    notes:
      - Token count is a slow usage gauge.
      - Observed in the live OpenBao 2.5.4 Docker Compose HA stack with a namespace label.
      - Not required in short-lived fixtures because usage gauges can update later than the fixture capture window.
  - id: token_creation
    docsName: vault.token.creation
    prometheusName: ${p}_token_creation
    required: true
    overview: false
    notes:
      - Observed as a counter in OpenBao 2.5.4 fixtures.
      - Labels include auth_method, creation_ttl, mount_point, namespace, and token_type.
      - Generated dashboards must not group by mount_point or policy.
  - id: token_create
    docsName: vault.token.create
    prometheusName: ${p}_token_create
    required: true
    overview: false
    notes:
      - Observed as a summary in OpenBao 2.5.4 fixtures.
  - id: token_lookup
    docsName: vault.token.lookup
    prometheusName: ${p}_token_lookup
    required: true
    overview: false
    notes:
      - Observed as a summary in OpenBao 2.5.4 fixtures.
  - id: token_store

version: v0.1
maturity:
  lifecycle: draft
  evidence:
    - documented
    - fixture-validated
    - generated-validated
openbaoVersion: "2.6.0"
metricPrefixes:
  supported:
    - vault
    - openbao
  default: vault
normalization:
  recordingRulePrefix: openbao
  notes:
    - Use cluster for the platform-assigned OpenBao deployment identity, not the OpenBao-generated cluster label.
    - Use kubernetes_namespace for the Kubernetes workload namespace and openbao_namespace for the logical OpenBao namespace emitted by OpenBao metrics.
    - Use pod for workload identity, instance for the scrape endpoint, and scrape_profile with the value active or all_nodes.
    - Keep Prometheus honor_labels disabled so target identity cannot be replaced by labels from the scraped endpoint.
    - Recording rules must preserve cluster, kubernetes_namespace, openbao_namespace, pod, instance, and scrape_profile when the source signal has those labels.
    - Current fixtures validate root-namespace behavior, the team-a child namespace across several auth and secrets-engine paths, and a Raft topology with three voters plus one non-voter read replica.
    - Database lease behavior inside namespaces, nested namespace behavior, and feature-specific namespace behavior outside the captured scenario must be fixture-tested before dashboards or alerts depend on those dimensions.
fixtures:
  required:
    - fixtures/captured/openbao-2.6.0/metrics/openbao-2.6.0-vault-prefix.prom
    - fixtures/captured/openbao-2.6.0/metrics/openbao-2.6.0-openbao-prefix.prom
coverageProfiles:
  - id: vault-prefix
    class: prefix-smoke
    defaultExpectation: optional
  - id: openbao-prefix
    class: prefix-smoke
    defaultExpectation: optional
  - id: raft-vault-node0
    class: ha-raft-active
    defaultExpectation: optional
  - id: raft-vault-node1
    class: ha-raft-standby
    defaultExpectation: optional
  - id: raft-vault-node2
    class: ha-raft-standby
    defaultExpectation: optional
  - id: raft-vault-read-replica0
    class: ha-raft-read-replica
    defaultExpectation: optional
metrics:
  - id: core_active
    docsName: vault.core.active
    prometheusName: ${p}_core_active
    required: true
    overview: true
    notes:
      - Observed with a cluster label in OpenBao 2.6.0 dev mode.
  - id: core_unsealed
    docsName: vault.core.unsealed
    prometheusName: ${p}_core_unsealed
    required: true
    overview: true
    notes:
      - Observed with both cluster="" and a real cluster label in OpenBao 2.6.0 dev mode.
      - Generated rules must exclude or normalize the empty cluster series.
      - Unsealed node count is not voter count; non-voters and read replicas can also be unsealed.
  - id: core_handle_request
    docsName: vault.core.handle_request
    prometheusName: ${p}_core_handle_request
    required: true
    overview: true
    notes:
      - Observed as a summary in OpenBao 2.6.0 fixtures.
      - Used for regular request rate and request handling latency.

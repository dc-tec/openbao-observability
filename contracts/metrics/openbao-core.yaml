    prometheusName: ${p}_core_mount_table_num_entries
    required: true
    overview: false
    notes:
      - Observed with cluster, local, and type labels in OpenBao 2.6.0 fixtures.
      - Type and local are bounded labels suitable for aggregate mount inventory panels.

    notes:
      - Observed as a counter in the OpenBao 2.5.4 HA/Raft fixture after issuing database dynamic credentials.
      - Labels include namespace, secret_engine, mount_point, creation_ttl, and cluster.
      - Treat mount_point and creation_ttl as advanced labels; dashboards should aggregate by secret_engine unless a drilldown needs more detail.
  - id: pki_issue
    docsName: vault.pki.issue
    prometheusName: ${p}_pki_issue
    required: false
    overview: false
    notes:
      - Observed as a summary in the OpenBao 2.5.4 HA/Raft fixture after issuing a certificate from the default pki/ mount.
      - OpenBao derives this metric family from the PKI mount path; custom PKI mount names produce different source metric names.
      - Labels include namespace and role; role is bounded by PKI role inventory but should still be treated as drilldown data.
  - id: pki_revoke

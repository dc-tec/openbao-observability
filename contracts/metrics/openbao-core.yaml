version: v0.1
status: draft
openbaoVersion: "2.5.4"
metricPrefixes:
  supported:
    - vault
    - openbao
  default: vault
normalization:
  recordingRulePrefix: openbao
  notes:
    - Raw OpenBao metrics do not expose a consistent cluster label across all families.
    - Recording rules should add or normalize cluster, namespace, pod, job, and instance labels from scrape metadata.
fixtures:
  required:
    - fixtures/captured/openbao-2.5.4/metrics/openbao-2.5.4-vault-prefix.prom
    - fixtures/captured/openbao-2.5.4/metrics/openbao-2.5.4-openbao-prefix.prom
metrics:
  - id: core_active
    docsName: vault.core.active
    prometheusName: ${p}_core_active
    required: true
    overview: true
    notes:
      - Observed with a cluster label in OpenBao 2.5.4 dev mode.
  - id: core_unsealed
    docsName: vault.core.unsealed
    prometheusName: ${p}_core_unsealed
    required: true
    overview: true
    notes:
      - Observed with both cluster="" and a real cluster label in OpenBao 2.5.4 dev mode.
      - Generated rules must exclude or normalize the empty cluster series.
  - id: core_handle_request
    docsName: vault.core.handle_request
    prometheusName: ${p}_core_handle_request
    required: true
    overview: true
    notes:
      - Observed as a summary in OpenBao 2.5.4 fixtures.
      - Used for regular request rate and request handling latency.
  - id: core_handle_login_request

    overview: false
    notes:
      - Observed as a summary in OpenBao 2.5.4 fixtures.
  - id: runtime_num_goroutines
    docsName: vault.runtime.num_goroutines
    prometheusName: ${p}_runtime_num_goroutines
    required: true
    overview: true
    notes:
      - Observed without a cluster label in OpenBao 2.5.4 dev mode.
  - id: runtime_alloc_bytes
    docsName: vault.runtime.alloc_bytes
    prometheusName: ${p}_runtime_alloc_bytes
    required: true
    overview: false
    notes:
      - Observed as an unlabeled gauge in OpenBao 2.5.4 fixtures.
      - Use with runtime_sys_bytes and runtime_heap_objects to interpret memory pressure.
  - id: runtime_heap_objects
    docsName: vault.runtime.heap_objects

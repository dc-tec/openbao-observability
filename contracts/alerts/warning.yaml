version: v0.1
status: draft
metricPrefixVariable: ${p}
sourcePrefix: vault
alerts:
  - id: OpenBaoIrrevocableLeasesPresent
    type: prometheus
    severity: warning
    signal: metrics
    for: 10m
    expression: openbao:expire_num_irrevocable_leases:max > 0
    summary: OpenBao reports irrevocable leases
    description: OpenBao reports one or more leases that it cannot automatically revoke.
    runbook: docs/runbooks/irrevocable-leases.md
    labels:
      component: leases
  - id: OpenBaoStorageBarrierLatencyElevated
    type: prometheus
    severity: warning
    signal: metrics
    for: 15m
    expression: >-
      (openbao:barrier_get:avg5m > 3 * clamp_min(avg_over_time(openbao:barrier_get:avg5m[1h]), 0.001))
      or (openbao:barrier_put:avg5m > 3 * clamp_min(avg_over_time(openbao:barrier_put:avg5m[1h]), 0.001))
      or (openbao:barrier_list:avg5m > 3 * clamp_min(avg_over_time(openbao:barrier_list:avg5m[1h]), 0.001))
      or (openbao:barrier_delete:avg5m > 3 * clamp_min(avg_over_time(openbao:barrier_delete:avg5m[1h]), 0.001))
    summary: OpenBao storage barrier latency is elevated
    description: OpenBao storage barrier latency is more than three times its recent baseline.
    runbook: docs/runbooks/runtime-storage-warnings.md
    labels:
      component: storage
      subsystem: barrier
  - id: OpenBaoStorageCacheHitRatioLow
    type: prometheus
    severity: warning
    signal: metrics
    for: 15m
    expression: (openbao:cache_hit:rate5m + openbao:cache_miss:rate5m) > 1 and openbao:cache_hit_ratio:ratio5m < 0.50
    summary: OpenBao storage cache hit ratio is low
    description: OpenBao storage cache hit ratio is below 50 percent while cache traffic is active.
    runbook: docs/runbooks/runtime-storage-warnings.md
    labels:
      component: storage
      subsystem: cache
  - id: OpenBaoRuntimeMemoryGrowth
    type: prometheus
    severity: warning
    signal: metrics
    for: 15m
    expression: predict_linear(openbao:runtime_sys_bytes:max[30m], 3600) > openbao:runtime_sys_bytes:max * 1.5 and openbao:runtime_sys_bytes:max > 0
    summary: OpenBao runtime memory is projected to grow
    description: OpenBao Go runtime system memory is projected to grow by more than 50 percent over the next hour.
    runbook: docs/runbooks/runtime-storage-warnings.md
    labels:
      component: runtime
      subsystem: memory
  - id: OpenBaoMountTableGrowth
    type: prometheus
    severity: warning
    signal: metrics
    for: 10m
    expression: sum(openbao:core_mount_table_num_entries:max) - sum(openbao:core_mount_table_num_entries:max offset 1h) > 5
    summary: OpenBao mount table grew quickly
    description: OpenBao reports more than five additional mount table entries compared with one hour ago.
    runbook: docs/runbooks/runtime-storage-warnings.md
    labels:
      component: core
      subsystem: mounts
  - id: OpenBaoPKIOperationFailures
    type: prometheus
    severity: warning
    signal: metrics
    for: 5m
    expression: (openbao:pki_issue_failure:increase15m > 0) or (openbao:pki_revoke_failure:increase15m > 0)
    summary: OpenBao PKI operations are failing
    description: OpenBao reports failed PKI issue or revoke operations over the alert window.
    runbook: docs/runbooks/secret-engine-feature-warnings.md
    labels:
      component: secret-engines
      subsystem: pki
  - id: OpenBaoPKIOperationLatencyElevated
    type: prometheus
    severity: warning
    signal: metrics
    for: 15m
    expression: >-
      ((openbao:pki_issue:rate5m > 0)
      and (openbao:pki_issue:avg5m > 3 * clamp_min(avg_over_time(openbao:pki_issue:avg5m[1h]), 0.001)))
      or ((openbao:pki_revoke:rate5m > 0)
      and (openbao:pki_revoke:avg5m > 3 * clamp_min(avg_over_time(openbao:pki_revoke:avg5m[1h]), 0.001)))
    summary: OpenBao PKI operation latency is elevated
    description: OpenBao PKI issue or revoke latency is more than three times its recent baseline while PKI operations are active.
    runbook: docs/runbooks/secret-engine-feature-warnings.md
    labels:
      component: secret-engines
      subsystem: pki
  - id: OpenBaoDatabaseCredentialOperationFailures
    type: prometheus
    severity: warning
    signal: metrics
    for: 5m
    expression: >-
      (openbao:database_initialize_error:increase15m > 0)
      or (openbao:database_new_user_error:increase15m > 0)
      or (openbao:database_update_user_error:increase15m > 0)
      or (openbao:database_delete_user_error:increase15m > 0)
    summary: OpenBao database credential operations are failing
    description: OpenBao reports failed database secrets engine initialize, create, renew, or revoke operations over the alert window.
    runbook: docs/runbooks/secret-engine-feature-warnings.md
    labels:
      component: secret-engines
      subsystem: database
  - id: OpenBaoDatabaseCredentialOperationLatencyElevated
    type: prometheus
    severity: warning
    signal: metrics
    for: 15m
    expression: >-
      ((openbao:database_new_user:rate5m > 0)
      and (openbao:database_new_user:avg5m > 3 * clamp_min(avg_over_time(openbao:database_new_user:avg5m[1h]), 0.001)))
      or ((openbao:database_update_user:rate5m > 0)
      and (openbao:database_update_user:avg5m > 3 * clamp_min(avg_over_time(openbao:database_update_user:avg5m[1h]), 0.001)))
      or ((openbao:database_delete_user:rate5m > 0)
      and (openbao:database_delete_user:avg5m > 3 * clamp_min(avg_over_time(openbao:database_delete_user:avg5m[1h]), 0.001)))
    summary: OpenBao database credential operation latency is elevated
    description: OpenBao database credential create, renew, or revoke latency is more than three times its recent baseline while database operations are active.
    runbook: docs/runbooks/secret-engine-feature-warnings.md
    labels:
      component: secret-engines
      subsystem: database
  - id: OpenBaoOperationalLogStreamMissing
    type: loki
    severity: warning
    signal: loki
    for: 10m
    expression: absent_over_time({log_stream="openbao.operational"}[10m])
    summary: OpenBao operational log stream is missing
    description: Loki has not received OpenBao operational logs for the alert window.
    runbook: docs/runbooks/operational-log-stream-missing.md
  - id: OpenBaoAuditStreamMissing
    type: loki
    severity: warning
    signal: loki
    for: 10m
    expression: absent_over_time({log_stream="openbao.audit"}[10m])
    summary: OpenBao audit log stream has no events
    description: Loki has not received any OpenBao audit events for the alert window; use the audit canary alert for the production critical signal.
    runbook: docs/runbooks/audit-log-stream-missing.md
  - id: OpenBaoDebugTraceLoggingEnabled
    type: loki
    severity: warning
    signal: loki
    for: 5m
    expression: 'sum(count_over_time({log_stream="openbao.operational"} |~ "\"@level\":\"(debug|trace)\"" [5m])) > 0'
    summary: OpenBao debug or trace logging is enabled
    description: OpenBao operational logs include debug or trace entries, which can increase cost and expose sensitive metadata.
    runbook: docs/runbooks/debug-logging-enabled.md

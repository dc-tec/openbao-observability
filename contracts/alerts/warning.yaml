version: v0.1
status: draft
metricPrefixVariable: ${p}
sourcePrefix: vault
alerts:
  - id: OpenBaoOperationalLogStreamMissing
    type: loki
    severity: warning
    signal: loki
    for: 10m
    expression: absent_over_time({log_stream="openbao.operational"}[10m])
    summary: OpenBao operational log stream is missing
    description: Loki has not received OpenBao operational logs for the alert window.
    runbook: docs/runbooks/operational-log-stream-missing.md
  - id: OpenBaoDebugTraceLoggingEnabled
    type: loki
    severity: warning
    signal: loki
    for: 5m
    expression: 'sum(count_over_time({log_stream="openbao.operational"} |~ "\"@level\":\"(debug|trace)\"" [5m])) > 0'
    summary: OpenBao debug or trace logging is enabled
    description: OpenBao operational logs include debug or trace entries, which can increase cost and expose sensitive metadata.
    runbook: docs/runbooks/debug-logging-enabled.md

version: v0.1
maturity:
  lifecycle: reference
  evidence:
    - documented
    - generated-validated
metricPrefixVariable: ${p}
sourcePrefix: vault
alerts:
  - id: OpenBaoAuditConfigurationActivity
    type: loki
    severity: warning
    signal: loki
    for: 0m
    expression: 'sum by (cluster, kubernetes_namespace) (count_over_time({log_stream="openbao.audit"} | json operation="request.operation", request_path="request.path" | operation=~"create|update|delete" | request_path=~"sys/audit(/.*)?" [5m])) > 0'
    summary: OpenBao audit configuration changed
    description: OpenBao audit logs show create, update, or delete activity against audit configuration paths.
    runbook: docs/runbooks/security-audit-detections.md
    labels:
      component: audit
      category: security-detection
      detection: audit-configuration
  - id: OpenBaoRootPolicyMutation
    type: loki
    severity: warning
    signal: loki
    for: 0m
    expression: 'sum by (cluster, kubernetes_namespace) (count_over_time({log_stream="openbao.audit"} | json operation="request.operation", request_path="request.path" | operation=~"create|update|delete" | request_path=~"sys/policies/(acl/)?root" [5m])) > 0'
    summary: OpenBao root policy changed
    description: OpenBao audit logs show create, update, or delete activity against the root policy path.
    runbook: docs/runbooks/security-audit-detections.md
    labels:
      component: policy
      category: security-detection
      detection: root-policy
  - id: OpenBaoPrivilegedConfigurationMutation
    type: loki
    severity: warning
    signal: loki
    for: 0m
    expression: 'sum by (cluster, kubernetes_namespace) (count_over_time({log_stream="openbao.audit"} | json operation="request.operation", request_path="request.path" | operation=~"create|update|delete" | request_path=~"sys/(policies|auth|mounts)(/.*)?" [5m])) > 0'
    summary: OpenBao privileged configuration changed
    description: OpenBao audit logs show create, update, or delete activity against policy, auth method, or mount configuration paths.
    runbook: docs/runbooks/security-audit-detections.md
    labels:
      component: security
      category: security-detection
      detection: privileged-configuration
  - id: OpenBaoHighRiskSystemPathActivity
    type: loki
    severity: warning
    signal: loki
    for: 0m
    expression: 'sum by (cluster, kubernetes_namespace) (count_over_time({log_stream="openbao.audit"} | json request_path="request.path" | request_path=~"sys/(raw|plugins|storage/raft|rotate)(/.*)?" [5m])) > 0'
    summary: OpenBao high-risk system path activity observed
    description: OpenBao audit logs show activity against high-risk system paths such as raw storage, plugins, Raft storage, or rotation endpoints.
    runbook: docs/runbooks/security-audit-detections.md
    labels:
      component: security
      category: security-detection
      detection: high-risk-system-path
  - id: OpenBaoPermissionDeniedBurst
    type: loki
    severity: warning
    signal: loki
    for: 5m
    expression: 'sum by (cluster, kubernetes_namespace) (count_over_time({log_stream="openbao.audit"} | json audit_type="type", audit_error="error" | audit_type="response" | audit_error=~"(?s).*permission denied.*" [5m])) > 10'
    summary: OpenBao permission denied responses increased
    description: OpenBao audit logs show more than ten permission denied responses over 5 minutes.
    runbook: docs/runbooks/security-audit-detections.md
    labels:
      component: audit
      category: security-detection
      detection: permission-denied-burst
  - id: OpenBaoCompletedRequestLoggingObserved
    type: loki
    severity: warning
    signal: loki
    for: 5m
    expression: 'sum by (cluster, kubernetes_namespace) (count_over_time({log_stream="openbao.completed_requests"}[5m])) > 0'
    summary: OpenBao completed request logging is active
    description: Loki has received completed request logs, which should only exist during an approved troubleshooting window.
    runbook: docs/runbooks/completed-request-logging-enabled.md
    labels:
      component: logging
      category: security-posture
      detection: completed-request-logging

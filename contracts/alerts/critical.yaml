version: v0.1
maturity:
  lifecycle: draft
  evidence:
    - documented
    - generated-validated
metricPrefixVariable: ${p}
sourcePrefix: vault
alerts:
  - id: OpenBaoUnreachable
    type: prometheus
    severity: critical
    signal: metrics
    for: 5m
    expression: (up{job="openbao"} == 0) or absent(up{job="openbao"})
    summary: OpenBao metrics scrape is failing
    description: An OpenBao scrape target is down, or the canonical OpenBao job is missing, for at least 5 minutes.
    runbook: docs/runbooks/openbao-metrics-scrape-failing.md
  - id: OpenBaoSealedUnexpectedly
    type: prometheus
    severity: critical
    signal: metrics
    for: 2m
    expression: openbao:core_unsealed:min == 0
    summary: OpenBao is sealed
    description: A scraped OpenBao node reports that it is sealed.
    runbook: docs/runbooks/openbao-sealed-unexpectedly.md
  - id: OpenBaoNoActiveNode
    type: prometheus
    severity: critical
    signal: metrics
    for: 2m
    expression: openbao:core_active:sum == 0
    summary: OpenBao has no active node
    description: No active OpenBao node is visible to Prometheus.
    runbook: docs/runbooks/no-active-openbao-leader.md
  - id: OpenBaoCoreActiveSignalMissing
    type: prometheus
    severity: critical
    signal: metrics
    for: 5m
    expression: >-
      max by (cluster, kubernetes_namespace, scrape_profile) (up{job="openbao"} == 1)
      unless on (cluster, kubernetes_namespace, scrape_profile)
      openbao:core_active:sum
    summary: OpenBao active-node signal is missing
    description: Prometheus can scrape OpenBao, but the required normalized active-node signal is missing.
    runbook: docs/runbooks/no-active-openbao-leader.md
  - id: OpenBaoMultipleActiveNodes
    type: prometheus
    severity: critical
    signal: metrics
    for: 2m
    expression: openbao:core_active:sum > 1
    summary: OpenBao has multiple active nodes
    description: More than one active OpenBao node is visible to Prometheus.
    runbook: docs/runbooks/multiple-active-nodes.md
  - id: OpenBaoAllPodsUnavailable
    type: prometheus
    severity: critical
    signal: platform
    for: 5m
    expression: sum by (cluster, namespace) (kube_pod_container_status_ready{pod=~"openbao.*",container=~"openbao|bao"}) == 0
    summary: All OpenBao Kubernetes pods are unavailable
    description: Kubernetes reports no ready OpenBao workload containers for the selected platform metrics.
    runbook: docs/runbooks/kubernetes-platform-health.md
    labels:
      component: kubernetes
      subsystem: workload
  - id: OpenBaoAuditPVCPressure
    type: prometheus
    severity: critical
    signal: platform
    for: 10m
    expression: 100 * min by (cluster, namespace, persistentvolumeclaim) (kubelet_volume_stats_available_bytes{persistentvolumeclaim=~".*(openbao|bao|audit|data).*"}) / min by (cluster, namespace, persistentvolumeclaim) (kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~".*(openbao|bao|audit|data).*"}) < 15
    summary: OpenBao audit or data PVC free space is low
    description: A matching OpenBao audit or data PVC has less than 15 percent free space.
    runbook: docs/runbooks/kubernetes-platform-health.md
    labels:
      component: kubernetes
      subsystem: storage
  - id: OpenBaoRaftPeerCountLow
    type: prometheus
    severity: critical
    signal: metrics
    for: 2m
    expression: openbao:raft_peers:max < 3
    summary: OpenBao Raft peer count is below the HA baseline
    description: OpenBao Raft reports fewer than three peers, which removes the baseline redundancy expected for this reference architecture.
    runbook: docs/runbooks/raft-autopilot-health.md
    labels:
      component: raft
  - id: OpenBaoAutopilotUnhealthy
    type: prometheus
    severity: critical
    signal: metrics
    for: 2m
    expression: openbao:autopilot_healthy:max == 0
    summary: OpenBao Autopilot reports an unhealthy cluster
    description: OpenBao Autopilot reports that the integrated storage cluster is unhealthy.
    runbook: docs/runbooks/raft-autopilot-health.md
    labels:
      component: raft
      subsystem: autopilot
  - id: OpenBaoAutopilotFailureToleranceLost
    type: prometheus
    severity: critical
    signal: metrics
    for: 2m
    expression: openbao:raft_peers:max >= 3 and openbao:autopilot_failure_tolerance:max < 1
    summary: OpenBao Autopilot has no tolerated voter failure
    description: OpenBao Autopilot reports that the Raft cluster cannot lose a voter while maintaining the configured HA baseline.
    runbook: docs/runbooks/raft-autopilot-health.md
    labels:
      component: raft
      subsystem: autopilot
  - id: OpenBaoAutopilotNodeUnhealthy
    type: prometheus
    severity: critical
    signal: metrics
    for: 2m
    expression: openbao:autopilot_node_healthy:min == 0
    summary: OpenBao Autopilot reports an unhealthy node
    description: OpenBao Autopilot reports that at least one known Raft node is unhealthy.
    runbook: docs/runbooks/raft-autopilot-health.md
    labels:
      component: raft
      subsystem: autopilot
  - id: OpenBaoAuditRequestFailures
    type: prometheus
    severity: critical
    signal: metrics
    for: 0m
    expression: openbao:audit_log_request_failure:increase5m > 0
    summary: OpenBao audit request logging failed
    description: OpenBao reported at least one audit request logging failure.
    runbook: docs/runbooks/audit-request-response-failures.md
  - id: OpenBaoAuditResponseFailures
    type: prometheus
    severity: critical
    signal: metrics
    for: 0m
    expression: openbao:audit_log_response_failure:increase5m > 0
    summary: OpenBao audit response logging failed
    description: OpenBao reported at least one audit response logging failure.
    runbook: docs/runbooks/audit-request-response-failures.md
  - id: OpenBaoAuditCanaryMissing
    type: loki
    severity: critical
    signal: loki
    for: 15m
    expression: 'absent_over_time({log_stream="openbao.audit"} | json request_path="request.path" | request_path="secret/data/observability/audit-canary" [15m])'
    summary: OpenBao audit canary is missing
    description: Loki has not received the expected OpenBao audit canary request for the alert window.
    runbook: docs/runbooks/audit-canary-missing.md
    labels:
      component: audit
  - id: OpenBaoAuditArchiveDegraded
    type: prometheus
    severity: critical
    signal: archive
    for: 10m
    expression: >-
      (max by (cluster, environment, backend, pipeline) (openbao_audit_archive_enabled) == 1)
      and on (cluster, environment, backend, pipeline)
      (
        min by (cluster, environment, backend, pipeline) (openbao_audit_archive_delivery_success) == 0
        or (
          (max by (cluster, environment, backend, pipeline) (openbao_audit_archive_enabled) == 1)
          unless on (cluster, environment, backend, pipeline)
          min by (cluster, environment, backend, pipeline) (openbao_audit_archive_delivery_success)
        )
        or (
          (max by (cluster, environment, backend, pipeline) (openbao_audit_archive_enabled) == 1)
          unless on (cluster, environment, backend, pipeline)
          max by (cluster, environment, backend, pipeline) (openbao_audit_archive_last_success_timestamp_seconds)
        )
        or (
          (max by (cluster, environment, backend, pipeline) (openbao_audit_archive_enabled) == 1)
          unless on (cluster, environment, backend, pipeline)
          sum by (cluster, environment, backend, pipeline) (openbao_audit_archive_delivery_failures_total)
        )
        or (
          (max by (cluster, environment, backend, pipeline) (openbao_audit_archive_enabled) == 1)
          unless on (cluster, environment, backend, pipeline)
          sum by (cluster, environment, backend, pipeline) (openbao_audit_archive_dead_letter_records_total)
        )
        or (time() - max by (cluster, environment, backend, pipeline) (openbao_audit_archive_last_success_timestamp_seconds)) > 900
        or sum by (cluster, environment, backend, pipeline) (increase(openbao_audit_archive_delivery_failures_total[15m])) > 0
        or sum by (cluster, environment, backend, pipeline) (increase(openbao_audit_archive_dead_letter_records_total[15m])) > 0
      )
    summary: OpenBao audit archive is degraded
    description: The durable OpenBao audit archive path is enabled but missing, stale, failing, or dead-lettering records.
    runbook: docs/runbooks/audit-archive-degraded.md
    labels:
      component: audit
      subsystem: archive
  - id: OpenBaoAuditArchiveSignalMissing
    type: prometheus
    severity: critical
    signal: archive
    for: 10m
    expression: >-
      openbao_observability_signal_expected{signal="audit_archive"} == 1
      unless on (cluster, environment, backend, pipeline)
      max by (cluster, environment, backend, pipeline) (openbao_audit_archive_enabled)
    summary: OpenBao audit archive health signal is missing
    description: The archive health signal is required for this pipeline, but Prometheus has no matching enabled marker.
    runbook: docs/runbooks/audit-archive-degraded.md
    labels:
      component: audit
      subsystem: archive

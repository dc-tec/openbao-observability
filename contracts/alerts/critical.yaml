version: v0.1
status: draft
metricPrefixVariable: ${p}
sourcePrefix: vault
alerts:
  - id: OpenBaoUnreachable
    type: prometheus
    severity: critical
    signal: metrics
    for: 5m
    expression: min_over_time(up{job=~"openbao.*"}[5m]) == 0
    summary: OpenBao metrics scrape is failing
    description: Prometheus cannot scrape OpenBao for at least 5 minutes.
    runbook: docs/runbooks/openbao-metrics-scrape-failing.md
  - id: OpenBaoSealedUnexpectedly
    type: prometheus
    severity: critical
    signal: metrics
    for: 2m
    expression: ${p}_core_unsealed{cluster!=""} == 0
    summary: OpenBao is sealed
    description: A scraped OpenBao node reports that it is sealed.
    runbook: docs/runbooks/openbao-sealed-unexpectedly.md
  - id: OpenBaoNoActiveNode
    type: prometheus
    severity: critical
    signal: metrics
    for: 2m
    expression: sum(${p}_core_active) == 0
    summary: OpenBao has no active node
    description: No active OpenBao node is visible to Prometheus.
    runbook: docs/runbooks/no-active-openbao-leader.md
  - id: OpenBaoMultipleActiveNodes
    type: prometheus
    severity: critical
    signal: metrics
    for: 2m
    expression: sum(${p}_core_active) > 1
    summary: OpenBao has multiple active nodes
    description: More than one active OpenBao node is visible to Prometheus.
    runbook: docs/runbooks/multiple-active-nodes.md
  - id: OpenBaoAuditRequestFailures
    type: prometheus
    severity: critical
    signal: metrics
    for: 0m
    expression: sum(increase(${p}_audit_log_request_failure[5m])) > 0
    summary: OpenBao audit request logging failed
    description: OpenBao reported at least one audit request logging failure.
    runbook: docs/runbooks/audit-request-response-failures.md
  - id: OpenBaoAuditResponseFailures
    type: prometheus
    severity: critical
    signal: metrics
    for: 0m
    expression: sum(increase(${p}_audit_log_response_failure[5m])) > 0
    summary: OpenBao audit response logging failed
    description: OpenBao reported at least one audit response logging failure.
    runbook: docs/runbooks/audit-request-response-failures.md
  - id: OpenBaoAuditStreamMissing
    type: loki
    severity: critical
    signal: loki
    for: 10m
    expression: absent_over_time({log_stream="openbao.audit"}[10m])
    summary: OpenBao audit log stream is missing
    description: Loki has not received OpenBao audit logs for the alert window.
    runbook: docs/runbooks/audit-log-stream-missing.md

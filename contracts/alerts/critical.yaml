version: v0.1
status: draft
metricPrefixVariable: ${p}
sourcePrefix: vault
alerts:
  - id: OpenBaoUnreachable
    type: prometheus
    severity: critical
    signal: metrics
    for: 5m
    expression: min_over_time(up{job=~"openbao.*"}[5m]) == 0
    summary: OpenBao metrics scrape is failing
    description: Prometheus cannot scrape OpenBao for at least 5 minutes.
    runbook: docs/runbooks/openbao-metrics-scrape-failing.md
  - id: OpenBaoSealedUnexpectedly
    type: prometheus
    severity: critical
    signal: metrics
    for: 2m
    expression: ${p}_core_unsealed{cluster!=""} == 0
    summary: OpenBao is sealed
    description: A scraped OpenBao node reports that it is sealed.
    runbook: docs/runbooks/openbao-sealed-unexpectedly.md
  - id: OpenBaoNoActiveNode
    type: prometheus
    severity: critical
    signal: metrics
    for: 2m
    expression: sum(${p}_core_active) == 0
    summary: OpenBao has no active node
    description: No active OpenBao node is visible to Prometheus.
    runbook: docs/runbooks/no-active-openbao-leader.md
  - id: OpenBaoMultipleActiveNodes
    type: prometheus
    severity: critical
    signal: metrics
    for: 2m
    expression: sum(${p}_core_active) > 1
    summary: OpenBao has multiple active nodes
    description: More than one active OpenBao node is visible to Prometheus.
    runbook: docs/runbooks/multiple-active-nodes.md
  - id: OpenBaoRaftPeerCountLow
    type: prometheus
    severity: critical
    signal: metrics
    for: 2m
    expression: openbao:raft_peers:max < 3
    summary: OpenBao Raft peer count is below the HA baseline
    description: OpenBao Raft reports fewer than three peers, which removes the baseline redundancy expected for this reference architecture.
    runbook: docs/runbooks/raft-autopilot-health.md
    labels:
      component: raft
  - id: OpenBaoAutopilotUnhealthy
    type: prometheus
    severity: critical
    signal: metrics
    for: 2m
    expression: openbao:autopilot_healthy:max == 0
    summary: OpenBao Autopilot reports an unhealthy cluster
    description: OpenBao Autopilot reports that the integrated storage cluster is unhealthy.
    runbook: docs/runbooks/raft-autopilot-health.md
    labels:
      component: raft
      subsystem: autopilot
  - id: OpenBaoAutopilotFailureToleranceLost
    type: prometheus
    severity: critical
    signal: metrics
    for: 2m
    expression: openbao:raft_peers:max >= 3 and openbao:autopilot_failure_tolerance:max < 1
    summary: OpenBao Autopilot has no tolerated voter failure
    description: OpenBao Autopilot reports that the Raft cluster cannot lose a voter while maintaining the configured HA baseline.
    runbook: docs/runbooks/raft-autopilot-health.md
    labels:
      component: raft
      subsystem: autopilot
  - id: OpenBaoAutopilotNodeUnhealthy
    type: prometheus
    severity: critical
    signal: metrics
    for: 2m
    expression: openbao:autopilot_node_healthy:min == 0
    summary: OpenBao Autopilot reports an unhealthy node
    description: OpenBao Autopilot reports that at least one known Raft node is unhealthy.
    runbook: docs/runbooks/raft-autopilot-health.md
    labels:
      component: raft
      subsystem: autopilot
  - id: OpenBaoAuditRequestFailures
    type: prometheus
    severity: critical
    signal: metrics
    for: 0m
    expression: sum(increase(${p}_audit_log_request_failure[5m])) > 0
    summary: OpenBao audit request logging failed
    description: OpenBao reported at least one audit request logging failure.
    runbook: docs/runbooks/audit-request-response-failures.md
  - id: OpenBaoAuditResponseFailures
    type: prometheus
    severity: critical
    signal: metrics
    for: 0m
    expression: sum(increase(${p}_audit_log_response_failure[5m])) > 0
    summary: OpenBao audit response logging failed
    description: OpenBao reported at least one audit response logging failure.
    runbook: docs/runbooks/audit-request-response-failures.md
  - id: OpenBaoAuditStreamMissing
    type: loki
    severity: critical
    signal: loki
    for: 10m
    expression: absent_over_time({log_stream="openbao.audit"}[10m])
    summary: OpenBao audit log stream is missing
    description: Loki has not received OpenBao audit logs for the alert window.
    runbook: docs/runbooks/audit-log-stream-missing.md

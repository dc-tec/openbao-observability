version: v0.1
maturity:
  lifecycle: draft
  evidence:
    - generated-validated
uid: openbao-audit-investigation
title: OpenBao audit investigation
refresh: 30s
tags:
  - audit
  - generated
  - investigation
  - openbao
  - reference
timeRange:
  from: now-1h
  to: now
datasources:
  metrics:
    type: prometheus
    uid: prometheus
  logs:
    type: loki
    uid: loki
variables:
  - name: cluster
    label: Cluster
    type: textbox
    default: .*
  - name: kubernetes_namespace
    label: Kubernetes namespace
    type: textbox
    default: .*
  - name: request_id
    label: Request ID
    type: textbox
    default: .*
  - name: request_path
    label: Request path
    type: textbox
    default: .*
  - name: operation
    label: Operation
    type: custom
    default: .*
    options:
      - .*
      - read
      - list
      - create
      - update
      - delete
  - name: node_id
    label: Node
    type: textbox
    default: .*
panels:
  - id: filtered-audit-events
    title: Filtered audit events
    type: stat
    signal: logs
    datasource: logs
    expression: 'sum by (cluster, kubernetes_namespace) (count_over_time({cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json operation="request.operation", request_id="request.id", request_path="request.path" | request_id=~"${request_id:raw}" | request_path=~"${request_path:raw}" | operation=~"${operation:raw}" [5m]))'
    unit: short
    description: Shows audit events matching the selected investigation filters over 5 minutes.
    grid:
      x: 0
      y: 0
      w: 6
      h: 4
  - id: risky-system-mutations
    title: Risky sys mutations
    type: stat
    signal: logs
    datasource: logs
    expression: 'sum by (cluster, kubernetes_namespace) (count_over_time({cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json operation="request.operation", request_id="request.id", request_path="request.path" | operation=~"create|update|delete" | request_path=~"sys/(auth|audit|mounts|policies|raw|plugins|storage/raft|rotate).*" | request_id=~"${request_id:raw}" | request_path=~"${request_path:raw}" [5m]))'
    unit: short
    description: Shows audited mutations against high-risk system paths over 5 minutes.
    grid:
      x: 6
      y: 0
      w: 6
      h: 4
  - id: auth-activity
    title: Auth activity
    type: stat
    signal: logs
    datasource: logs
    expression: 'sum by (cluster, kubernetes_namespace) (count_over_time({cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json operation="request.operation", request_id="request.id", request_path="request.path" | request_path=~"(auth/.*|sys/auth/.*)" | request_id=~"${request_id:raw}" | request_path=~"${request_path:raw}" | operation=~"${operation:raw}" [5m]))'
    unit: short
    description: Shows audited auth method, login, user, and token activity over 5 minutes.
    grid:
      x: 12
      y: 0
      w: 6
      h: 4
  - id: audit-response-errors
    title: Response errors
    type: stat
    signal: logs
    datasource: logs
    expression: 'sum by (cluster, kubernetes_namespace) (count_over_time({cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json audit_type="type", audit_error="error", operation="request.operation", request_id="request.id", request_path="request.path" | audit_type="response" | audit_error!="" | request_id=~"${request_id:raw}" | request_path=~"${request_path:raw}" | operation=~"${operation:raw}" [5m]))'
    unit: short
    description: Shows audited response entries with error fields over 5 minutes.
    grid:
      x: 18
      y: 0
      w: 6
      h: 4
  - id: filtered-audit-events-by-node
    title: Filtered events by node
    type: timeseries
    signal: logs
    datasource: logs
    expression: 'sum by (cluster, kubernetes_namespace, node_id) (count_over_time({cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json operation="request.operation", request_id="request.id", request_path="request.path" | request_id=~"${request_id:raw}" | request_path=~"${request_path:raw}" | operation=~"${operation:raw}" [5m]))'
    legend: "{{cluster}} {{kubernetes_namespace}} {{node_id}}"
    unit: short
    description: Shows filtered audit event volume by OpenBao node over 5 minutes.
    grid:
      x: 0
      y: 4
      w: 12
      h: 8
  - id: risky-system-activity-by-node
    title: Risky sys activity by node
    type: timeseries
    signal: logs
    datasource: logs
    expression: 'sum by (cluster, kubernetes_namespace, node_id) (count_over_time({cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json operation="request.operation", request_id="request.id", request_path="request.path" | operation=~"create|update|delete" | request_path=~"sys/(auth|audit|mounts|policies|raw|plugins|storage/raft|rotate).*" | request_id=~"${request_id:raw}" | request_path=~"${request_path:raw}" [5m]))'
    legend: "{{cluster}} {{kubernetes_namespace}} {{node_id}}"
    unit: short
    description: Shows high-risk system path mutation volume by OpenBao node over 5 minutes.
    grid:
      x: 12
      y: 4
      w: 12
      h: 8
  - id: audit-configuration-activity
    title: Audit config changes
    type: stat
    signal: logs
    datasource: logs
    expression: 'sum by (cluster, kubernetes_namespace) (count_over_time({cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json operation="request.operation", request_id="request.id", request_path="request.path" | operation=~"create|update|delete" | request_path=~"sys/audit(/.*)?" | request_id=~"${request_id:raw}" | request_path=~"${request_path:raw}" [15m]))'
    unit: short
    description: Shows audited audit configuration changes that match the selected filters over 15 minutes.
    grid:
      x: 0
      y: 12
      w: 6
      h: 4
  - id: privileged-configuration-mutations
    title: Privileged config changes
    type: stat
    signal: logs
    datasource: logs
    expression: 'sum by (cluster, kubernetes_namespace) (count_over_time({cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json operation="request.operation", request_id="request.id", request_path="request.path" | operation=~"create|update|delete" | request_path=~"sys/(policies|auth|mounts)(/.*)?" | request_id=~"${request_id:raw}" | request_path=~"${request_path:raw}" [15m]))'
    unit: short
    description: Shows audited policy, auth method, and mount configuration changes that match the selected filters over 15 minutes.
    grid:
      x: 6
      y: 12
      w: 6
      h: 4
  - id: high-risk-system-path-activity
    title: High-risk sys paths
    type: stat
    signal: logs
    datasource: logs
    expression: 'sum by (cluster, kubernetes_namespace) (count_over_time({cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json request_id="request.id", request_path="request.path" | request_path=~"sys/(raw|plugins|storage/raft|rotate)(/.*)?" | request_id=~"${request_id:raw}" | request_path=~"${request_path:raw}" [15m]))'
    unit: short
    description: Shows audited high-risk system path activity that matches the selected filters over 15 minutes.
    grid:
      x: 12
      y: 12
      w: 6
      h: 4
  - id: permission-denied-responses
    title: Permission denied
    type: stat
    signal: logs
    datasource: logs
    expression: 'sum by (cluster, kubernetes_namespace) (count_over_time({cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json audit_type="type", audit_error="error", request_id="request.id", request_path="request.path" | audit_type="response" | audit_error=~"(?s).*permission denied.*" | request_id=~"${request_id:raw}" | request_path=~"${request_path:raw}" [15m]))'
    unit: short
    description: Shows audited permission denied responses that match the selected filters over 15 minutes.
    grid:
      x: 18
      y: 12
      w: 6
      h: 4
  - id: request-id-drilldown
    title: Request ID drilldown
    type: logs
    signal: logs
    datasource: logs
    expression: '{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json operation="request.operation", request_id="request.id", request_path="request.path" | request_id=~"${request_id:raw}" | request_path=~"${request_path:raw}" | operation=~"${operation:raw}"'
    description: Shows audit entries matching the selected request ID, path, operation, and node filters.
    grid:
      x: 0
      y: 16
      w: 12
      h: 9
  - id: risky-system-events
    title: Risky sys events
    type: logs
    signal: logs
    datasource: logs
    expression: '{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json operation="request.operation", request_id="request.id", request_path="request.path" | operation=~"create|update|delete" | request_path=~"sys/(auth|audit|mounts|policies|raw|plugins|storage/raft|rotate).*" | request_id=~"${request_id:raw}" | request_path=~"${request_path:raw}"'
    description: Shows audited create, update, and delete operations against high-risk system paths.
    grid:
      x: 12
      y: 16
      w: 12
      h: 9
  - id: auth-activity-events
    title: Auth activity events
    type: logs
    signal: logs
    datasource: logs
    expression: '{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json operation="request.operation", request_id="request.id", request_path="request.path" | request_path=~"(auth/.*|sys/auth/.*)" | request_id=~"${request_id:raw}" | request_path=~"${request_path:raw}" | operation=~"${operation:raw}"'
    description: Shows audited auth method, login, user, and token events.
    grid:
      x: 0
      y: 25
      w: 12
      h: 9
  - id: audit-error-events
    title: Response error events
    type: logs
    signal: logs
    datasource: logs
    expression: '{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json audit_type="type", audit_error="error", operation="request.operation", request_id="request.id", request_path="request.path" | audit_type="response" | audit_error!="" | request_id=~"${request_id:raw}" | request_path=~"${request_path:raw}" | operation=~"${operation:raw}"'
    description: Shows audited response entries that include error fields.
    grid:
      x: 12
      y: 25
      w: 12
      h: 9
  - id: audit-configuration-events
    title: Audit config events
    type: logs
    signal: logs
    datasource: logs
    expression: '{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json operation="request.operation", request_id="request.id", request_path="request.path" | operation=~"create|update|delete" | request_path=~"sys/audit(/.*)?" | request_id=~"${request_id:raw}" | request_path=~"${request_path:raw}"'
    description: Shows audited audit configuration changes that match the selected investigation filters.
    grid:
      x: 0
      y: 34
      w: 12
      h: 9
  - id: permission-denied-events
    title: Permission denied events
    type: logs
    signal: logs
    datasource: logs
    expression: '{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json audit_type="type", audit_error="error", request_id="request.id", request_path="request.path" | audit_type="response" | audit_error=~"(?s).*permission denied.*" | request_id=~"${request_id:raw}" | request_path=~"${request_path:raw}"'
    description: Shows audited permission denied responses that match the selected investigation filters.
    grid:
      x: 12
      y: 34
      w: 12
      h: 9
  - id: filtered-audit-stream
    title: Filtered audit stream
    type: logs
    signal: logs
    datasource: logs
    expression: '{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json operation="request.operation", request_id="request.id", request_path="request.path" | request_id=~"${request_id:raw}" | request_path=~"${request_path:raw}" | operation=~"${operation:raw}"'
    description: Shows the full audit stream after applying the selected investigation filters.
    grid:
      x: 0
      y: 43
      w: 24
      h: 9

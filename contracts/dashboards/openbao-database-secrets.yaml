version: v0.1
maturity:
  lifecycle: draft
  evidence:
    - generated-validated
uid: openbao-database-secrets
title: OpenBao database secrets
refresh: 30s
tags:
  - audit
  - database
  - generated
  - openbao
  - reference
  - secret-engines
timeRange:
  from: now-1h
  to: now
datasources:
  metrics:
    type: prometheus
    uid: prometheus
  logs:
    type: loki
    uid: loki
variables:
  - name: openbao_namespace
    label: Kubernetes namespace
    type: textbox
    default: .*
  - name: request_id
    label: Request ID
    type: textbox
    default: .*
  - name: database_path
    label: Database mount path
    type: textbox
    default: database
  - name: namespace
    label: OpenBao namespace
    type: textbox
    default: .*
  - name: operation
    label: Operation
    type: custom
    default: .*
    options:
      - .*
      - read
      - list
      - create
      - update
      - delete
  - name: node_id
    label: Node
    type: textbox
    default: .*
panels:
  - id: database-create-rate
    title: Credential creates
    type: stat
    signal: metrics
    datasource: metrics
    expression: openbao:database_new_user:rate5m{namespace=~"${openbao_namespace:raw}"}
    unit: ops
    description: Shows database dynamic credential create operations per second over 5 minutes.
    grid:
      x: 0
      y: 0
      w: 6
      h: 4
  - id: database-renew-rate
    title: Credential renews
    type: stat
    signal: metrics
    datasource: metrics
    expression: openbao:database_update_user:rate5m{namespace=~"${openbao_namespace:raw}"}
    unit: ops
    description: Shows database dynamic credential renew operations per second over 5 minutes.
    grid:
      x: 6
      y: 0
      w: 6
      h: 4
  - id: database-revoke-rate
    title: Credential revokes
    type: stat
    signal: metrics
    datasource: metrics
    expression: openbao:database_delete_user:rate5m{namespace=~"${openbao_namespace:raw}"}
    unit: ops
    description: Shows database dynamic credential revoke operations per second over 5 minutes.
    grid:
      x: 12
      y: 0
      w: 6
      h: 4
  - id: database-failures
    title: Database failures
    type: stat
    signal: metrics
    datasource: metrics
    expression: (sum(openbao:database_initialize_error:increase15m{namespace=~"${openbao_namespace:raw}"}) or vector(0)) + (sum(openbao:database_new_user_error:increase15m{namespace=~"${openbao_namespace:raw}"}) or vector(0)) + (sum(openbao:database_update_user_error:increase15m{namespace=~"${openbao_namespace:raw}"}) or vector(0)) + (sum(openbao:database_delete_user_error:increase15m{namespace=~"${openbao_namespace:raw}"}) or vector(0)) + (sum(openbao:database_close_error:increase15m{namespace=~"${openbao_namespace:raw}"}) or vector(0))
    unit: short
    description: Shows database initialize, create, renew, revoke, and close errors over 15 minutes when OpenBao emits those counters.
    grid:
      x: 18
      y: 0
      w: 6
      h: 4
  - id: database-operation-rates
    title: Database operation rates
    type: timeseries
    signal: metrics
    datasource: metrics
    expression: label_replace(openbao:database_initialize:rate5m{namespace=~"${openbao_namespace:raw}"}, "database_operation", "initialize", "source_prefix", ".*") or label_replace(openbao:database_new_user:rate5m{namespace=~"${openbao_namespace:raw}"}, "database_operation", "create", "source_prefix", ".*") or label_replace(openbao:database_update_user:rate5m{namespace=~"${openbao_namespace:raw}"}, "database_operation", "renew", "source_prefix", ".*") or label_replace(openbao:database_delete_user:rate5m{namespace=~"${openbao_namespace:raw}"}, "database_operation", "revoke", "source_prefix", ".*") or label_replace(openbao:database_close:rate5m{namespace=~"${openbao_namespace:raw}"}, "database_operation", "close", "source_prefix", ".*")
    legend: "{{database_operation}}"
    unit: ops
    description: Shows generic database secrets engine operation rates over 5 minutes.
    grid:
      x: 0
      y: 4
      w: 12
      h: 8
  - id: database-operation-latency
    title: Database operation latency
    type: timeseries
    signal: metrics
    datasource: metrics
    expression: label_replace(openbao:database_initialize:avg5m{namespace=~"${openbao_namespace:raw}"}, "database_operation", "initialize", "source_prefix", ".*") or label_replace(openbao:database_new_user:avg5m{namespace=~"${openbao_namespace:raw}"}, "database_operation", "create", "source_prefix", ".*") or label_replace(openbao:database_update_user:avg5m{namespace=~"${openbao_namespace:raw}"}, "database_operation", "renew", "source_prefix", ".*") or label_replace(openbao:database_delete_user:avg5m{namespace=~"${openbao_namespace:raw}"}, "database_operation", "revoke", "source_prefix", ".*") or label_replace(openbao:database_close:avg5m{namespace=~"${openbao_namespace:raw}"}, "database_operation", "close", "source_prefix", ".*")
    legend: "{{database_operation}}"
    unit: ms
    description: Shows average database secrets engine operation latency over 5 minutes.
    grid:
      x: 12
      y: 4
      w: 12
      h: 8
  - id: database-failures-by-operation
    title: Database failures by operation
    type: timeseries
    signal: metrics
    datasource: metrics
    expression: label_replace(openbao:database_initialize_error:increase15m{namespace=~"${openbao_namespace:raw}"}, "database_operation", "initialize", "source_prefix", ".*") or label_replace(openbao:database_new_user_error:increase15m{namespace=~"${openbao_namespace:raw}"}, "database_operation", "create", "source_prefix", ".*") or label_replace(openbao:database_update_user_error:increase15m{namespace=~"${openbao_namespace:raw}"}, "database_operation", "renew", "source_prefix", ".*") or label_replace(openbao:database_delete_user_error:increase15m{namespace=~"${openbao_namespace:raw}"}, "database_operation", "revoke", "source_prefix", ".*") or label_replace(openbao:database_close_error:increase15m{namespace=~"${openbao_namespace:raw}"}, "database_operation", "close", "source_prefix", ".*")
    legend: "{{database_operation}}"
    unit: short
    description: Shows database operation errors by operation over 15 minutes.
    grid:
      x: 0
      y: 12
      w: 12
      h: 8
  - id: database-dynamic-leases
    title: Database dynamic leases
    type: timeseries
    signal: metrics
    datasource: metrics
    expression: openbao:secret_lease_creation_by_engine:increase15m{namespace=~"${openbao_namespace:raw}",secret_engine="database"}
    legend: "{{secret_engine}}"
    unit: short
    description: Shows database dynamic secret lease creation events over 15 minutes when OpenBao emits the secret lease creation counter.
    grid:
      x: 12
      y: 12
      w: 12
      h: 8
  - id: database-dynamic-leases-by-namespace
    title: Database dynamic leases by namespace
    type: timeseries
    signal: metrics
    datasource: metrics
    expression: topk(10, openbao:secret_lease_creation_by_engine_namespace:increase15m{secret_engine="database",namespace=~"${namespace:raw}"})
    legend: "{{namespace}}"
    unit: short
    description: Shows database dynamic secret lease creation events by OpenBao namespace over 15 minutes without adding namespace to alert labels.
    grid:
      x: 0
      y: 20
      w: 12
      h: 8
  - id: database-audit-events
    title: Database audit events
    type: stat
    signal: logs
    datasource: logs
    expression: 'sum(count_over_time({namespace=~"${openbao_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json audit_type="type", operation="request.operation", request_id="request.id", request_path="request.path" | audit_type="request" | request_path=~"${database_path:raw}/(config|roles|creds|static-roles|static-creds|rotate-root|rotate-role)(/.*)?" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}" [5m]))'
    unit: short
    description: Shows audited database secrets engine requests matching the selected filters over 5 minutes.
    grid:
      x: 12
      y: 20
      w: 6
      h: 4
  - id: database-config-role-events
    title: Config and role events
    type: stat
    signal: logs
    datasource: logs
    expression: 'sum(count_over_time({namespace=~"${openbao_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json audit_type="type", operation="request.operation", request_id="request.id", request_path="request.path" | audit_type="request" | request_path=~"${database_path:raw}/(config|roles|static-roles|rotate-root|rotate-role)(/.*)?" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}" [5m]))'
    unit: short
    description: Shows audited database connection, dynamic role, static role, and rotation requests over 5 minutes.
    grid:
      x: 18
      y: 20
      w: 6
      h: 4
  - id: database-credential-events
    title: Credential reads
    type: stat
    signal: logs
    datasource: logs
    expression: 'sum(count_over_time({namespace=~"${openbao_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json audit_type="type", operation="request.operation", request_id="request.id", request_path="request.path" | audit_type="request" | request_path=~"${database_path:raw}/(creds|static-creds)(/.*)?" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}" [5m]))'
    unit: short
    description: Shows audited dynamic and static database credential reads over 5 minutes.
    grid:
      x: 12
      y: 24
      w: 6
      h: 4
  - id: database-lease-events
    title: Lease events
    type: stat
    signal: logs
    datasource: logs
    expression: 'sum(count_over_time({namespace=~"${openbao_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json audit_type="type", operation="request.operation", request_id="request.id", request_path="request.path" | audit_type="request" | request_path=~"sys/leases/(lookup|renew|revoke).*${database_path:raw}/creds.*" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}" [5m]))'
    unit: short
    description: Shows audited lease lookup, renew, and revoke requests for database dynamic credentials over 5 minutes.
    grid:
      x: 18
      y: 24
      w: 6
      h: 4
  - id: database-audit-events-by-node
    title: Database audit events by node
    type: timeseries
    signal: logs
    datasource: logs
    expression: 'sum by (node_id) (count_over_time({namespace=~"${openbao_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json audit_type="type", operation="request.operation", request_id="request.id", request_path="request.path" | audit_type="request" | request_path=~"${database_path:raw}/(config|roles|creds|static-roles|static-creds|rotate-root|rotate-role)(/.*)?" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}" [5m]))'
    legend: "{{node_id}}"
    unit: short
    description: Shows filtered database secrets engine audit request volume by OpenBao node over 5 minutes.
    grid:
      x: 0
      y: 28
      w: 12
      h: 8
  - id: database-error-events
    title: Database response errors
    type: timeseries
    signal: logs
    datasource: logs
    expression: 'sum by (node_id) (count_over_time({namespace=~"${openbao_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json audit_type="type", audit_error="error", operation="request.operation", request_id="request.id", request_path="request.path" | audit_type="response" | audit_error!="" | request_path=~"${database_path:raw}/(config|roles|creds|static-roles|static-creds|rotate-root|rotate-role)(/.*)?" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}" [5m]))'
    legend: "{{node_id}}"
    unit: short
    description: Shows audited database secrets engine response errors by OpenBao node over 5 minutes.
    grid:
      x: 12
      y: 28
      w: 12
      h: 8
  - id: database-config-role-log
    title: Database config and role stream
    type: logs
    signal: logs
    datasource: logs
    expression: '{namespace=~"${openbao_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json audit_type="type", operation="request.operation", request_id="request.id", request_path="request.path" | audit_type="request" | request_path=~"${database_path:raw}/(config|roles|static-roles|rotate-root|rotate-role)(/.*)?" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}"'
    description: Shows audited database connection, role, static role, and rotation requests.
    grid:
      x: 0
      y: 36
      w: 12
      h: 9
  - id: database-credential-log
    title: Database credential stream
    type: logs
    signal: logs
    datasource: logs
    expression: '{namespace=~"${openbao_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json audit_type="type", operation="request.operation", request_id="request.id", request_path="request.path" | audit_type="request" | request_path=~"${database_path:raw}/(creds|static-creds)(/.*)?" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}"'
    description: Shows audited dynamic and static database credential reads.
    grid:
      x: 12
      y: 36
      w: 12
      h: 9
  - id: database-lease-log
    title: Database lease stream
    type: logs
    signal: logs
    datasource: logs
    expression: '{namespace=~"${openbao_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json audit_type="type", operation="request.operation", request_id="request.id", request_path="request.path" | audit_type="request" | request_path=~"sys/leases/(lookup|renew|revoke).*${database_path:raw}/creds.*" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}"'
    description: Shows audited lease lookup, renew, and revoke requests for database dynamic credentials.
    grid:
      x: 0
      y: 45
      w: 12
      h: 9
  - id: database-error-log
    title: Database response error stream
    type: logs
    signal: logs
    datasource: logs
    expression: '{namespace=~"${openbao_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json audit_type="type", audit_error="error", operation="request.operation", request_id="request.id", request_path="request.path" | audit_type="response" | audit_error!="" | request_path=~"${database_path:raw}/(config|roles|creds|static-roles|static-creds|rotate-root|rotate-role)(/.*)?" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}"'
    description: Shows audited database secrets engine response entries that include error fields.
    grid:
      x: 12
      y: 45
      w: 12
      h: 9

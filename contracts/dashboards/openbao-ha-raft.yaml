version: v0.1
maturity:
  lifecycle: draft
  evidence:
    - generated-validated
uid: openbao-ha-raft
title: OpenBao HA/Raft
refresh: 30s
tags:
  - openbao
  - raft
  - reference
  - generated
timeRange:
  from: now-1h
  to: now
datasources:
  metrics:
    type: prometheus
    uid: prometheus
  logs:
    type: loki
    uid: loki
variables:
  - name: cluster
    label: Cluster
    type: textbox
    default: .*
  - name: kubernetes_namespace
    label: Kubernetes namespace
    type: textbox
    default: .*
  - name: scrape_profile
    label: Scrape profile
    type: textbox
    default: .*
panels:
  - id: raft-peers
    title: Raft peers
    type: stat
    signal: metrics
    datasource: metrics
    expression: openbao:raft_peers:max{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}
    unit: none
    description: Shows the normalized Raft peer count.
    grid:
      x: 0
      y: 0
      w: 6
      h: 4
  - id: autopilot-health
    title: Autopilot health
    type: stat
    signal: metrics
    datasource: metrics
    expression: openbao:autopilot_healthy:max{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}
    unit: none
    description: Shows whether OpenBao Autopilot reports the Raft cluster as healthy.
    grid:
      x: 6
      y: 0
      w: 6
      h: 4
  - id: failure-tolerance
    title: Failure tolerance
    type: stat
    signal: metrics
    datasource: metrics
    expression: openbao:autopilot_failure_tolerance:max{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}
    unit: none
    description: Shows the number of voter failures Autopilot reports the cluster can tolerate.
    grid:
      x: 12
      y: 0
      w: 6
      h: 4
  - id: unhealthy-raft-nodes
    title: Unhealthy Raft nodes
    type: stat
    signal: metrics
    datasource: metrics
    expression: sum by (cluster, kubernetes_namespace, scrape_profile) (1 - openbao:autopilot_node_healthy:min{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"})
    unit: none
    description: Shows the number of Raft nodes Autopilot reports as unhealthy.
    grid:
      x: 18
      y: 0
      w: 6
      h: 4
  - id: active-nodes
    title: Active nodes
    type: stat
    signal: metrics
    datasource: metrics
    expression: openbao:core_active:sum{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}
    unit: none
    description: Shows the number of active OpenBao nodes.
    grid:
      x: 0
      y: 4
      w: 6
      h: 4
  - id: unsealed-nodes
    title: Unsealed nodes
    type: stat
    signal: metrics
    datasource: metrics
    expression: openbao:core_unsealed:sum{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}
    unit: none
    description: Shows the number of unsealed OpenBao nodes.
    grid:
      x: 6
      y: 4
      w: 6
      h: 4
  - id: leader-transitions
    title: Leader transitions
    type: stat
    signal: metrics
    datasource: metrics
    expression: sum by (cluster, kubernetes_namespace, scrape_profile) (increase(vault_raft_state_leader{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}[30m])) or vector(0)
    unit: none
    description: Shows Raft leader transitions over the last 30 minutes.
    grid:
      x: 12
      y: 4
      w: 6
      h: 4
  - id: candidate-transitions
    title: Candidate transitions
    type: stat
    signal: metrics
    datasource: metrics
    expression: sum by (cluster, kubernetes_namespace, scrape_profile) (increase(vault_raft_state_candidate{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}[30m])) or vector(0)
    unit: none
    description: Shows Raft candidate transitions over the last 30 minutes.
    grid:
      x: 18
      y: 4
      w: 6
      h: 4
  - id: autopilot-node-health
    title: Autopilot node health
    type: timeseries
    signal: metrics
    datasource: metrics
    expression: openbao:autopilot_node_healthy:min{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}
    legend: "{{cluster}} {{kubernetes_namespace}} {{scrape_profile}} {{node_id}}"
    unit: none
    description: Shows Autopilot node health by Raft node ID.
    grid:
      x: 0
      y: 8
      w: 8
      h: 8
  - id: raft-commit-index
    title: Raft commit index
    type: timeseries
    signal: metrics
    datasource: metrics
    expression: max by (cluster, kubernetes_namespace, scrape_profile, instance, peer_id) (vault_raft_storage_stats_commit_index{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"})
    legend: "{{cluster}} {{kubernetes_namespace}} {{scrape_profile}} {{peer_id}} commit"
    unit: none
    description: Shows Raft commit index by peer.
    grid:
      x: 8
      y: 8
      w: 8
      h: 8
  - id: raft-applied-index
    title: Raft applied index
    type: timeseries
    signal: metrics
    datasource: metrics
    expression: max by (cluster, kubernetes_namespace, scrape_profile, instance, peer_id) (vault_raft_storage_stats_applied_index{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"})
    legend: "{{cluster}} {{kubernetes_namespace}} {{scrape_profile}} {{peer_id}} applied"
    unit: none
    description: Shows Raft applied index by peer.
    grid:
      x: 16
      y: 8
      w: 8
      h: 8
  - id: raft-fsm-pending
    title: FSM pending
    type: timeseries
    signal: metrics
    datasource: metrics
    expression: max by (cluster, kubernetes_namespace, scrape_profile, instance, peer_id) (vault_raft_storage_stats_fsm_pending{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"})
    legend: "{{cluster}} {{kubernetes_namespace}} {{scrape_profile}} {{peer_id}}"
    unit: none
    description: Shows pending Raft FSM work by peer.
    grid:
      x: 0
      y: 16
      w: 8
      h: 8
  - id: raft-term
    title: Raft term
    type: timeseries
    signal: metrics
    datasource: metrics
    expression: max by (cluster, kubernetes_namespace, scrape_profile, instance, peer_id) (vault_raft_storage_stats_term{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"})
    legend: "{{cluster}} {{kubernetes_namespace}} {{scrape_profile}} {{peer_id}}"
    unit: none
    description: Shows the current Raft term by peer.
    grid:
      x: 8
      y: 16
      w: 8
      h: 8
  - id: leader-last-contact
    title: Leader last contact p99
    type: timeseries
    signal: metrics
    datasource: metrics
    expression: max by (cluster, kubernetes_namespace, scrape_profile, instance) (vault_raft_leader_lastContact{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}",quantile="0.99"})
    legend: "{{cluster}} {{kubernetes_namespace}} {{scrape_profile}} {{instance}}"
    unit: ms
    description: Shows the p99 leader last-contact timer where OpenBao exposes it.
    grid:
      x: 16
      y: 16
      w: 8
      h: 8
  - id: replication-heartbeat
    title: Replication heartbeat p99
    type: timeseries
    signal: metrics
    datasource: metrics
    expression: max by (cluster, kubernetes_namespace, scrape_profile, peer_id) (vault_raft_replication_heartbeat{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}",quantile="0.99"})
    legend: "{{cluster}} {{kubernetes_namespace}} {{scrape_profile}} {{peer_id}}"
    unit: ms
    description: Shows the p99 Raft replication heartbeat timer by peer.
    grid:
      x: 0
      y: 24
      w: 12
      h: 8
  - id: append-entries-logs
    title: Append entries logs
    type: timeseries
    signal: metrics
    datasource: metrics
    expression: max by (cluster, kubernetes_namespace, scrape_profile, peer_id) (vault_raft_replication_appendEntries_logs{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"})
    legend: "{{cluster}} {{kubernetes_namespace}} {{scrape_profile}} {{peer_id}}"
    unit: none
    description: Shows append-entries log counts by peer.
    grid:
      x: 12
      y: 24
      w: 12
      h: 8
  - id: raft-storage-logs
    title: Raft and storage logs
    type: logs
    signal: logs
    datasource: logs
    expression: '{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.operational"} |~ "(?i)raft|storage|autopilot"'
    description: Shows OpenBao operational logs related to Raft, storage, and Autopilot.
    grid:
      x: 0
      y: 32
      w: 24
      h: 9

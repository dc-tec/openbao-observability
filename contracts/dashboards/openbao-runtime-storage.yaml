version: v0.1
maturity:
  lifecycle: draft
  evidence:
    - generated-validated
uid: openbao-runtime-storage
title: OpenBao runtime and storage
refresh: 30s
tags:
  - openbao
  - runtime
  - storage
  - reference
  - generated
timeRange:
  from: now-1h
  to: now
datasources:
  metrics:
    type: prometheus
    uid: prometheus
  logs:
    type: loki
    uid: loki
variables:
  - name: cluster
    label: Cluster
    type: textbox
    default: .*
  - name: kubernetes_namespace
    label: Kubernetes namespace
    type: textbox
    default: .*
  - name: scrape_profile
    label: Scrape profile
    type: textbox
    default: .*
panels:
  - id: "expiration-backlog"
    title: "Waiting expiration jobs"
    type: "timeseries"
    signal: "metrics"
    datasource: "metrics"
    expression: "openbao:expire_job_manager_total_jobs:max{cluster=~\"${cluster:raw}\",kubernetes_namespace=~\"${kubernetes_namespace:raw}\",scrape_profile=~\"${scrape_profile:raw}\"}"
    legend: "{{cluster}} {{scrape_profile}} {{instance}}"
    unit: "short"
    description: "Waiting expiration jobs on the active node, excluding work already dispatched. A shrinking backlog can still keep storage busy."
    grid:
      x: 0
      y: 0
      w: 12
      h: 8
  - id: "foreground-latency-by-target"
    title: "Application handler latency by node"
    type: "timeseries"
    signal: "metrics"
    datasource: "metrics"
    expression: "label_replace(openbao:core_handle_request_by_target:avg5m{cluster=~\"${cluster:raw}\",kubernetes_namespace=~\"${kubernetes_namespace:raw}\",scrape_profile=~\"${scrape_profile:raw}\"}, \"handler\", \"regular request\", \"source_prefix\", \".*\") or label_replace(openbao:core_handle_login_request_by_target:avg5m{cluster=~\"${cluster:raw}\",kubernetes_namespace=~\"${kubernetes_namespace:raw}\",scrape_profile=~\"${scrape_profile:raw}\"}, \"handler\", \"login request\", \"source_prefix\", \".*\")"
    legend: "{{cluster}} {{scrape_profile}} {{instance}} {{handler}} {{openbao_namespace}}"
    unit: "ms"
    description: "Per-target means preserve a busy leader. Generic login handling includes multiple auth methods and helper requests; this is not an LDAP-specific measurement."
    grid:
      x: 12
      y: 0
      w: 12
      h: 8
  - id: "raft-write-stages"
    title: "Raft write and apply latency"
    type: "timeseries"
    signal: "metrics"
    datasource: "metrics"
    expression: "label_replace(openbao:raft_storage_put:avg5m{cluster=~\"${cluster:raw}\",kubernetes_namespace=~\"${kubernetes_namespace:raw}\",scrape_profile=~\"${scrape_profile:raw}\"}, \"storage_stage\", \"backend PUT\", \"source_prefix\", \".*\") or label_replace(openbao:raft_storage_delete:avg5m{cluster=~\"${cluster:raw}\",kubernetes_namespace=~\"${kubernetes_namespace:raw}\",scrape_profile=~\"${scrape_profile:raw}\"}, \"storage_stage\", \"backend DELETE\", \"source_prefix\", \".*\") or label_replace(openbao:raft_commit_time:avg5m{cluster=~\"${cluster:raw}\",kubernetes_namespace=~\"${kubernetes_namespace:raw}\",scrape_profile=~\"${scrape_profile:raw}\"}, \"storage_stage\", \"quorum commit\", \"source_prefix\", \".*\") or label_replace(openbao:raft_fsm_apply_batch:avg5m{cluster=~\"${cluster:raw}\",kubernetes_namespace=~\"${kubernetes_namespace:raw}\",scrape_profile=~\"${scrape_profile:raw}\"}, \"storage_stage\", \"local batch apply\", \"source_prefix\", \".*\")"
    legend: "{{cluster}} {{scrape_profile}} {{instance}} {{storage_stage}}"
    unit: "ms"
    description: "Compare backend waits, quorum commit, and local batch application by target. Timers cover different operation boundaries and must not be added or subtracted to calculate exact wait time."
    grid:
      x: 0
      y: 8
      w: 12
      h: 8
  - id: "raft-fsm-busy"
    title: "Raft FSM busy wall time"
    type: "timeseries"
    signal: "metrics"
    datasource: "metrics"
    expression: "openbao:raft_thread_fsm_saturation:ratio5m{cluster=~\"${cluster:raw}\",kubernetes_namespace=~\"${kubernetes_namespace:raw}\",scrape_profile=~\"${scrape_profile:raw}\"}"
    legend: "{{cluster}} {{scrape_profile}} {{instance}}"
    unit: "percentunit"
    description: "Mean fraction of FSM thread wall time spent busy. This is not CPU utilization or a disk capacity percentage."
    grid:
      x: 12
      y: 8
      w: 12
      h: 8
  - id: "raft-fsm-pending"
    title: "Pending Raft apply work"
    type: "timeseries"
    signal: "metrics"
    datasource: "metrics"
    expression: "openbao:raft_storage_fsm_pending:max{cluster=~\"${cluster:raw}\",kubernetes_namespace=~\"${kubernetes_namespace:raw}\",scrape_profile=~\"${scrape_profile:raw}\"}"
    legend: "{{cluster}} {{scrape_profile}} {{instance}} {{peer_id}}"
    unit: "short"
    description: "Pending local finite-state-machine work by target and peer. Correlate with write latency and FSM busy wall time."
    grid:
      x: 0
      y: 16
      w: 12
      h: 8
  - id: "raft-batch-size"
    title: "Logs per applied Raft batch"
    type: "timeseries"
    signal: "metrics"
    datasource: "metrics"
    expression: "openbao:raft_fsm_apply_batch_logs:avg5m{cluster=~\"${cluster:raw}\",kubernetes_namespace=~\"${kubernetes_namespace:raw}\",scrape_profile=~\"${scrape_profile:raw}\"}"
    legend: "{{cluster}} {{scrape_profile}} {{instance}}"
    unit: "short"
    description: "Mean logs per local apply batch. A batch near one log does not establish a configuration error or predict an upgrade speedup."
    grid:
      x: 12
      y: 16
      w: 12
      h: 8
  - id: request-latency
    title: Request latency
    type: stat
    signal: metrics
    datasource: metrics
    expression: openbao:core_handle_request:avg5m{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}
    unit: ms
    description: Shows average regular OpenBao request handling latency over 5 minutes.
    grid:
      x: 0
      y: 24
      w: 4
      h: 4
  - id: token-check-latency
    title: Token check latency
    type: stat
    signal: metrics
    datasource: metrics
    expression: openbao:core_check_token:avg5m{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}
    unit: ms
    description: Shows average token check latency over 5 minutes.
    grid:
      x: 4
      y: 24
      w: 4
      h: 4
  - id: barrier-get-latency
    title: Barrier GET latency
    type: stat
    signal: metrics
    datasource: metrics
    expression: openbao:barrier_get:avg5m{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}
    unit: ms
    description: Shows average storage barrier GET latency over 5 minutes.
    grid:
      x: 8
      y: 24
      w: 4
      h: 4
  - id: barrier-put-latency
    title: Barrier PUT latency
    type: stat
    signal: metrics
    datasource: metrics
    expression: openbao:barrier_put:avg5m{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}
    unit: ms
    description: Shows average storage barrier PUT latency over 5 minutes.
    grid:
      x: 12
      y: 24
      w: 4
      h: 4
  - id: cache-hit-ratio
    title: Cache hit ratio
    type: stat
    signal: metrics
    datasource: metrics
    expression: openbao:cache_hit_ratio:ratio5m{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}
    unit: percentunit
    description: Shows the storage cache hit ratio over 5 minutes.
    grid:
      x: 16
      y: 24
      w: 4
      h: 4
  - id: goroutines
    title: Goroutines
    type: stat
    signal: metrics
    datasource: metrics
    expression: openbao:runtime_num_goroutines:max{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}
    unit: short
    description: Shows the maximum observed Go goroutine count.
    grid:
      x: 20
      y: 24
      w: 4
      h: 4
  - id: barrier-get-rate
    title: Barrier GET rate
    type: timeseries
    signal: metrics
    datasource: metrics
    expression: openbao:barrier_get:rate5m{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}
    unit: ops
    description: Shows storage barrier GET operations per second over 5 minutes.
    grid:
      x: 0
      y: 28
      w: 6
      h: 7
  - id: barrier-put-rate
    title: Barrier PUT rate
    type: timeseries
    signal: metrics
    datasource: metrics
    expression: openbao:barrier_put:rate5m{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}
    unit: ops
    description: Shows storage barrier PUT operations per second over 5 minutes.
    grid:
      x: 6
      y: 28
      w: 6
      h: 7
  - id: barrier-list-rate
    title: Barrier LIST rate
    type: timeseries
    signal: metrics
    datasource: metrics
    expression: openbao:barrier_list:rate5m{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}
    unit: ops
    description: Shows storage barrier LIST operations per second over 5 minutes.
    grid:
      x: 12
      y: 28
      w: 6
      h: 7
  - id: barrier-delete-rate
    title: Barrier DELETE rate
    type: timeseries
    signal: metrics
    datasource: metrics
    expression: openbao:barrier_delete:rate5m{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}
    unit: ops
    description: Shows storage barrier DELETE operations per second over 5 minutes.
    grid:
      x: 18
      y: 28
      w: 6
      h: 7
  - id: barrier-get-latency-trend
    title: Barrier GET latency
    type: timeseries
    signal: metrics
    datasource: metrics
    expression: openbao:barrier_get:avg5m{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}
    unit: ms
    description: Shows average storage barrier GET latency over time.
    grid:
      x: 0
      y: 35
      w: 6
      h: 7
  - id: barrier-put-latency-trend
    title: Barrier PUT latency
    type: timeseries
    signal: metrics
    datasource: metrics
    expression: openbao:barrier_put:avg5m{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}
    unit: ms
    description: Shows average storage barrier PUT latency over time.
    grid:
      x: 6
      y: 35
      w: 6
      h: 7
  - id: barrier-list-latency
    title: Barrier LIST latency
    type: timeseries
    signal: metrics
    datasource: metrics
    expression: openbao:barrier_list:avg5m{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}
    unit: ms
    description: Shows average storage barrier LIST latency over time.
    grid:
      x: 12
      y: 35
      w: 6
      h: 7
  - id: barrier-delete-latency
    title: Barrier DELETE latency
    type: timeseries
    signal: metrics
    datasource: metrics
    expression: openbao:barrier_delete:avg5m{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}
    unit: ms
    description: Shows average storage barrier DELETE latency over time.
    grid:
      x: 18
      y: 35
      w: 6
      h: 7
  - id: cache-hit-rate
    title: Cache hit rate
    type: timeseries
    signal: metrics
    datasource: metrics
    expression: openbao:cache_hit:rate5m{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}
    unit: ops
    description: Shows storage cache hits per second over 5 minutes.
    grid:
      x: 0
      y: 42
      w: 6
      h: 7
  - id: cache-miss-rate
    title: Cache miss rate
    type: timeseries
    signal: metrics
    datasource: metrics
    expression: openbao:cache_miss:rate5m{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}
    unit: ops
    description: Shows storage cache misses per second over 5 minutes.
    grid:
      x: 6
      y: 42
      w: 6
      h: 7
  - id: cache-write-rate
    title: Cache write rate
    type: timeseries
    signal: metrics
    datasource: metrics
    expression: openbao:cache_write:rate5m{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}
    unit: ops
    description: Shows storage cache writes per second over 5 minutes.
    grid:
      x: 12
      y: 42
      w: 6
      h: 7
  - id: cache-hit-ratio-trend
    title: Cache hit ratio
    type: timeseries
    signal: metrics
    datasource: metrics
    expression: openbao:cache_hit_ratio:ratio5m{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}
    unit: percentunit
    description: Shows storage cache hit ratio over time.
    grid:
      x: 18
      y: 42
      w: 6
      h: 7
  - id: runtime-alloc-bytes
    title: Allocated bytes
    type: timeseries
    signal: metrics
    datasource: metrics
    expression: openbao:runtime_alloc_bytes:max{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}
    unit: bytes
    description: Shows the maximum observed Go runtime allocated memory.
    grid:
      x: 0
      y: 49
      w: 6
      h: 7
  - id: runtime-sys-bytes
    title: System bytes
    type: timeseries
    signal: metrics
    datasource: metrics
    expression: openbao:runtime_sys_bytes:max{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}
    unit: bytes
    description: Shows the maximum observed Go runtime system memory.
    grid:
      x: 6
      y: 49
      w: 6
      h: 7
  - id: runtime-heap-objects
    title: Heap objects
    type: timeseries
    signal: metrics
    datasource: metrics
    expression: openbao:runtime_heap_objects:max{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}
    unit: short
    description: Shows the maximum observed Go heap object count.
    grid:
      x: 12
      y: 49
      w: 6
      h: 7
  - id: runtime-gc-pause
    title: GC pause
    type: timeseries
    signal: metrics
    datasource: metrics
    expression: openbao:runtime_gc_pause_ns:avg5m{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}
    unit: ns
    description: Shows average Go GC pause duration over 5 minutes.
    grid:
      x: 18
      y: 49
      w: 6
      h: 7
  - id: runtime-total-gc-pause
    title: Total GC pause
    type: timeseries
    signal: metrics
    datasource: metrics
    expression: openbao:runtime_total_gc_pause_ns:max{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}
    unit: ns
    description: Shows the maximum observed total Go GC pause time.
    grid:
      x: 0
      y: 56
      w: 8
      h: 7
  - id: runtime-total-gc-runs
    title: Total GC runs
    type: timeseries
    signal: metrics
    datasource: metrics
    expression: openbao:runtime_total_gc_runs:max{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}
    unit: short
    description: Shows the maximum observed total Go GC run count.
    grid:
      x: 8
      y: 56
      w: 8
      h: 7
  - id: barrier-encryptions
    title: Barrier encryptions
    type: timeseries
    signal: metrics
    datasource: metrics
    expression: openbao:barrier_estimated_encryptions:increase15m{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}
    legend: "{{cluster}} {{kubernetes_namespace}} {{scrape_profile}} term {{term}}"
    unit: short
    description: Shows estimated barrier encryptions by barrier term over 15 minutes.
    grid:
      x: 16
      y: 56
      w: 8
      h: 7
  - id: mount-table-entries
    title: Mount table entries
    type: timeseries
    signal: metrics
    datasource: metrics
    expression: openbao:core_mount_table_num_entries:max{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}
    legend: "{{cluster}} {{kubernetes_namespace}} {{scrape_profile}} {{type}} local={{local}}"
    unit: short
    description: Shows auth and logical mount table entries by bounded labels.
    grid:
      x: 0
      y: 63
      w: 12
      h: 7
  - id: mount-table-size
    title: Mount table size
    type: timeseries
    signal: metrics
    datasource: metrics
    expression: openbao:core_mount_table_size:max{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}
    legend: "{{cluster}} {{kubernetes_namespace}} {{scrape_profile}} {{type}} local={{local}}"
    unit: bytes
    description: Shows auth and logical mount table size by bounded labels.
    grid:
      x: 12
      y: 63
      w: 12
      h: 7
  - id: runtime-storage-logs
    title: Runtime and storage logs
    type: logs
    signal: logs
    datasource: logs
    expression: '{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.operational"} |~ "(?i)storage|barrier|cache|runtime|gc|memory"'
    description: Shows OpenBao operational logs related to storage, cache, runtime, and memory.
    grid:
      x: 0
      y: 70
      w: 24
      h: 9

version: v0.1
maturity:
  lifecycle: draft
  evidence:
    - generated-validated
uid: openbao-audit-overview
title: OpenBao audit overview
refresh: 30s
tags:
  - audit
  - generated
  - openbao
  - reference
timeRange:
  from: now-1h
  to: now
datasources:
  metrics:
    type: prometheus
    uid: prometheus
  logs:
    type: loki
    uid: loki
variables:
  - name: cluster
    label: Cluster
    type: textbox
    default: .*
  - name: kubernetes_namespace
    label: Kubernetes namespace
    type: textbox
    default: .*
  - name: scrape_profile
    label: Scrape profile
    type: textbox
    default: .*
  - name: environment
    label: Archive environment
    type: textbox
    default: .*
  - name: archive_backend
    label: Archive backend
    type: textbox
    default: .*
  - name: archive_pipeline
    label: Archive pipeline
    type: textbox
    default: .*
panels:
  - id: audit-request-failures
    title: Request failures
    type: stat
    signal: metrics
    datasource: metrics
    expression: openbao:audit_log_request_failure:increase5m{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}
    legend: "{{cluster}} {{kubernetes_namespace}} {{scrape_profile}}"
    unit: none
    description: Shows audit request logging failures over 5 minutes.
    thresholds:
      - color: green
      - value: 1
        color: red
    colorMode: value
    noData: Signal missing
    grid:
      x: 0
      y: 0
      w: 6
      h: 4
  - id: audit-response-failures
    title: Response failures
    type: stat
    signal: metrics
    datasource: metrics
    expression: openbao:audit_log_response_failure:increase5m{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}
    legend: "{{cluster}} {{kubernetes_namespace}} {{scrape_profile}}"
    unit: none
    description: Shows audit response logging failures over 5 minutes.
    thresholds:
      - color: green
      - value: 1
        color: red
    colorMode: value
    noData: Signal missing
    grid:
      x: 6
      y: 0
      w: 6
      h: 4
  - id: audit-request-rate
    title: Request audit rate
    type: stat
    signal: metrics
    datasource: metrics
    expression: openbao:audit_log_request:rate5m{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}
    unit: ops
    description: Shows audited request entries per second over 5 minutes.
    grid:
      x: 12
      y: 0
      w: 6
      h: 4
  - id: audit-response-rate
    title: Response audit rate
    type: stat
    signal: metrics
    datasource: metrics
    expression: openbao:audit_log_response:rate5m{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}
    unit: ops
    description: Shows audited response entries per second over 5 minutes.
    grid:
      x: 18
      y: 0
      w: 6
      h: 4
  - id: audit-latency
    title: Audit latency
    type: timeseries
    signal: metrics
    datasource: metrics
    expression: label_replace(openbao:audit_log_request:avg5m{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}, "audit_phase", "request", "source_prefix", ".*") or label_replace(openbao:audit_log_response:avg5m{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",scrape_profile=~"${scrape_profile:raw}"}, "audit_phase", "response", "source_prefix", ".*")
    legend: "{{cluster}} {{kubernetes_namespace}} {{scrape_profile}} {{audit_phase}}"
    unit: ms
    description: Shows average request and response audit logging latency over 5 minutes.
    grid:
      x: 0
      y: 4
      w: 12
      h: 8
  - id: audit-event-volume
    title: Audit event volume
    type: timeseries
    signal: logs
    datasource: logs
    expression: sum by (cluster, kubernetes_namespace, node_id) (count_over_time({cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.audit"}[5m]))
    legend: "{{cluster}} {{kubernetes_namespace}} {{node_id}}"
    unit: short
    description: Shows audit log entries collected by Loki per node over 5 minutes.
    grid:
      x: 12
      y: 4
      w: 12
      h: 8
  - id: audit-request-response-balance
    title: Request/response balance
    type: timeseries
    signal: logs
    datasource: logs
    expression: sum by (cluster, kubernetes_namespace) (count_over_time({cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.audit"} | json | type="request" [10m])) - sum by (cluster, kubernetes_namespace) (count_over_time({cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.audit"} | json | type="response" [10m]))
    unit: short
    description: Shows the difference between audited request and response entries over 10 minutes.
    grid:
      x: 0
      y: 12
      w: 12
      h: 8
  - id: high-risk-system-mutations
    title: System mutations
    type: logs
    signal: logs
    datasource: logs
    expression: '{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.audit"} | json operation="request.operation", request_path="request.path" | operation=~"create|update|delete" | request_path=~"sys/(auth|audit|mounts|policies|raw|plugins|storage/raft|rotate).*"'
    description: Shows audited mutations against high-risk system paths.
    grid:
      x: 12
      y: 12
      w: 12
      h: 8
  - id: audit-configuration-activity
    title: Audit config changes
    type: stat
    signal: logs
    datasource: logs
    expression: 'sum by (cluster, kubernetes_namespace) (count_over_time({cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.audit"} | json operation="request.operation", request_path="request.path" | operation=~"create|update|delete" | request_path=~"sys/audit(/.*)?" [15m]))'
    unit: short
    description: Shows audited audit configuration changes over 15 minutes.
    grid:
      x: 0
      y: 20
      w: 6
      h: 4
  - id: privileged-configuration-mutations
    title: Privileged config changes
    type: stat
    signal: logs
    datasource: logs
    expression: 'sum by (cluster, kubernetes_namespace) (count_over_time({cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.audit"} | json operation="request.operation", request_path="request.path" | operation=~"create|update|delete" | request_path=~"sys/(policies|auth|mounts)(/.*)?" [15m]))'
    unit: short
    description: Shows audited policy, auth method, and mount configuration changes over 15 minutes.
    grid:
      x: 6
      y: 20
      w: 6
      h: 4
  - id: permission-denied-responses
    title: Permission denied
    type: stat
    signal: logs
    datasource: logs
    expression: 'sum by (cluster, kubernetes_namespace) (count_over_time({cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.audit"} | json audit_type="type", audit_error="error" | audit_type="response" | audit_error=~"(?s).*permission denied.*" [15m]))'
    unit: short
    description: Shows audited permission denied responses over 15 minutes.
    grid:
      x: 12
      y: 20
      w: 6
      h: 4
  - id: completed-request-logging
    title: Completed request logs
    type: stat
    signal: logs
    datasource: logs
    expression: 'sum by (cluster, kubernetes_namespace) (count_over_time({cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.completed_requests"}[15m]))'
    unit: short
    description: Shows completed request log entries over 15 minutes.
    grid:
      x: 18
      y: 20
      w: 6
      h: 4
  - id: audit-archive-enabled
    title: Archive expected
    type: stat
    signal: metrics
    datasource: metrics
    expression: max by (cluster, environment, backend, pipeline) (openbao_audit_archive_enabled{cluster=~"${cluster:raw}",environment=~"${environment:raw}",backend=~"${archive_backend:raw}",pipeline=~"${archive_pipeline:raw}"})
    legend: "{{cluster}} {{environment}} {{backend}} {{pipeline}}"
    unit: none
    description: Shows whether durable audit archive delivery is expected in this environment.
    valueMappings:
      - value: "0"
        text: Not required
        color: gray
      - value: "1"
        text: Required
        color: blue
    colorMode: value
    noData: Not configured
    grid:
      x: 0
      y: 24
      w: 4
      h: 4
  - id: audit-archive-delivery-success
    title: Archive delivery
    type: stat
    signal: metrics
    datasource: metrics
    expression: min by (cluster, environment, backend, pipeline) (openbao_audit_archive_delivery_success{cluster=~"${cluster:raw}",environment=~"${environment:raw}",backend=~"${archive_backend:raw}",pipeline=~"${archive_pipeline:raw}"})
    legend: "{{cluster}} {{environment}} {{backend}} {{pipeline}}"
    unit: none
    description: Shows whether the archive health exporter reports successful durable audit archive delivery.
    valueMappings:
      - value: "0"
        text: Degraded
        color: red
      - value: "1"
        text: Healthy
        color: green
    colorMode: value
    noData: No archive status
    grid:
      x: 4
      y: 24
      w: 5
      h: 4
  - id: audit-archive-last-success-age
    title: Archive success age
    type: stat
    signal: metrics
    datasource: metrics
    expression: time() - max by (cluster, environment, backend, pipeline) (openbao_audit_archive_last_success_timestamp_seconds{cluster=~"${cluster:raw}",environment=~"${environment:raw}",backend=~"${archive_backend:raw}",pipeline=~"${archive_pipeline:raw}"})
    legend: "{{cluster}} {{environment}} {{backend}} {{pipeline}}"
    unit: s
    description: Shows the age of the most recent successful durable audit archive delivery.
    thresholds:
      - color: green
      - value: 900
        color: red
    colorMode: value
    noData: No archive status
    grid:
      x: 9
      y: 24
      w: 5
      h: 4
  - id: audit-archive-delivery-failures
    title: Archive failures
    type: stat
    signal: metrics
    datasource: metrics
    expression: sum by (cluster, environment, backend, pipeline) (increase(openbao_audit_archive_delivery_failures_total{cluster=~"${cluster:raw}",environment=~"${environment:raw}",backend=~"${archive_backend:raw}",pipeline=~"${archive_pipeline:raw}"}[15m]))
    legend: "{{cluster}} {{environment}} {{backend}} {{pipeline}}"
    unit: short
    description: Shows durable audit archive delivery failures over 15 minutes.
    thresholds:
      - color: green
      - value: 1
        color: red
    colorMode: value
    noData: No archive status
    grid:
      x: 14
      y: 24
      w: 5
      h: 4
  - id: audit-archive-dead-letters
    title: Archive dead letters
    type: stat
    signal: metrics
    datasource: metrics
    expression: sum by (cluster, environment, backend, pipeline) (increase(openbao_audit_archive_dead_letter_records_total{cluster=~"${cluster:raw}",environment=~"${environment:raw}",backend=~"${archive_backend:raw}",pipeline=~"${archive_pipeline:raw}"}[15m]))
    legend: "{{cluster}} {{environment}} {{backend}} {{pipeline}}"
    unit: short
    description: Shows audit records sent to a dead-letter path instead of the durable archive over 15 minutes.
    thresholds:
      - color: green
      - value: 1
        color: red
    colorMode: value
    noData: No archive status
    grid:
      x: 19
      y: 24
      w: 5
      h: 4
  - id: audit-stream
    title: Audit stream
    type: logs
    signal: logs
    datasource: logs
    expression: '{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.audit"}'
    description: Shows recent OpenBao audit log entries.
    grid:
      x: 0
      y: 28
      w: 24
      h: 9

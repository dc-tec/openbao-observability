version: v0.1
status: draft
uid: openbao-overview
title: OpenBao overview
refresh: 30s
tags:
  - openbao
  - reference
  - generated
timeRange:
  from: now-1h
  to: now
datasources:
  metrics:
    type: prometheus
    uid: prometheus
  logs:
    type: loki
    uid: loki
panels:
  - id: scrape-health
    title: Scrape health
    type: stat
    signal: metrics
    datasource: metrics
    expression: min(up{job="openbao"})
    unit: none
    description: Shows whether Prometheus can scrape OpenBao.
    grid:
      x: 0
      y: 0
      w: 6
      h: 4
  - id: active-nodes
    title: Active nodes
    type: stat
    signal: metrics
    datasource: metrics
    expression: openbao:core_active:sum
    unit: none
    description: Shows the number of active OpenBao nodes.
    grid:
      x: 6
      y: 0
      w: 6
      h: 4
  - id: unsealed-nodes
    title: Unsealed nodes
    type: stat
    signal: metrics
    datasource: metrics
    expression: openbao:core_unsealed:sum
    unit: none
    description: Shows the number of unsealed OpenBao nodes.
    grid:
      x: 12
      y: 0
      w: 6
      h: 4
  - id: audit-request-failures
    title: Audit request failures
    type: stat
    signal: metrics
    datasource: metrics
    expression: openbao:audit_log_request_failure:increase5m
    unit: none
    description: Shows audit request logging failures over 5 minutes.
    grid:
      x: 18
      y: 0
      w: 6
      h: 4
  - id: raft-peers
    title: Raft peers
    type: stat
    signal: metrics
    datasource: metrics
    expression: openbao:raft_peers:max
    unit: none
    description: Shows the maximum observed Raft peer count.
    grid:
      x: 0
      y: 4
      w: 6
      h: 4
  - id: autopilot-health
    title: Autopilot health
    type: stat
    signal: metrics
    datasource: metrics
    expression: openbao:autopilot_healthy:max
    unit: none
    description: Shows whether OpenBao Autopilot reports the Raft cluster as healthy.
    grid:
      x: 6
      y: 4
      w: 6
      h: 4
  - id: autopilot-failure-tolerance
    title: Failure tolerance
    type: stat
    signal: metrics
    datasource: metrics
    expression: openbao:autopilot_failure_tolerance:max
    unit: none
    description: Shows the number of voter failures Autopilot reports the cluster can tolerate.
    grid:
      x: 12
      y: 4
      w: 6
      h: 4
  - id: autopilot-unhealthy-nodes
    title: Unhealthy Raft nodes
    type: stat
    signal: metrics
    datasource: metrics
    expression: sum(1 - openbao:autopilot_node_healthy:min)
    unit: none
    description: Shows the number of Raft nodes Autopilot reports as unhealthy.
    grid:
      x: 18
      y: 4
      w: 6
      h: 4
  - id: autopilot-node-health
    title: Autopilot node health
    type: timeseries
    signal: metrics
    datasource: metrics
    expression: openbao:autopilot_node_healthy:min
    legend: "{{node_id}}"
    unit: none
    description: Shows Autopilot node health by Raft node ID.
    grid:
      x: 0
      y: 8
      w: 8
      h: 8
  - id: lease-count
    title: Lease count
    type: timeseries
    signal: metrics
    datasource: metrics
    expression: openbao:expire_num_leases:max
    unit: short
    description: Shows the maximum observed lease count.
    grid:
      x: 8
      y: 8
      w: 8
      h: 8
  - id: goroutines
    title: Goroutines
    type: timeseries
    signal: metrics
    datasource: metrics
    expression: openbao:runtime_num_goroutines:max
    unit: short
    description: Shows the maximum observed Go goroutine count.
    grid:
      x: 16
      y: 8
      w: 8
      h: 8
  - id: audit-stream
    title: Audit stream
    type: logs
    signal: logs
    datasource: logs
    expression: '{log_stream="openbao.audit"}'
    description: Shows OpenBao audit events collected by Alloy.
    grid:
      x: 0
      y: 16
      w: 12
      h: 9
  - id: operational-errors
    title: Operational errors
    type: logs
    signal: logs
    datasource: logs
    expression: '{log_stream="openbao.operational"} |= "error"'
    description: Shows OpenBao operational log entries containing error.
    grid:
      x: 12
      y: 16
      w: 12
      h: 9

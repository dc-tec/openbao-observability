version: v0.1
status: draft
uid: openbao-secret-engines-mounts
title: OpenBao secret engines and mounts
refresh: 30s
tags:
  - audit
  - generated
  - mounts
  - openbao
  - reference
  - secret-engines
timeRange:
  from: now-1h
  to: now
datasources:
  metrics:
    type: prometheus
    uid: prometheus
  logs:
    type: loki
    uid: loki
variables:
  - name: request_id
    label: Request ID
    type: textbox
    default: .*
  - name: engine_path
    label: Engine or mount path
    type: textbox
    default: .*
  - name: operation
    label: Operation
    type: custom
    default: .*
    options:
      - .*
      - read
      - list
      - create
      - update
      - delete
  - name: node_id
    label: Node
    type: textbox
    default: .*
panels:
  - id: secret-engine-events
    title: Secret engine events
    type: stat
    signal: logs
    datasource: logs
    expression: 'sum(count_over_time({log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json operation="request.operation", request_id="request.id", request_path="request.path" | request_path=~"(secret|kv-v1|database|transit|pki)(/.*)?" | request_path=~"${engine_path:raw}" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}" [5m]))'
    unit: short
    description: Shows audited secret engine events matching the selected filters over 5 minutes.
    grid:
      x: 0
      y: 0
      w: 6
      h: 4
  - id: mount-lifecycle-events
    title: Mount lifecycle events
    type: stat
    signal: logs
    datasource: logs
    expression: 'sum(count_over_time({log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json operation="request.operation", request_id="request.id", request_path="request.path" | request_path=~"sys/mounts(/.*)?" | request_path=~"${engine_path:raw}" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}" [5m]))'
    unit: short
    description: Shows audited mount table reads and mount lifecycle changes over 5 minutes.
    grid:
      x: 6
      y: 0
      w: 6
      h: 4
  - id: kv-events
    title: KV v1 and v2 events
    type: stat
    signal: logs
    datasource: logs
    expression: 'sum(count_over_time({log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json operation="request.operation", request_id="request.id", request_path="request.path" | request_path=~"(secret/(data|metadata)/.*|kv-v1/.*)" | request_path=~"${engine_path:raw}" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}" [5m]))'
    unit: short
    description: Shows audited KV v1 and KV v2 data and metadata events over 5 minutes.
    grid:
      x: 12
      y: 0
      w: 6
      h: 4
  - id: dynamic-database-events
    title: Database events
    type: stat
    signal: logs
    datasource: logs
    expression: 'sum(count_over_time({log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json operation="request.operation", request_id="request.id", request_path="request.path" | request_path=~"database/(config|roles|creds|rotate-root).*" | request_path=~"${engine_path:raw}" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}" [5m]))'
    unit: short
    description: Shows audited database secrets engine configuration, role, and credential events over 5 minutes.
    grid:
      x: 18
      y: 0
      w: 6
      h: 4
  - id: transit-events
    title: Transit events
    type: stat
    signal: logs
    datasource: logs
    expression: 'sum(count_over_time({log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json operation="request.operation", request_id="request.id", request_path="request.path" | request_path=~"transit/(keys|encrypt|decrypt|rewrap|sign|verify|hmac).*" | request_path=~"${engine_path:raw}" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}" [5m]))'
    unit: short
    description: Shows audited Transit key and cryptographic operation events over 5 minutes.
    grid:
      x: 0
      y: 4
      w: 6
      h: 4
  - id: pki-events
    title: PKI events
    type: stat
    signal: logs
    datasource: logs
    expression: 'sum(count_over_time({log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json operation="request.operation", request_id="request.id", request_path="request.path" | request_path=~"pki/(roles|issue|issuer|root|cert|tidy|revoke).*" | request_path=~"${engine_path:raw}" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}" [5m]))'
    unit: short
    description: Shows audited PKI engine events when the deployment enables PKI.
    grid:
      x: 6
      y: 4
      w: 6
      h: 4
  - id: secret-engine-errors
    title: Response errors
    type: stat
    signal: logs
    datasource: logs
    expression: 'sum(count_over_time({log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json audit_type="type", audit_error="error", operation="request.operation", request_id="request.id", request_path="request.path" | audit_type="response" | audit_error!="" | request_path=~"(secret|kv-v1|database|transit|pki)(/.*)?" | request_path=~"${engine_path:raw}" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}" [5m]))'
    unit: short
    description: Shows audited secret engine response entries with error fields over 5 minutes.
    grid:
      x: 12
      y: 4
      w: 6
      h: 4
  - id: denied-secret-engine-requests
    title: Denied requests
    type: stat
    signal: logs
    datasource: logs
    expression: 'sum(count_over_time({log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json audit_error="error", operation="request.operation", request_id="request.id", request_path="request.path" | audit_error=~"(?s).*permission denied.*" | request_path=~"(secret|kv-v1|database|transit|pki)(/.*)?" | request_path=~"${engine_path:raw}" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}" [5m]))'
    unit: short
    description: Shows audited secret engine requests denied by policy over 5 minutes.
    grid:
      x: 18
      y: 4
      w: 6
      h: 4
  - id: secret-engine-events-by-node
    title: Secret engine events by node
    type: timeseries
    signal: logs
    datasource: logs
    expression: 'sum by (node_id) (count_over_time({log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json operation="request.operation", request_id="request.id", request_path="request.path" | request_path=~"(secret|kv-v1|database|transit|pki)(/.*)?" | request_path=~"${engine_path:raw}" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}" [5m]))'
    legend: "{{node_id}}"
    unit: short
    description: Shows filtered secret engine audit event volume by OpenBao node over 5 minutes.
    grid:
      x: 0
      y: 8
      w: 12
      h: 8
  - id: mount-events-by-node
    title: Mount lifecycle by node
    type: timeseries
    signal: logs
    datasource: logs
    expression: 'sum by (node_id) (count_over_time({log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json operation="request.operation", request_id="request.id", request_path="request.path" | request_path=~"sys/mounts(/.*)?" | request_path=~"${engine_path:raw}" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}" [5m]))'
    legend: "{{node_id}}"
    unit: short
    description: Shows mount table and lifecycle audit event volume by OpenBao node over 5 minutes.
    grid:
      x: 12
      y: 8
      w: 12
      h: 8
  - id: kv-database-transit-events-by-node
    title: KV, database, and Transit by node
    type: timeseries
    signal: logs
    datasource: logs
    expression: 'sum by (node_id) (count_over_time({log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json operation="request.operation", request_id="request.id", request_path="request.path" | request_path=~"(secret/(data|metadata)/.*|kv-v1/.*|database/(config|roles|creds|rotate-root).*|transit/(keys|encrypt|decrypt|rewrap|sign|verify|hmac).*)" | request_path=~"${engine_path:raw}" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}" [5m]))'
    legend: "{{node_id}}"
    unit: short
    description: Shows common secret engine activity by OpenBao node over 5 minutes.
    grid:
      x: 0
      y: 16
      w: 24
      h: 8
  - id: mount-lifecycle-log
    title: Mount lifecycle events
    type: logs
    signal: logs
    datasource: logs
    expression: '{log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json operation="request.operation", request_id="request.id", request_path="request.path" | request_path=~"sys/mounts(/.*)?" | request_path=~"${engine_path:raw}" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}"'
    description: Shows audited mount table reads and mount lifecycle changes.
    grid:
      x: 0
      y: 24
      w: 12
      h: 9
  - id: kv-events-log
    title: KV v1 and v2 events
    type: logs
    signal: logs
    datasource: logs
    expression: '{log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json operation="request.operation", request_id="request.id", request_path="request.path" | request_path=~"(secret/(data|metadata)/.*|kv-v1/.*)" | request_path=~"${engine_path:raw}" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}"'
    description: Shows audited KV v1 and KV v2 data and metadata requests.
    grid:
      x: 12
      y: 24
      w: 12
      h: 9
  - id: database-events-log
    title: Database events
    type: logs
    signal: logs
    datasource: logs
    expression: '{log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json operation="request.operation", request_id="request.id", request_path="request.path" | request_path=~"database/(config|roles|creds|rotate-root).*" | request_path=~"${engine_path:raw}" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}"'
    description: Shows audited database secrets engine requests.
    grid:
      x: 0
      y: 33
      w: 12
      h: 9
  - id: transit-events-log
    title: Transit events
    type: logs
    signal: logs
    datasource: logs
    expression: '{log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json operation="request.operation", request_id="request.id", request_path="request.path" | request_path=~"transit/(keys|encrypt|decrypt|rewrap|sign|verify|hmac).*" | request_path=~"${engine_path:raw}" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}"'
    description: Shows audited Transit key and cryptographic operation requests.
    grid:
      x: 12
      y: 33
      w: 12
      h: 9
  - id: secret-engine-error-log
    title: Secret engine response errors
    type: logs
    signal: logs
    datasource: logs
    expression: '{log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json audit_type="type", audit_error="error", operation="request.operation", request_id="request.id", request_path="request.path" | audit_type="response" | audit_error!="" | request_path=~"(secret|kv-v1|database|transit|pki)(/.*)?" | request_path=~"${engine_path:raw}" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}"'
    description: Shows audited secret engine response entries that include error fields.
    grid:
      x: 0
      y: 42
      w: 12
      h: 9
  - id: filtered-secret-engine-stream
    title: Filtered secret engine stream
    type: logs
    signal: logs
    datasource: logs
    expression: '{log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json operation="request.operation", request_id="request.id", request_path="request.path" | request_path=~"(secret|kv-v1|database|transit|pki|sys/mounts)(/.*)?" | request_path=~"${engine_path:raw}" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}"'
    description: Shows the full filtered stream for secret engine and mount investigation.
    grid:
      x: 12
      y: 42
      w: 12
      h: 9

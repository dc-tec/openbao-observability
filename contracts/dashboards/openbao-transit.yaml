version: v0.1
maturity:
  lifecycle: draft
  evidence:
    - generated-validated
uid: openbao-transit
title: OpenBao Transit
refresh: 30s
tags:
  - audit
  - generated
  - openbao
  - reference
  - secret-engines
  - transit
timeRange:
  from: now-1h
  to: now
datasources:
  metrics:
    type: prometheus
    uid: prometheus
  logs:
    type: loki
    uid: loki
variables:
  - name: cluster
    label: Cluster
    type: textbox
    default: .*
  - name: kubernetes_namespace
    label: Kubernetes namespace
    type: textbox
    default: .*
  - name: request_id
    label: Request ID
    type: textbox
    default: .*
  - name: transit_path
    label: Transit mount path
    type: textbox
    default: transit
  - name: operation
    label: Operation
    type: custom
    default: .*
    options:
      - .*
      - read
      - list
      - create
      - update
      - delete
  - name: node_id
    label: Node
    type: textbox
    default: .*
panels:
  - id: transit-audit-events
    title: Transit audit events
    type: stat
    signal: logs
    datasource: logs
    expression: 'sum by (cluster, kubernetes_namespace) (count_over_time({cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json audit_type="type", operation="request.operation", request_id="request.id", request_path="request.path" | audit_type="request" | request_path=~"${transit_path:raw}/(keys|encrypt|decrypt|rewrap|sign|verify|hmac|random|hash|datakey)(/.*)?" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}" [5m]))'
    unit: short
    description: Shows audited Transit requests matching the selected filters over 5 minutes.
    grid:
      x: 0
      y: 0
      w: 6
      h: 4
  - id: transit-response-errors
    title: Transit response errors
    type: stat
    signal: logs
    datasource: logs
    expression: 'sum by (cluster, kubernetes_namespace) (count_over_time({cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json audit_type="type", audit_error="error", operation="request.operation", request_id="request.id", request_path="request.path" | audit_type="response" | audit_error!="" | request_path=~"${transit_path:raw}/(keys|encrypt|decrypt|rewrap|sign|verify|hmac|random|hash|datakey)(/.*)?" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}" [5m]))'
    unit: short
    description: Shows audited Transit response entries with error fields over 5 minutes.
    grid:
      x: 6
      y: 0
      w: 6
      h: 4
  - id: transit-denied-requests
    title: Transit denied requests
    type: stat
    signal: logs
    datasource: logs
    expression: 'sum by (cluster, kubernetes_namespace) (count_over_time({cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json audit_error="error", operation="request.operation", request_id="request.id", request_path="request.path" | audit_error=~"(?s).*permission denied.*" | request_path=~"${transit_path:raw}/(keys|encrypt|decrypt|rewrap|sign|verify|hmac|random|hash|datakey)(/.*)?" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}" [5m]))'
    unit: short
    description: Shows audited Transit requests denied by policy over 5 minutes.
    grid:
      x: 12
      y: 0
      w: 6
      h: 4
  - id: transit-key-events
    title: Transit key events
    type: stat
    signal: logs
    datasource: logs
    expression: 'sum by (cluster, kubernetes_namespace) (count_over_time({cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json audit_type="type", operation="request.operation", request_id="request.id", request_path="request.path" | audit_type="request" | request_path=~"${transit_path:raw}/keys(/.*)?" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}" [5m]))'
    unit: short
    description: Shows audited Transit key management requests over 5 minutes.
    grid:
      x: 18
      y: 0
      w: 6
      h: 4
  - id: transit-encrypt-events
    title: Encrypt requests
    type: stat
    signal: logs
    datasource: logs
    expression: 'sum by (cluster, kubernetes_namespace) (count_over_time({cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json audit_type="type", operation="request.operation", request_id="request.id", request_path="request.path" | audit_type="request" | request_path=~"${transit_path:raw}/encrypt(/.*)?" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}" [5m]))'
    unit: short
    description: Shows audited Transit encrypt requests over 5 minutes.
    grid:
      x: 0
      y: 4
      w: 6
      h: 4
  - id: transit-decrypt-events
    title: Decrypt requests
    type: stat
    signal: logs
    datasource: logs
    expression: 'sum by (cluster, kubernetes_namespace) (count_over_time({cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json audit_type="type", operation="request.operation", request_id="request.id", request_path="request.path" | audit_type="request" | request_path=~"${transit_path:raw}/decrypt(/.*)?" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}" [5m]))'
    unit: short
    description: Shows audited Transit decrypt requests over 5 minutes.
    grid:
      x: 6
      y: 4
      w: 6
      h: 4
  - id: transit-sign-verify-events
    title: Sign and verify requests
    type: stat
    signal: logs
    datasource: logs
    expression: 'sum by (cluster, kubernetes_namespace) (count_over_time({cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json audit_type="type", operation="request.operation", request_id="request.id", request_path="request.path" | audit_type="request" | request_path=~"${transit_path:raw}/(sign|verify)(/.*)?" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}" [5m]))'
    unit: short
    description: Shows audited Transit sign and verify requests over 5 minutes.
    grid:
      x: 12
      y: 4
      w: 6
      h: 4
  - id: transit-data-utility-events
    title: Datakey, random, hash, and HMAC
    type: stat
    signal: logs
    datasource: logs
    expression: 'sum by (cluster, kubernetes_namespace) (count_over_time({cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json audit_type="type", operation="request.operation", request_id="request.id", request_path="request.path" | audit_type="request" | request_path=~"${transit_path:raw}/(datakey|random|hash|hmac)(/.*)?" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}" [5m]))'
    unit: short
    description: Shows audited Transit datakey, random, hash, and HMAC requests over 5 minutes.
    grid:
      x: 18
      y: 4
      w: 6
      h: 4
  - id: transit-audit-events-by-node
    title: Transit audit events by node
    type: timeseries
    signal: logs
    datasource: logs
    expression: 'sum by (cluster, kubernetes_namespace, node_id) (count_over_time({cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json audit_type="type", operation="request.operation", request_id="request.id", request_path="request.path" | audit_type="request" | request_path=~"${transit_path:raw}/(keys|encrypt|decrypt|rewrap|sign|verify|hmac|random|hash|datakey)(/.*)?" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}" [5m]))'
    legend: "{{cluster}} {{kubernetes_namespace}} {{node_id}}"
    unit: short
    description: Shows filtered Transit request volume by OpenBao node over 5 minutes.
    grid:
      x: 0
      y: 8
      w: 12
      h: 8
  - id: transit-response-errors-by-node
    title: Transit response errors by node
    type: timeseries
    signal: logs
    datasource: logs
    expression: 'sum by (cluster, kubernetes_namespace, node_id) (count_over_time({cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json audit_type="type", audit_error="error", operation="request.operation", request_id="request.id", request_path="request.path" | audit_type="response" | audit_error!="" | request_path=~"${transit_path:raw}/(keys|encrypt|decrypt|rewrap|sign|verify|hmac|random|hash|datakey)(/.*)?" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}" [5m]))'
    legend: "{{cluster}} {{kubernetes_namespace}} {{node_id}}"
    unit: short
    description: Shows audited Transit response errors by OpenBao node over 5 minutes.
    grid:
      x: 12
      y: 8
      w: 12
      h: 8
  - id: transit-key-events-by-node
    title: Transit key events by node
    type: timeseries
    signal: logs
    datasource: logs
    expression: 'sum by (cluster, kubernetes_namespace, node_id) (count_over_time({cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json audit_type="type", operation="request.operation", request_id="request.id", request_path="request.path" | audit_type="request" | request_path=~"${transit_path:raw}/keys(/.*)?" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}" [5m]))'
    legend: "{{cluster}} {{kubernetes_namespace}} {{node_id}}"
    unit: short
    description: Shows Transit key management request volume by OpenBao node over 5 minutes.
    grid:
      x: 0
      y: 16
      w: 12
      h: 8
  - id: transit-crypto-events-by-node
    title: Transit crypto requests by node
    type: timeseries
    signal: logs
    datasource: logs
    expression: 'sum by (cluster, kubernetes_namespace, node_id) (count_over_time({cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json audit_type="type", operation="request.operation", request_id="request.id", request_path="request.path" | audit_type="request" | request_path=~"${transit_path:raw}/(encrypt|decrypt|rewrap|sign|verify|hmac|random|hash|datakey)(/.*)?" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}" [5m]))'
    legend: "{{cluster}} {{kubernetes_namespace}} {{node_id}}"
    unit: short
    description: Shows Transit cryptographic request volume by OpenBao node over 5 minutes.
    grid:
      x: 12
      y: 16
      w: 12
      h: 8
  - id: transit-key-management-log
    title: Transit key management stream
    type: logs
    signal: logs
    datasource: logs
    expression: '{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json audit_type="type", operation="request.operation", request_id="request.id", request_path="request.path" | audit_type="request" | request_path=~"${transit_path:raw}/keys(/.*)?" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}"'
    description: Shows audited Transit key management requests.
    grid:
      x: 0
      y: 24
      w: 12
      h: 9
  - id: transit-crypto-log
    title: Transit cryptographic request stream
    type: logs
    signal: logs
    datasource: logs
    expression: '{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json audit_type="type", operation="request.operation", request_id="request.id", request_path="request.path" | audit_type="request" | request_path=~"${transit_path:raw}/(encrypt|decrypt|rewrap|sign|verify|hmac|random|hash|datakey)(/.*)?" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}"'
    description: Shows audited Transit cryptographic operation requests.
    grid:
      x: 12
      y: 24
      w: 12
      h: 9
  - id: transit-response-error-log
    title: Transit response error stream
    type: logs
    signal: logs
    datasource: logs
    expression: '{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.audit", node_id=~"${node_id:raw}"} | json audit_type="type", audit_error="error", operation="request.operation", request_id="request.id", request_path="request.path" | audit_type="response" | audit_error!="" | request_path=~"${transit_path:raw}/(keys|encrypt|decrypt|rewrap|sign|verify|hmac|random|hash|datakey)(/.*)?" | request_id=~"${request_id:raw}" | operation=~"${operation:raw}"'
    description: Shows audited Transit response entries that include error fields.
    grid:
      x: 0
      y: 33
      w: 12
      h: 9
  - id: transit-operational-symptoms
    title: Transit operational symptoms
    type: logs
    signal: logs
    datasource: logs
    expression: '{cluster=~"${cluster:raw}",kubernetes_namespace=~"${kubernetes_namespace:raw}",log_stream="openbao.operational", node_id=~"${node_id:raw}"} |~ "(?i)(transit|sealwrap|cipher|crypto|key)" |~ "(?i)(error|failed|warn|timeout|denied)"'
    description: Shows operational log lines that mention Transit, cryptographic, or key symptoms.
    grid:
      x: 12
      y: 33
      w: 12
      h: 9

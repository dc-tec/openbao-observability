    description: Commit minus applied index for the same target and peer, clamped at zero. Both samples must be present in the same bucket; this is local apply backlog, not wall-clock replication lag.
    search: |
      | `openbao_metric_samples("${p}_raft_storage_stats_*")`
      | where metric_name="${p}_raft_storage_stats_commit_index" OR metric_name="${p}_raft_storage_stats_applied_index"
      | eval peer_id=coalesce(peer_id,"(missing)"), series=instance ." | ".peer_id ." | ".cluster ." | ".scrape_profile
      | stats max(eval(if(match(metric_name,"_commit_index$"),value,null()))) AS committed max(eval(if(match(metric_name,"_applied_index$"),value,null()))) AS applied BY bucket_time cluster scrape_profile series
      | where isnotnull(committed) AND isnotnull(applied)
      | eval value=max(committed-applied,0)
      | eval _time=bucket_time
      | timechart span=15s max(value) BY series limit=20 useother=f cont=f
  - sourcePanel: raft-fsm-pending
    description: Raft FSM pending operations by target.
    search: |
      | `openbao_metric_samples("${p}_raft_storage_stats_fsm_pending")`
      | eval series=cluster." / ".scrape_profile." / ".instance
      | timechart span=15s max(value) BY series limit=0 useother=f
  - sourcePanel: namespace-audit-stream
    description: Audit entries filtered by logical namespace path using the shared input. This profile uses request.namespace.path; the Grafana reference can use namespace IDs. Counts use the selected range.
    search: |
      `openbao_audit_events`
      | sort 100 - _time
      | table _time host audit_type request_id logical_namespace request_path operation caller client_ip audit_error
  - sourcePanel: namespace-response-error-stream
    description: Audit entries filtered by logical namespace path using the shared input. This profile uses request.namespace.path; the Grafana reference can use namespace IDs. Counts use the selected range.
    search: |
      `openbao_audit_events`
      | where audit_type="response" AND len(mvjoin(audit_error,""))>0
      | sort 100 - _time
      | table _time host audit_type request_id logical_namespace request_path operation caller client_ip audit_error
  - sourcePanel: scale-operational-symptoms
    description: OpenBao JSON operational logs. Only timestamp, host, severity, module, and message are exposed. Error text can contain sensitive information. Charts use disjoint five-minute buckets; this is not a client-latency measurement.

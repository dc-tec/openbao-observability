  - sourcePanel: privileged-configuration-mutations
    description: Allowlisted audit metadata. Counts include separate request and response entries unless the query selects a type. Counts use the selected range; charts use disjoint five-minute buckets. Missing caller names do not imply anonymous access.
    search: |
      `openbao_audit_events`
      | where match(operation,"^(create|update|delete)$") AND match(request_path,"^sys/(policies|auth|mounts)(/|$)")
      | stats count AS value
  - sourcePanel: permission-denied-responses
    description: Audit entries whose visible error text matches permission denied or forbidden. HMAC-protected errors cannot be classified by this query. This is not an HTTP status count.
    search: |
      `openbao_audit_events`
      | where match(mvjoin(audit_error," "),"(?is)(permission denied|forbidden)") AND (audit_type="response" OR (audit_type="request" AND match(mvjoin(audit_error," "),"(?i)^forbidden$")))
      | stats count AS value
  - sourcePanel: audit-archive-enabled
    description: Requires the separate audit-archive health exporter. These are exporter reports, not proof that an object-store copy is complete or immutable. Failure counters use 15-minute reset-corrected increases; missing telemetry is unknown. Last-success age is in seconds.
    search: |

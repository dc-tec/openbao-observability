---
version: v0.1
maturity:
  lifecycle: draft
  evidence:
  - documented
  - fixture-validated
  - generated-validated
appID: openbao_observability
title: OpenBao observability
metricsIndex: openbao_metrics
metricsPrefix: vault
defaultCluster: compose
defaultScrapeProfile: all_nodes
auditIndex: openbao_audit
auditSourcetype: openbao:audit
fields:
  audit_type: type
  request_id: request.id
  request_path: request.path
  operation: request.operation
  logical_namespace: request.namespace.path
  caller: auth.display_name
  client_ip: request.remote_address
  audit_error: error
macros:
- name: openbao_metric_samples
  arguments:
  - metric
  definition: mstats latest(_value) AS value latest_time(_value) AS observed_at WHERE `openbao_metric_source` metric_name=$metric$ BY _timeseries span=15s | spath input=_timeseries | eval bucket_time=_time, _time=observed_at | eval kubernetes_namespace=coalesce(kubernetes_namespace,"(none)"), openbao_namespace=coalesce(openbao_namespace,"(root)"), instance=coalesce(instance,"(missing)") | eval scrape_profile=coalesce(scrape_profile,"external"), kubernetes_namespace=if(kubernetes_namespace="(none)",coalesce(namespace,"(none)"),kubernetes_namespace)
- name: openbao_metric_fresh
  arguments: []
  definition: addinfo | where _time >= info_max_time-45
- name: openbao_metric_rate5m
  arguments: []
  definition: |-
    sort 0 _time | streamstats current=f last(value) AS previous BY _timeseries | eval reset=if(value<previous,previous,0) | streamstats sum(reset) AS correction BY _timeseries | eval corrected=value+correction | streamstats time_window=5m count AS samples first(corrected) AS first_value
      first(_time) AS first_time first(value) AS first_raw BY _timeseries
    | eval duration=_time-first_time, delta=corrected-first_value | where samples>1 AND duration>0 | eval interval=duration/(samples-1), to_start=300-duration | eval to_start=if(delta>0 AND first_raw>=0,min(to_start,duration*first_raw/delta),to_start) | eval extrapolated=if(to_start<interval*1.1,to_start,interval/2) | eval value=delta*(duration+extrapolated)/duration/300 | fields - previous reset correction corrected samples first_value first_time first_raw duration delta interval to_start extrapolated
- name: openbao_metric_slope5m
  arguments: []
  definition: |-
    addinfo | eval x=_time-info_min_time, xy=x*value, xx=x*x | sort 0 _time | streamstats time_window=5m count AS n sum(x) AS sx sum(value) AS sy
      sum(xy) AS sxy sum(xx) AS sxx BY instance cluster scrape_profile
    | eval denominator=n*sxx-sx*sx | where n>1 AND denominator>0 | eval value=(n*sxy-sx*sy)/denominator | fields - x xy xx n sx sy sxy sxx denominator
- name: openbao_metric_active_expiration
  arguments: []
  definition: eval active_marker=if(match(metric_name,"_core_active$"),value,null()) | eventstats max(active_marker) AS active BY bucket_time instance cluster scrape_profile | where active=1 AND NOT match(metric_name,"_core_active$") | fields - active_marker active
- name: openbao_metric_rate15m
  arguments: []
  definition: |-
    sort 0 _time | streamstats current=f last(value) AS previous BY _timeseries | eval reset=if(value<previous,previous,0) | streamstats sum(reset) AS correction BY _timeseries | eval corrected=value+correction | streamstats time_window=15m count AS samples first(corrected) AS first_value
      first(_time) AS first_time first(value) AS first_raw BY _timeseries
    | eval duration=_time-first_time, delta=corrected-first_value | where samples>1 AND duration>0 | eval interval=duration/(samples-1), to_start=900-duration | eval to_start=if(delta>0 AND first_raw>=0,min(to_start,duration*first_raw/delta),to_start) | eval extrapolated=if(to_start<interval*1.1,to_start,interval/2) | eval value=delta*(duration+extrapolated)/duration/900 | fields - previous reset correction corrected samples first_value first_time first_raw duration delta interval to_start extrapolated
- name: openbao_metric_rate30m
  arguments: []
  definition: |-
    sort 0 _time | streamstats current=f last(value) AS previous BY _timeseries | eval reset=if(value<previous,previous,0) | streamstats sum(reset) AS correction BY _timeseries | eval corrected=value+correction | streamstats time_window=30m count AS samples first(corrected) AS first_value
      first(_time) AS first_time first(value) AS first_raw BY _timeseries
    | eval duration=_time-first_time, delta=corrected-first_value | where samples>1 AND duration>0 | eval interval=duration/(samples-1), to_start=1800-duration | eval to_start=if(delta>0 AND first_raw>=0,min(to_start,duration*first_raw/delta),to_start) | eval extrapolated=if(to_start<interval*1.1,to_start,interval/2) | eval value=delta*(duration+extrapolated)/duration/1800 | fields - previous reset correction corrected samples first_value first_time first_raw duration delta interval to_start extrapolated
dashboards:
- id: openbao_audit_investigation
  source: contracts/dashboards/openbao-audit-investigation.yaml
  description: OpenBao audit investigation. Native SPL operator-question bindings. Read panel descriptions for windows, missing data, and required external sources. Native alert parity is not mapped. See the profile validation record for tested environments.
  panels:
  - sourcePanel: filtered-audit-events
    description: Audit entries in the selected time range. Request and response entries are separate events; this is not a unique API request count.
    search: |
      `openbao_audit_events`
      | stats count AS audit_events
  - sourcePanel: risky-system-mutations
    description: Audit entries for create, update, or delete operations on high-risk system paths in the selected time range. Activity is not proof of unauthorized behavior.
    search: |
      `openbao_audit_events`
      | where match(operation,"^(create|update|delete)$") AND match(request_path,"^sys/(auth|audit|mounts|policies|raw|plugins|storage/raft|rotate)")
      | stats count AS audit_events
  - sourcePanel: auth-activity
    description: Audit entries for authentication and token paths in the selected time range. Includes request and response entries.
    search: |
      `openbao_audit_events`
      | where match(request_path,"^(auth/|sys/auth/)")
      | stats count AS audit_events
  - sourcePanel: audit-response-errors
    description: Response entries with a nonempty top-level error in the selected time range. Does not infer an HTTP status from the audit payload.
    search: |
      `openbao_audit_events`
      | where audit_type="response" AND len(mvjoin(audit_error,""))>0
      | stats count AS response_errors
  - sourcePanel: filtered-audit-events-by-node
    description: Audit event volume by Splunk host in the selected time range. Configure host as the emitting OpenBao node during ingestion.
    search: |
      `openbao_audit_events`
      | timechart span=5m count BY host limit=10 useother=t
  - sourcePanel: risky-system-activity-by-node
    description: High-risk system mutation entries by emitting host in the selected time range.
    search: |
      `openbao_audit_events`
      | where match(operation,"^(create|update|delete)$") AND match(request_path,"^sys/(auth|audit|mounts|policies|raw|plugins|storage/raft|rotate)")
      | timechart span=5m count BY host limit=10 useother=t
  - sourcePanel: audit-configuration-activity
    description: Allowlisted audit metadata. Counts include separate request and response entries unless the query selects a type. Counts use the selected range; charts use disjoint five-minute buckets. Missing caller names do not imply anonymous access.
    search: |
      `openbao_audit_events`
      | where match(operation,"^(create|update|delete)$") AND match(request_path,"^sys/audit(/|$)")
      | stats count AS value
  - sourcePanel: privileged-configuration-mutations
    description: Allowlisted audit metadata. Counts include separate request and response entries unless the query selects a type. Counts use the selected range; charts use disjoint five-minute buckets. Missing caller names do not imply anonymous access.
    search: |
      `openbao_audit_events`
      | where match(operation,"^(create|update|delete)$") AND match(request_path,"^sys/(policies|auth|mounts)(/|$)")
      | stats count AS value
  - sourcePanel: high-risk-system-path-activity
    description: Allowlisted audit metadata. Counts include separate request and response entries unless the query selects a type. Counts use the selected range; charts use disjoint five-minute buckets. Missing caller names do not imply anonymous access.
    search: |
      `openbao_audit_events`
      | where match(request_path,"^sys/(auth|audit|mounts|policies|raw|plugins|storage/raft|rotate)")
      | stats count AS value
  - sourcePanel: permission-denied-responses
    description: Audit entries whose visible error text matches permission denied or forbidden. HMAC-protected errors cannot be classified by this query. This is not an HTTP status count.
    search: |
      `openbao_audit_events`
      | where match(mvjoin(audit_error," "),"(?is)(permission denied|forbidden)") AND (audit_type="response" OR (audit_type="request" AND match(mvjoin(audit_error," "),"(?i)^forbidden$")))
      | stats count AS value
  - sourcePanel: request-id-drilldown
    description: Recent allowlisted request metadata. Use the request ID filter for correlation; matching entries do not establish end-to-end request duration. Credential and secret payload fields are omitted.
    search: |
      `openbao_audit_events`
      | sort 100 - _time
      | table _time host audit_type request_id logical_namespace request_path operation caller client_ip audit_error
  - sourcePanel: risky-system-events
    description: Allowlisted audit metadata. Counts include separate request and response entries unless the query selects a type. Counts use the selected range; charts use disjoint five-minute buckets. Missing caller names do not imply anonymous access.
    search: |
      `openbao_audit_events`
      | where match(operation,"^(create|update|delete)$") AND match(request_path,"^sys/(auth|audit|mounts|policies|raw|plugins|storage/raft|rotate)")
      | sort 100 - _time
      | table _time host audit_type request_id logical_namespace request_path operation caller client_ip audit_error
  - sourcePanel: auth-activity-events
    description: Recent authentication and token metadata. Missing caller names do not imply anonymous access; wrapping requests can omit these fields.
    search: |
      `openbao_audit_events`
      | where match(request_path,"^(auth/|sys/auth/)")
      | sort 100 - _time
      | table _time host audit_type request_id logical_namespace request_path operation caller client_ip
  - sourcePanel: audit-error-events
    description: Recent response errors, with only allowlisted metadata. OpenBao audit error text can be HMAC-protected; this is not a complete operational error log.
    search: |
      `openbao_audit_events`
      | where audit_type="response" AND len(mvjoin(audit_error,""))>0
      | sort 100 - _time
      | table _time host request_id logical_namespace request_path operation caller audit_error
  - sourcePanel: audit-configuration-events
    description: Allowlisted audit metadata. Counts include separate request and response entries unless the query selects a type. Counts use the selected range; charts use disjoint five-minute buckets. Missing caller names do not imply anonymous access.
    search: |
      `openbao_audit_events`
      | where match(operation,"^(create|update|delete)$") AND match(request_path,"^sys/audit(/|$)")
      | sort 100 - _time
      | table _time host audit_type request_id logical_namespace request_path operation caller client_ip audit_error
  - sourcePanel: permission-denied-events
    description: Allowlisted audit metadata. Counts include separate request and response entries unless the query selects a type. Counts use the selected range; charts use disjoint five-minute buckets. Missing caller names do not imply anonymous access.
    search: |
      `openbao_audit_events`
      | where match(mvjoin(audit_error," "),"(?is)(permission denied|forbidden)") AND (audit_type="response" OR (audit_type="request" AND match(mvjoin(audit_error," "),"(?i)^forbidden$")))
      | sort 100 - _time
      | table _time host audit_type request_id logical_namespace request_path operation caller client_ip audit_error
  - sourcePanel: filtered-audit-stream
    description: Allowlisted audit metadata. Counts include separate request and response entries unless the query selects a type. Counts use the selected range; charts use disjoint five-minute buckets. Missing caller names do not imply anonymous access.
    search: |
      `openbao_audit_events`
      | sort 100 - _time
      | table _time host audit_type request_id logical_namespace request_path operation caller client_ip audit_error
- id: openbao_overview
  source: contracts/dashboards/openbao-overview.yaml
  description: OpenBao overview. Native SPL operator-question bindings. Read panel descriptions for windows, missing data, and required external sources. Native alert parity is not mapped. See the profile validation record for tested environments.
  panels:
  - sourcePanel: scrape-health
    description: Latest scrape success per target, then the minimum across targets. Samples older than 45 seconds are absent.
    search: |
      | `openbao_metric_samples("up")`
      | `openbao_metric_fresh`
      | stats latest(value) AS value BY cluster instance scrape_profile
      | stats min(value) AS value BY cluster scrape_profile
  - sourcePanel: active-nodes
    description: Sum of fresh active flags across targets. A normal three-node cluster has one active node.
    search: |
      | `openbao_metric_samples("${p}_core_active")`
      | `openbao_metric_fresh`
      | stats latest(value) AS value BY cluster instance scrape_profile
      | stats sum(value) AS value BY cluster scrape_profile
  - sourcePanel: unsealed-nodes
    description: Sum of fresh unsealed flags per target, preferring the cluster-labelled source over startup duplicates. Absence is unknown.
    search: |
      | `openbao_metric_samples("${p}_core_unsealed")`
      | `openbao_metric_fresh`
      | stats latest(value) AS value BY cluster instance scrape_profile seal_state_source
      | eventstats max(eval(if(seal_state_source="cluster",1,0))) AS has_cluster BY cluster instance scrape_profile
      | where seal_state_source="cluster" OR has_cluster=0
      | stats max(value) AS value BY cluster instance scrape_profile
      | stats sum(value) AS value BY cluster scrape_profile
  - sourcePanel: audit-request-failures
    description: Reset-corrected request audit-delivery failures over a rolling five-minute window. An absent metric is unknown, not zero.
    search: |
      | `openbao_metric_samples("${p}_audit_log_request_failure")`
      | where metric_name="${p}_audit_log_request_failure"
      | eval series=case(metric_name="${p}_audit_log_request_failure","audit_log_request_failure") ." | ".coalesce(openbao_namespace,"(missing)") ." | ".cluster ." | ".scrape_profile
      | `openbao_metric_rate5m`
      | eval value=value*300
      | stats sum(value) AS value BY bucket_time cluster scrape_profile series
      | eval _time=bucket_time
      | `openbao_metric_fresh`
      | stats latest(value) AS value BY cluster scrape_profile series
      | stats sum(value) AS value count AS contributing_series
      | where contributing_series>0
      | fields - contributing_series
  - sourcePanel: in-flight-requests
    description: Maximum current in-flight requests across targets.
    search: |
      | `openbao_metric_samples("${p}_core_in_flight_requests")`
      | `openbao_metric_fresh`
      | stats latest(value) AS value BY cluster instance scrape_profile
      | stats max(value) AS value BY cluster scrape_profile
  - sourcePanel: request-rate
    description: Rolling five-minute requests per second from cumulative summary counts, with counter reset correction.
    search: |
      | `openbao_metric_samples("${p}_core_handle_request_count")`
      | `openbao_metric_rate5m`
      | `openbao_metric_fresh`
      | stats sum(value) AS value BY bucket_time cluster scrape_profile
      | rename bucket_time AS _time
      | stats latest(value) AS value BY cluster scrape_profile
  - sourcePanel: request-latency
    description: Rolling five-minute mean request handling duration in milliseconds, weighted by request count across targets.
    search: |
      | `openbao_metric_samples("${p}_core_handle_request*")`
      | where match(metric_name,"_(sum|count)$")
      | `openbao_metric_rate5m`
      | eval sum_rate=if(match(metric_name,"_sum$"),value,0), count_rate=if(match(metric_name,"_count$"),value,0)
      | stats sum(sum_rate) AS total sum(count_rate) AS events BY bucket_time cluster instance scrape_profile
      | where events>0
      | eval value=total/events
      | rename bucket_time AS _time
      | `openbao_metric_fresh`
      | stats latest(total) AS total latest(events) AS events BY cluster instance scrape_profile
      | stats sum(total) AS total sum(events) AS events BY cluster scrape_profile
      | where events>0
      | eval value=total/events
      | fields cluster scrape_profile value
  - sourcePanel: login-latency
    description: Rolling five-minute mean generic login handling duration in milliseconds. This does not isolate LDAP or client-observed latency.
    search: |
      | `openbao_metric_samples("${p}_core_handle_login_request*")`
      | where match(metric_name,"_(sum|count)$")
      | `openbao_metric_rate5m`
      | eval sum_rate=if(match(metric_name,"_sum$"),value,0), count_rate=if(match(metric_name,"_count$"),value,0)
      | stats sum(sum_rate) AS total sum(count_rate) AS events BY bucket_time cluster instance scrape_profile
      | where events>0
      | eval value=total/events
      | rename bucket_time AS _time
      | `openbao_metric_fresh`
      | stats latest(total) AS total latest(events) AS events BY cluster instance scrape_profile
      | stats sum(total) AS total sum(events) AS events BY cluster scrape_profile
      | where events>0
      | eval value=total/events
      | fields cluster scrape_profile value
  - sourcePanel: token-check-latency
    description: Rolling five-minute mean token validation duration in milliseconds, weighted by observations.
    search: |
      | `openbao_metric_samples("${p}_core_check_token*")`
      | where match(metric_name,"_(sum|count)$")
      | `openbao_metric_rate5m`
      | eval sum_rate=if(match(metric_name,"_sum$"),value,0), count_rate=if(match(metric_name,"_count$"),value,0)
      | stats sum(sum_rate) AS total sum(count_rate) AS events BY bucket_time cluster instance scrape_profile
      | where events>0
      | eval value=total/events
      | rename bucket_time AS _time
      | `openbao_metric_fresh`
      | stats latest(total) AS total latest(events) AS events BY cluster instance scrape_profile
      | stats sum(total) AS total sum(events) AS events BY cluster scrape_profile
      | where events>0
      | eval value=total/events
      | fields cluster scrape_profile value
  - sourcePanel: raft-peers
    description: Maximum current Raft peer count. This is not the number of unsealed nodes.
    search: |
      | `openbao_metric_samples("${p}_raft_peers")`
      | `openbao_metric_fresh`
      | stats latest(value) AS value BY cluster instance scrape_profile
      | stats max(value) AS value BY cluster scrape_profile
  - sourcePanel: autopilot-health
    description: Latest available Autopilot health state.
    search: |
      | `openbao_metric_samples("${p}_autopilot_healthy")`
      | `openbao_metric_fresh`
      | stats latest(value) AS value BY cluster instance scrape_profile
      | stats max(value) AS value BY cluster scrape_profile
  - sourcePanel: autopilot-failure-tolerance
    description: Latest available Autopilot failure tolerance.
    search: |
      | `openbao_metric_samples("${p}_autopilot_failure_tolerance")`
      | `openbao_metric_fresh`
      | stats latest(value) AS value BY cluster instance scrape_profile
      | stats max(value) AS value BY cluster scrape_profile
  - sourcePanel: autopilot-unhealthy-nodes
    description: Autopilot node-health flags deduplicated by node_id using the minimum across reporters, then counted. This measures peer health, not voter count or quorum margin.
    search: |
      | `openbao_metric_samples("${p}_autopilot_node_healthy")`
      | where metric_name="${p}_autopilot_node_healthy"
      | eval node_id=coalesce(node_id,"(missing)"), series=cluster ." | ".scrape_profile
      | stats min(value) AS value BY bucket_time cluster scrape_profile series node_id
      | eval value=1-value
      | stats sum(value) AS value BY bucket_time cluster scrape_profile series
      | eval _time=bucket_time
      | `openbao_metric_fresh`
      | stats latest(value) AS value BY cluster scrape_profile series
      | stats sum(value) AS value count AS contributing_series
      | where contributing_series>0
      | fields - contributing_series
  - sourcePanel: autopilot-node-health
    description: Raft node health by node_id. Non-voter and read-replica membership require separate interpretation.
    search: |
      | `openbao_metric_samples("${p}_autopilot_node_healthy")`
      | eval series=cluster." / ".scrape_profile." / ".node_id
      | timechart span=15s max(value) BY series limit=0 useother=f
  - sourcePanel: lease-count
    description: Tracked lease inventory, including valid and expired entries awaiting cleanup. The warning threshold is not a service limit.
    search: |
      | `openbao_metric_samples("${p}_expire_num_leases")`
      | eval series=cluster." / ".scrape_profile." / ".instance
      | timechart span=15s max(value) BY series limit=0 useother=f
  - sourcePanel: goroutines
    description: Goroutine count by target.
    search: |
      | `openbao_metric_samples("${p}_runtime_num_goroutines")`
      | eval series=cluster." / ".scrape_profile." / ".instance
      | timechart span=15s max(value) BY series limit=0 useother=f
  - sourcePanel: barrier-get-latency
    description: Rolling five-minute mean barrier GET duration in milliseconds.
    search: |
      | `openbao_metric_samples("${p}_barrier_get*")`
      | where match(metric_name,"_(sum|count)$")
      | `openbao_metric_rate5m`
      | eval sum_rate=if(match(metric_name,"_sum$"),value,0), count_rate=if(match(metric_name,"_count$"),value,0)
      | stats sum(sum_rate) AS total sum(count_rate) AS events BY bucket_time cluster instance scrape_profile
      | where events>0
      | eval value=total/events
      | rename bucket_time AS _time
      | `openbao_metric_fresh`
      | stats latest(total) AS total latest(events) AS events BY cluster instance scrape_profile
      | stats sum(total) AS total sum(events) AS events BY cluster scrape_profile
      | where events>0
      | eval value=total/events
      | fields cluster scrape_profile value
  - sourcePanel: barrier-put-latency
    description: Rolling five-minute mean barrier PUT duration in milliseconds.
    search: |
      | `openbao_metric_samples("${p}_barrier_put*")`
      | where match(metric_name,"_(sum|count)$")
      | `openbao_metric_rate5m`
      | eval sum_rate=if(match(metric_name,"_sum$"),value,0), count_rate=if(match(metric_name,"_count$"),value,0)
      | stats sum(sum_rate) AS total sum(count_rate) AS events BY bucket_time cluster instance scrape_profile
      | where events>0
      | eval value=total/events
      | rename bucket_time AS _time
      | `openbao_metric_fresh`
      | stats latest(total) AS total latest(events) AS events BY cluster instance scrape_profile
      | stats sum(total) AS total sum(events) AS events BY cluster scrape_profile
      | where events>0
      | eval value=total/events
      | fields cluster scrape_profile value
  - sourcePanel: cache-hit-ratio
    description: Five-minute cache hit ratio from reset-corrected hit and miss counters. Both counters and at least one observation are required; idle or incomplete data remains absent. The OpenBao cache is distinct from Salt disk caching.
    search: |
      | `openbao_metric_samples("${p}_cache_*")`
      | where metric_name="${p}_cache_hit" OR metric_name="${p}_cache_miss"
      | `openbao_metric_rate5m`
      | stats sum(eval(if(match(metric_name,"_cache_hit$"),value,null()))) AS hits sum(eval(if(match(metric_name,"_cache_miss$"),value,null()))) AS misses count(eval(match(metric_name,"_cache_hit$"))) AS hit_series count(eval(match(metric_name,"_cache_miss$"))) AS miss_series BY bucket_time cluster scrape_profile
      | where hit_series>0 AND miss_series>0 AND hits+misses>0
      | eval value=hits/(hits+misses), series=cluster ." | ".scrape_profile
      | eval _time=bucket_time
      | `openbao_metric_fresh`
      | stats latest(value) AS value BY cluster scrape_profile series
      | stats max(value) AS value count AS contributing_series
      | where contributing_series>0
      | fields - contributing_series
  - sourcePanel: heap-objects
    description: Maximum current heap object count across targets.
    search: |
      | `openbao_metric_samples("${p}_runtime_heap_objects")`
      | `openbao_metric_fresh`
      | stats latest(value) AS value BY cluster instance scrape_profile
      | stats max(value) AS value BY cluster scrape_profile
  - sourcePanel: sys-bytes
    description: Maximum current runtime system allocation in bytes across targets.
    search: |
      | `openbao_metric_samples("${p}_runtime_sys_bytes")`
      | `openbao_metric_fresh`
      | stats latest(value) AS value BY cluster instance scrape_profile
      | stats max(value) AS value BY cluster scrape_profile
  - sourcePanel: mount-table-entries
    description: Mount inventory by bounded type and local labels. Deduplicates observations across nodes before summing categories; this does not expose mount paths.
    search: |
      | `openbao_metric_samples("${p}_core_mount_table_num_entries")`
      | where metric_name="${p}_core_mount_table_num_entries"
      | eval local=coalesce(local,"(missing)"), type=coalesce(type,"(missing)"), series=openbao_namespace ." | ".cluster ." | ".scrape_profile
      | stats max(value) AS value BY bucket_time cluster scrape_profile series type local
      | stats sum(value) AS value BY bucket_time cluster scrape_profile series
      | eval _time=bucket_time
      | `openbao_metric_fresh`
      | stats latest(value) AS value BY cluster scrape_profile series
      | stats sum(value) AS value count AS contributing_series
      | where contributing_series>0
      | fields - contributing_series
  - sourcePanel: audit-stream
    description: Allowlisted audit metadata. Counts include separate request and response entries unless the query selects a type. Counts use the selected range; charts use disjoint five-minute buckets. Missing caller names do not imply anonymous access.
    search: |
      `openbao_audit_events`
      | sort 100 - _time
      | table _time host audit_type request_id logical_namespace request_path operation caller client_ip audit_error
  - sourcePanel: operational-errors
    description: OpenBao JSON operational logs. Only timestamp, host, severity, module, and message are exposed. Error text can contain sensitive information. Charts use disjoint five-minute buckets; this is not a client-latency measurement.
    search: |
      `openbao_operational_events`
      | where match(severity,"^(warn|error)$")
      | sort 100 - _time
      | table _time host severity module message
- id: openbao_ha_raft
  source: contracts/dashboards/openbao-ha-raft.yaml
  description: OpenBao HA/Raft. Native SPL operator-question bindings. Read panel descriptions for windows, missing data, and required external sources. Native alert parity is not mapped. See the profile validation record for tested environments.
  panels:
  - sourcePanel: raft-peers
    description: Maximum current Raft peer count.
    search: |
      | `openbao_metric_samples("${p}_raft_peers")`
      | `openbao_metric_fresh`
      | stats latest(value) AS value BY cluster instance scrape_profile
      | stats max(value) AS value BY cluster scrape_profile
  - sourcePanel: autopilot-health
    description: Latest available Autopilot health state.
    search: |
      | `openbao_metric_samples("${p}_autopilot_healthy")`
      | `openbao_metric_fresh`
      | stats latest(value) AS value BY cluster instance scrape_profile
      | stats max(value) AS value BY cluster scrape_profile
  - sourcePanel: failure-tolerance
    description: Latest available Autopilot failure tolerance.
    search: |
      | `openbao_metric_samples("${p}_autopilot_failure_tolerance")`
      | `openbao_metric_fresh`
      | stats latest(value) AS value BY cluster instance scrape_profile
      | stats max(value) AS value BY cluster scrape_profile
  - sourcePanel: unhealthy-raft-nodes
    description: Autopilot node-health flags deduplicated by node_id using the minimum across reporters, then counted. This measures peer health, not voter count or quorum margin.
    search: |
      | `openbao_metric_samples("${p}_autopilot_node_healthy")`
      | where metric_name="${p}_autopilot_node_healthy"
      | eval node_id=coalesce(node_id,"(missing)"), series=cluster ." | ".scrape_profile
      | stats min(value) AS value BY bucket_time cluster scrape_profile series node_id
      | eval value=1-value
      | stats sum(value) AS value BY bucket_time cluster scrape_profile series
      | eval _time=bucket_time
      | `openbao_metric_fresh`
      | stats latest(value) AS value BY cluster scrape_profile series
      | stats sum(value) AS value count AS contributing_series
      | where contributing_series>0
      | fields - contributing_series
  - sourcePanel: active-nodes
    description: Sum of fresh active flags across targets.
    search: |
      | `openbao_metric_samples("${p}_core_active")`
      | `openbao_metric_fresh`
      | stats latest(value) AS value BY cluster instance scrape_profile
      | stats sum(value) AS value BY cluster scrape_profile
  - sourcePanel: unsealed-nodes
    description: Sum of fresh unsealed states, with duplicate-source preference and missing-state preservation.
    search: |
      | `openbao_metric_samples("${p}_core_unsealed")`
      | `openbao_metric_fresh`
      | stats latest(value) AS value BY cluster instance scrape_profile seal_state_source
      | eventstats max(eval(if(seal_state_source="cluster",1,0))) AS has_cluster BY cluster instance scrape_profile
      | where seal_state_source="cluster" OR has_cluster=0
      | stats max(value) AS value BY cluster instance scrape_profile
      | stats sum(value) AS value BY cluster scrape_profile
  - sourcePanel: leader-transitions
    description: Rolling 30m calculation from upstream counters; resets are corrected per complete source series before aggregation. Namespace and deployment identity are retained. Chart series are limited to 20; select one cluster and scrape profile for single-value panels.
    search: |
      | `openbao_metric_samples("${p}_raft_state_leader")`
      | where metric_name="${p}_raft_state_leader"
      | eval series=case(metric_name="${p}_raft_state_leader","raft_state_leader") ." | ".coalesce(openbao_namespace,"(missing)") ." | ".cluster ." | ".scrape_profile
      | `openbao_metric_rate30m`
      | eval value=value*1800
      | stats sum(value) AS value BY bucket_time cluster scrape_profile series
      | eval _time=bucket_time
      | `openbao_metric_fresh`
      | stats latest(value) AS value BY cluster scrape_profile series
      | stats sum(value) AS value count AS contributing_series
      | where contributing_series>0
      | fields - contributing_series
  - sourcePanel: candidate-transitions
    description: Rolling 30m calculation from upstream counters; resets are corrected per complete source series before aggregation. Namespace and deployment identity are retained. Chart series are limited to 20; select one cluster and scrape profile for single-value panels.
    search: |
      | `openbao_metric_samples("${p}_raft_state_candidate")`
      | where metric_name="${p}_raft_state_candidate"
      | eval series=case(metric_name="${p}_raft_state_candidate","raft_state_candidate") ." | ".coalesce(openbao_namespace,"(missing)") ." | ".cluster ." | ".scrape_profile
      | `openbao_metric_rate30m`
      | eval value=value*1800
      | stats sum(value) AS value BY bucket_time cluster scrape_profile series
      | eval _time=bucket_time
      | `openbao_metric_fresh`
      | stats latest(value) AS value BY cluster scrape_profile series
      | stats sum(value) AS value count AS contributing_series
      | where contributing_series>0
      | fields - contributing_series
  - sourcePanel: autopilot-node-health
    description: Raft node health by node_id.
    search: |
      | `openbao_metric_samples("${p}_autopilot_node_healthy")`
      | eval series=cluster." / ".scrape_profile." / ".node_id
      | timechart span=15s max(value) BY series limit=0 useother=f
  - sourcePanel: raft-commit-index
    description: Raft commit index by target.
    search: |
      | `openbao_metric_samples("${p}_raft_storage_stats_commit_index")`
      | eval series=cluster." / ".scrape_profile." / ".instance
      | timechart span=15s max(value) BY series limit=0 useother=f
  - sourcePanel: raft-applied-index
    description: Raft applied index by target.
    search: |
      | `openbao_metric_samples("${p}_raft_storage_stats_applied_index")`
      | eval series=cluster." / ".scrape_profile." / ".instance
      | timechart span=15s max(value) BY series limit=0 useother=f
  - sourcePanel: raft-fsm-pending
    description: Raft FSM pending operations by target.
    search: |
      | `openbao_metric_samples("${p}_raft_storage_stats_fsm_pending")`
      | eval series=cluster." / ".scrape_profile." / ".instance
      | timechart span=15s max(value) BY series limit=0 useother=f
  - sourcePanel: raft-term
    description: Current Raft term by target.
    search: |
      | `openbao_metric_samples("${p}_raft_storage_stats_term")`
      | eval series=cluster." / ".scrape_profile." / ".instance
      | timechart span=15s max(value) BY series limit=0 useother=f
  - sourcePanel: leader-last-contact
    description: Per-target source p99 last-contact duration in milliseconds. Quantiles are not averaged across targets.
    search: |
      | `openbao_metric_samples("${p}_raft_leader_lastContact_0.99")`
      | eval series=cluster." / ".scrape_profile." / ".instance
      | timechart span=15s max(value) BY series limit=0 useother=f
  - sourcePanel: replication-heartbeat
    description: Source p99 replication heartbeat duration by peer_id, in milliseconds.
    search: |
      | `openbao_metric_samples("${p}_raft_replication_heartbeat_0.99")`
      | eval series=cluster." / ".scrape_profile." / ".peer_id
      | timechart span=15s max(value) BY series limit=0 useother=f
  - sourcePanel: append-entries-logs
    description: Fresh source gauge; duplicate node observations are combined before totals. Namespace and deployment identity are retained. Chart series are limited to 20; select one cluster and scrape profile for single-value panels.
    search: |
      | `openbao_metric_samples("${p}_raft_replication_appendEntries_logs")`
      | where metric_name="${p}_raft_replication_appendEntries_logs"
      | eval series=case(metric_name="${p}_raft_replication_appendEntries_logs","raft_replication_appendEntries_logs") ." | ".coalesce(peer_id,"(missing)") ." | ".instance ." | ".cluster ." | ".scrape_profile
      | stats max(value) AS value BY bucket_time cluster scrape_profile series
      | eval _time=bucket_time
      | timechart span=15s max(value) BY series limit=20 useother=f cont=f
  - sourcePanel: raft-storage-logs
    description: OpenBao JSON operational logs. Only timestamp, host, severity, module, and message are exposed. Error text can contain sensitive information. Charts use disjoint five-minute buckets; this is not a client-latency measurement.
    search: |
      `openbao_operational_events`
      | where match(module." ".message,"(?i)(raft|storage|autopilot)")
      | sort 100 - _time
      | table _time host severity module message
- id: openbao_expiration_backlog
  source: contracts/dashboards/openbao-token-lease-lifecycle.yaml
  description: OpenBao token and lease lifecycle. Native SPL operator-question bindings. Read panel descriptions for windows, missing data, and required external sources. Native alert parity is not mapped. See the profile validation record for tested environments.
  panels:
  - sourcePanel: token-count
    description: Rolling 30-minute maximum inventory. KV totals deduplicate each mount before summing; token inventory uses the source maximum. Missing series remain absent. Fixed-window stats use the trailing 30 minutes to now. Charts need 30 minutes of selected history; the freshness guard still applies.
    search: |
      | `openbao_metric_samples("${p}_token_count")`
      | where metric_name="${p}_token_count"
      | sort 0 _time
      | streamstats time_window=30m max(value) AS value BY _timeseries
      | eval series=openbao_namespace ." | ".cluster ." | ".scrape_profile
      | stats max(value) AS value BY bucket_time cluster scrape_profile series
      | eval _time=bucket_time
      | `openbao_metric_fresh`
      | stats latest(value) AS value BY cluster scrape_profile series
      | stats sum(value) AS value count AS contributing_series
      | where contributing_series>0
      | fields - contributing_series
    earliest: "-30m"
  - sourcePanel: lease-count
    description: Latest tracked lease inventory; this is not a count of expired leases alone.
    search: |
      | `openbao_metric_samples("${p}_expire_num_leases")`
      | `openbao_metric_fresh`
      | stats latest(value) AS value BY cluster instance scrape_profile
      | stats max(value) AS value BY cluster scrape_profile
  - sourcePanel: irrevocable-leases
    description: Latest irrevocable lease count. Missing data is not zero.
    search: |
      | `openbao_metric_samples("${p}_expire_num_irrevocable_leases")`
      | `openbao_metric_fresh`
      | stats latest(value) AS value BY cluster instance scrape_profile
      | stats max(value) AS value BY cluster scrape_profile
  - sourcePanel: token-creations
    description: Rolling 15m calculation from upstream counters; resets are corrected per complete source series before aggregation. Namespace and deployment identity are retained. Chart series are limited to 20; select one cluster and scrape profile for single-value panels.
    search: |
      | `openbao_metric_samples("${p}_token_creation")`
      | where metric_name="${p}_token_creation"
      | eval series=case(metric_name="${p}_token_creation","token_creation") ." | ".coalesce(openbao_namespace,"(missing)") ." | ".cluster ." | ".scrape_profile
      | `openbao_metric_rate15m`
      | eval value=value*900
      | stats sum(value) AS value BY bucket_time cluster scrape_profile series
      | eval _time=bucket_time
      | `openbao_metric_fresh`
      | stats latest(value) AS value BY cluster scrape_profile series
      | stats sum(value) AS value count AS contributing_series
      | where contributing_series>0
      | fields - contributing_series
  - sourcePanel: token-create-rate
    description: Rolling 5m calculation from upstream counters; resets are corrected per complete source series before aggregation. Namespace and deployment identity are retained. Chart series are limited to 20; select one cluster and scrape profile for single-value panels.
    search: |
      | `openbao_metric_samples("${p}_token_create_count")`
      | where metric_name="${p}_token_create_count"
      | eval series=case(metric_name="${p}_token_create_count","token_create") ." | ".coalesce(openbao_namespace,"(missing)") ." | ".cluster ." | ".scrape_profile
      | `openbao_metric_rate5m`
      | stats sum(value) AS value BY bucket_time cluster scrape_profile series
      | eval _time=bucket_time
      | `openbao_metric_fresh`
      | stats latest(value) AS value BY cluster scrape_profile series
      | stats sum(value) AS value count AS contributing_series
      | where contributing_series>0
      | fields - contributing_series
  - sourcePanel: token-lookup-rate
    description: Rolling 5m calculation from upstream counters; resets are corrected per complete source series before aggregation. Namespace and deployment identity are retained. Chart series are limited to 20; select one cluster and scrape profile for single-value panels.
    search: |
      | `openbao_metric_samples("${p}_token_lookup_count")`
      | where metric_name="${p}_token_lookup_count"
      | eval series=case(metric_name="${p}_token_lookup_count","token_lookup") ." | ".coalesce(openbao_namespace,"(missing)") ." | ".cluster ." | ".scrape_profile
      | `openbao_metric_rate5m`
      | stats sum(value) AS value BY bucket_time cluster scrape_profile series
      | eval _time=bucket_time
      | `openbao_metric_fresh`
      | stats latest(value) AS value BY cluster scrape_profile series
      | stats sum(value) AS value count AS contributing_series
      | where contributing_series>0
      | fields - contributing_series
  - sourcePanel: token-store-rate
    description: Rolling 5m calculation from upstream counters; resets are corrected per complete source series before aggregation. Namespace and deployment identity are retained. Chart series are limited to 20; select one cluster and scrape profile for single-value panels.
    search: |
      | `openbao_metric_samples("${p}_token_store_count")`
      | where metric_name="${p}_token_store_count"
      | eval series=case(metric_name="${p}_token_store_count","token_store") ." | ".coalesce(openbao_namespace,"(missing)") ." | ".cluster ." | ".scrape_profile
      | `openbao_metric_rate5m`
      | stats sum(value) AS value BY bucket_time cluster scrape_profile series
      | eval _time=bucket_time
      | `openbao_metric_fresh`
      | stats latest(value) AS value BY cluster scrape_profile series
      | stats sum(value) AS value count AS contributing_series
      | where contributing_series>0
      | fields - contributing_series
  - sourcePanel: token-revoke-tree-rate
    description: Rolling 5m calculation from upstream counters; resets are corrected per complete source series before aggregation. Namespace and deployment identity are retained. Chart series are limited to 20; select one cluster and scrape profile for single-value panels.
    search: |
      | `openbao_metric_samples("${p}_token_revoke_tree_count")`
      | where metric_name="${p}_token_revoke_tree_count"
      | eval series=case(metric_name="${p}_token_revoke_tree_count","token_revoke_tree") ." | ".coalesce(openbao_namespace,"(missing)") ." | ".cluster ." | ".scrape_profile
      | `openbao_metric_rate5m`
      | stats sum(value) AS value BY bucket_time cluster scrape_profile series
      | eval _time=bucket_time
      | `openbao_metric_fresh`
      | stats latest(value) AS value BY cluster scrape_profile series
      | stats sum(value) AS value count AS contributing_series
      | where contributing_series>0
      | fields - contributing_series
  - sourcePanel: token-lease-inventory
    description: Token inventory uses a 30-minute maximum; lease and irrevocable inventory use fresh gauges. Series remain separate. Use the dedicated active-node expiration queue panels for backlog diagnosis.
    search: |
      | `openbao_metric_samples("${p}_*")`
      | where metric_name="${p}_token_count" OR metric_name="${p}_expire_num_leases" OR metric_name="${p}_expire_num_irrevocable_leases"
      | sort 0 _time
      | streamstats time_window=30m max(value) AS historical BY _timeseries
      | eval value=if(match(metric_name,"_token_count$"),historical,value), series=metric_name ." | ".openbao_namespace ." | ".cluster ." | ".scrape_profile
      | stats max(value) AS value BY bucket_time cluster scrape_profile series
      | eval _time=bucket_time
      | timechart span=15s max(value) BY series limit=20 useother=f cont=f
  - sourcePanel: token-operation-rates
    description: Rolling 5m calculation from upstream counters; resets are corrected per complete source series before aggregation. Namespace and deployment identity are retained. Chart series are limited to 20; select one cluster and scrape profile for single-value panels.
    search: |
      | `openbao_metric_samples("${p}_token_*")`
      | where metric_name="${p}_token_create_count" OR metric_name="${p}_token_lookup_count" OR metric_name="${p}_token_store_count" OR metric_name="${p}_token_revoke_tree_count"
      | eval series=case(metric_name="${p}_token_create_count","create",metric_name="${p}_token_lookup_count","lookup",metric_name="${p}_token_store_count","store",metric_name="${p}_token_revoke_tree_count","revoke tree") ." | ".coalesce(openbao_namespace,"(missing)") ." | ".cluster ." | ".scrape_profile
      | `openbao_metric_rate5m`
      | stats sum(value) AS value BY bucket_time cluster scrape_profile series
      | eval _time=bucket_time
      | timechart span=15s max(value) BY series limit=20 useother=f cont=f
  - sourcePanel: token-operation-latency
    description: Rolling 5m calculation from upstream counters; resets are corrected per complete source series before aggregation. Means are weighted by observations; idle windows remain absent. Namespace and deployment identity are retained. Chart series are limited to 20; select one cluster and scrape profile for single-value panels.
    search: |
      | `openbao_metric_samples("${p}_token_*")`
      | where metric_name="${p}_token_create_sum" OR metric_name="${p}_token_create_count" OR metric_name="${p}_token_lookup_sum" OR metric_name="${p}_token_lookup_count" OR metric_name="${p}_token_store_sum" OR metric_name="${p}_token_store_count" OR metric_name="${p}_token_revoke_tree_sum" OR metric_name="${p}_token_revoke_tree_count"
      | eval series=case(metric_name="${p}_token_create_sum","create",metric_name="${p}_token_create_count","create",metric_name="${p}_token_lookup_sum","lookup",metric_name="${p}_token_lookup_count","lookup",metric_name="${p}_token_store_sum","store",metric_name="${p}_token_store_count","store",metric_name="${p}_token_revoke_tree_sum","revoke tree",metric_name="${p}_token_revoke_tree_count","revoke tree") ." | ".coalesce(openbao_namespace,"(missing)") ." | ".cluster ." | ".scrape_profile
      | `openbao_metric_rate5m`
      | stats sum(eval(if(match(metric_name,"_sum$"),value,null()))) AS total sum(eval(if(match(metric_name,"_count$"),value,null()))) AS observations BY bucket_time cluster scrape_profile series
      | where observations>0
      | eval value=total/observations
      | eval _time=bucket_time
      | timechart span=15s max(value) BY series limit=20 useother=f cont=f
  - sourcePanel: lease-operation-latency
    description: Rolling 5m calculation from upstream counters; resets are corrected per complete source series before aggregation. Means are weighted by observations; idle windows remain absent. Namespace and deployment identity are retained. Chart series are limited to 20; select one cluster and scrape profile for single-value panels.
    search: |
      | `openbao_metric_samples("${p}_expire_re*")`
      | where metric_name="${p}_expire_revoke_sum" OR metric_name="${p}_expire_revoke_count" OR metric_name="${p}_expire_register_auth_sum" OR metric_name="${p}_expire_register_auth_count"
      | eval series=case(metric_name="${p}_expire_revoke_sum","revoke",metric_name="${p}_expire_revoke_count","revoke",metric_name="${p}_expire_register_auth_sum","register auth",metric_name="${p}_expire_register_auth_count","register auth") ." | ".coalesce(openbao_namespace,"(missing)") ." | ".cluster ." | ".scrape_profile
      | `openbao_metric_rate5m`
      | stats sum(eval(if(match(metric_name,"_sum$"),value,null()))) AS total sum(eval(if(match(metric_name,"_count$"),value,null()))) AS observations BY bucket_time cluster scrape_profile series
      | where observations>0
      | eval value=total/observations
      | eval _time=bucket_time
      | timechart span=15s max(value) BY series limit=20 useother=f cont=f
  - sourcePanel: token-creation-by-auth-method
    description: Rolling 15m calculation from upstream counters; resets are corrected per complete source series before aggregation. Namespace and deployment identity are retained. Chart series are limited to 20; select one cluster and scrape profile for single-value panels.
    search: |
      | `openbao_metric_samples("${p}_token_creation")`
      | where metric_name="${p}_token_creation"
      | eval series=case(metric_name="${p}_token_creation","token_creation") ." | ".coalesce(auth_method,"(missing)") ." | ".coalesce(openbao_namespace,"(missing)") ." | ".cluster ." | ".scrape_profile
      | `openbao_metric_rate15m`
      | eval value=value*900
      | stats sum(value) AS value BY bucket_time cluster scrape_profile series
      | eval _time=bucket_time
      | timechart span=15s max(value) BY series limit=20 useother=f cont=f
  - sourcePanel: lease-revoke-rate
    description: Rolling five-minute revocation observations per second. Backlog slope also includes new arrivals and is a different measure.
    search: |
      | `openbao_metric_samples("${p}_expire_revoke_count")`
      | `openbao_metric_rate5m`
      | `openbao_metric_fresh`
      | stats sum(value) AS value BY bucket_time cluster scrape_profile
      | rename bucket_time AS _time
      | timechart span=15s latest(value) AS value
  - sourcePanel: expiration-pending-jobs
    description: Waiting expiration jobs on the active target only. Missing queue metrics remain absent.
    search: |
      | `openbao_metric_samples("${p}_*")`
      | where metric_name="${p}_core_active" OR metric_name="${p}_expire_job_manager_total_jobs"
      | `openbao_metric_active_expiration`
      | eval series=cluster." / ".scrape_profile." / ".instance
      | timechart span=15s latest(value) BY series limit=0 useother=f
  - sourcePanel: expiration-backlog-change
    description: Rolling five-minute least-squares backlog slope in jobs per second per active target. Negative values indicate net drain; leader histories remain separate.
    search: |
      | `openbao_metric_samples("${p}_*")`
      | where metric_name="${p}_core_active" OR metric_name="${p}_expire_job_manager_total_jobs"
      | `openbao_metric_active_expiration`
      | `openbao_metric_slope5m`
      | eval series=cluster." / ".scrape_profile." / ".instance
      | timechart span=15s latest(value) BY series limit=0 useother=f
  - sourcePanel: expiration-queue-length
    description: Waiting jobs by mount queue on the active target. A queue ID identifies a mount, not a consumer.
    search: |
      | `openbao_metric_samples("${p}_*")`
      | where metric_name="${p}_core_active" OR metric_name="${p}_expire_job_manager_queue_length"
      | `openbao_metric_active_expiration`
      | eval series=cluster." / ".scrape_profile." / ".instance." / ".queue_id
      | timechart span=15s latest(value) BY series limit=0 useother=f
  - sourcePanel: expiration-dispatch-wait
    description: Rolling five-minute mean wait for dispatched jobs, in milliseconds. This excludes jobs still waiting.
    search: |
      | `openbao_metric_samples("${p}_expire_lease_expiration_time_in_queue*")`
      | where match(metric_name,"_(sum|count)$")
      | `openbao_metric_rate5m`
      | eval sum_rate=if(match(metric_name,"_sum$"),value,0), count_rate=if(match(metric_name,"_count$"),value,0)
      | stats sum(sum_rate) AS total sum(count_rate) AS events BY bucket_time cluster instance scrape_profile
      | where events>0
      | eval value=total/events
      | rename bucket_time AS _time
      | eval series=cluster." / ".scrape_profile." / ".instance
      | timechart span=15s latest(value) BY series limit=0 useother=f
  - sourcePanel: token-lifecycle-audit-events
    description: Allowlisted audit metadata. Counts include separate request and response entries unless the query selects a type. Counts use the selected range; charts use disjoint five-minute buckets. Missing caller names do not imply anonymous access.
    search: |
      `openbao_audit_events`
      | where match(request_path,"^auth/token/")
      | sort 100 - _time
      | table _time host audit_type request_id logical_namespace request_path operation caller client_ip audit_error
  - sourcePanel: lease-management-audit-events
    description: Allowlisted audit metadata. Counts include separate request and response entries unless the query selects a type. Counts use the selected range; charts use disjoint five-minute buckets. Missing caller names do not imply anonymous access.
    search: |
      `openbao_audit_events`
      | where match(request_path,"^sys/leases/")
      | sort 100 - _time
      | table _time host audit_type request_id logical_namespace request_path operation caller client_ip audit_error
  - sourcePanel: filtered-token-lease-stream
    description: Allowlisted audit metadata. Counts include separate request and response entries unless the query selects a type. Counts use the selected range; charts use disjoint five-minute buckets. Missing caller names do not imply anonymous access.
    search: |
      `openbao_audit_events`
      | where match(request_path,"^(auth/token/|sys/leases/)")
      | sort 100 - _time
      | table _time host audit_type request_id logical_namespace request_path operation caller client_ip audit_error

- id: openbao_slo_availability
  source: contracts/dashboards/openbao-slo-availability.yaml
  description: OpenBao SLO and availability. Native SPL operator-question bindings. Read panel descriptions for windows, missing data, and required external sources. Native alert parity is not mapped. See the profile validation record for tested environments.
  panels:
  - sourcePanel: probe-success
    description: Requires externally collected probe_success and probe_duration_seconds with bounded job, instance, and cluster labels. Availability averages observed samples per target, then targets; absent probes are not successes. A 30-day result requires 30 days of source retention and collection. Fixed-window stats always use the trailing window to now, independent of the picker. Error budgets use a validated objective between zero and one.
    search: |
      | `openbao_metric_samples("probe_success")`
      | where metric_name="probe_success"
      | search job=$probe_job|s$
      | `openbao_metric_fresh`
      | stats latest(value) AS value BY _timeseries cluster
      | stats min(value) AS value BY cluster
      | fields value
    scope: probe
  - sourcePanel: availability-30d
    description: Requires stable probe targets with 30 days of history, at least 99% of expected 15-second samples per target, a first sample within 30 seconds of the window boundary, and a last sample within 45 seconds. Incomplete or stale history returns no value. Targets are weighted equally after averaging their observed samples. Fixed window to now, independent of the picker.
    search: |
      | `openbao_metric_samples("probe_success")`
      | where metric_name="probe_success"
      | search job=$probe_job|s$
      | stats avg(value) AS value min(_time) AS oldest max(_time) AS newest count AS observations BY _timeseries cluster
      | addinfo
      | eval complete=if(observations>=171072 AND oldest<=info_max_time-2591970 AND newest>=info_max_time-45,1,0)
      | eventstats min(complete) AS complete_cluster BY cluster
      | where complete_cluster=1
      | stats avg(value) AS value BY cluster
      | fields value
    scope: probe
    earliest: "-30d"
  - sourcePanel: error-budget-remaining
    description: Requires stable probe targets with 30 days of history, at least 99% of expected 15-second samples per target, a first sample within 30 seconds of the window boundary, and a last sample within 45 seconds. Incomplete or stale history returns no value. Targets are weighted equally after averaging their observed samples. Fixed window to now, independent of the picker.
    search: |
      | `openbao_metric_samples("probe_success")`
      | where metric_name="probe_success"
      | search job=$probe_job|s$
      | stats avg(value) AS value min(_time) AS oldest max(_time) AS newest count AS observations BY _timeseries cluster
      | addinfo
      | eval complete=if(observations>=171072 AND oldest<=info_max_time-2591970 AND newest>=info_max_time-45,1,0)
      | eventstats min(complete) AS complete_cluster BY cluster
      | where complete_cluster=1
      | stats avg(value) AS value BY cluster
      | eval objective=tonumber($slo_target|s$)
      | where objective>0 AND objective<1
      | eval value=1-((1-value)/(1-objective))
      | fields value
    scope: probe
    earliest: "-30d"
  - sourcePanel: burn-rate-5m
    description: Requires externally collected probe_success and probe_duration_seconds with bounded job, instance, and cluster labels. Availability averages observed samples per target, then targets; absent probes are not successes. A 30-day result requires 30 days of source retention and collection. Fixed-window stats always use the trailing window to now, independent of the picker. Error budgets use a validated objective between zero and one.
    search: |
      | `openbao_metric_samples("probe_success")`
      | where metric_name="probe_success"
      | search job=$probe_job|s$
      | stats avg(value) AS value BY _timeseries cluster
      | stats avg(value) AS value BY cluster
      | eval objective=tonumber($slo_target|s$)
      | where objective>0 AND objective<1
      | eval value=((1-value)/(1-objective))
      | fields value
    scope: probe
    earliest: "-5m"
  - sourcePanel: burn-rate-1h
    description: Requires externally collected probe_success and probe_duration_seconds with bounded job, instance, and cluster labels. Availability averages observed samples per target, then targets; absent probes are not successes. A 30-day result requires 30 days of source retention and collection. Fixed-window stats always use the trailing window to now, independent of the picker. Error budgets use a validated objective between zero and one.
    search: |
      | `openbao_metric_samples("probe_success")`
      | where metric_name="probe_success"
      | search job=$probe_job|s$
      | stats avg(value) AS value BY _timeseries cluster
      | stats avg(value) AS value BY cluster
      | eval objective=tonumber($slo_target|s$)
      | where objective>0 AND objective<1
      | eval value=((1-value)/(1-objective))
      | fields value
    scope: probe
    earliest: "-1h"
  - sourcePanel: probe-duration
    description: Requires externally collected probe_success and probe_duration_seconds with bounded job, instance, and cluster labels. Availability averages observed samples per target, then targets; absent probes are not successes. A 30-day result requires 30 days of source retention and collection. Fixed-window stats always use the trailing window to now, independent of the picker. Error budgets use a validated objective between zero and one.
    search: |
      | `openbao_metric_samples("probe_duration_seconds")`
      | where metric_name="probe_duration_seconds"
      | search job=$probe_job|s$
      | `openbao_metric_fresh`
      | stats latest(value) AS value BY _timeseries cluster
      | stats avg(value) AS value BY cluster
      | fields value
    scope: probe
  - sourcePanel: availability-by-target
    description: Requires externally collected probe_success and probe_duration_seconds with bounded job, instance, and cluster labels. Availability averages observed samples per target, then targets; absent probes are not successes. A 30-day result requires 30 days of source retention and collection. Fixed-window stats always use the trailing window to now, independent of the picker. Error budgets use a validated objective between zero and one.
    search: |
      | `openbao_metric_samples("probe_success")`
      | where metric_name="probe_success"
      | search job=$probe_job|s$
      | sort 0 _time
      | streamstats time_window=1h avg(value) AS value BY _timeseries
      | eval _time=bucket_time, series=instance ." | ".job ." | ".cluster
      | timechart span=15s avg(value) BY series limit=20 useother=f cont=f
    scope: probe
  - sourcePanel: burn-rate-by-target
    description: Requires externally collected probe_success and probe_duration_seconds with bounded job, instance, and cluster labels. Availability averages observed samples per target, then targets; absent probes are not successes. A 30-day result requires 30 days of source retention and collection. Fixed-window stats always use the trailing window to now, independent of the picker. Error budgets use a validated objective between zero and one.
    search: |
      | `openbao_metric_samples("probe_success")`
      | where metric_name="probe_success"
      | search job=$probe_job|s$
      | sort 0 _time
      | streamstats time_window=5m avg(value) AS value BY _timeseries
      | eval objective=tonumber($slo_target|s$)
      | where objective>0 AND objective<1
      | eval value=((1-value)/(1-objective))
      | eval _time=bucket_time, series=instance ." | ".job ." | ".cluster
      | timechart span=15s avg(value) BY series limit=20 useother=f cont=f
    scope: probe
  - sourcePanel: probe-duration-by-target
    description: Requires externally collected probe_success and probe_duration_seconds with bounded job, instance, and cluster labels. Availability averages observed samples per target, then targets; absent probes are not successes. A 30-day result requires 30 days of source retention and collection. Fixed-window stats always use the trailing window to now, independent of the picker. Error budgets use a validated objective between zero and one.
    search: |
      | `openbao_metric_samples("probe_duration_seconds")`
      | where metric_name="probe_duration_seconds"
      | search job=$probe_job|s$
      | eval _time=bucket_time, series=instance ." | ".job ." | ".cluster
      | timechart span=15s avg(value) BY series limit=20 useother=f cont=f
    scope: probe
  - sourcePanel: request-latency
    description: Rolling 5m calculation from upstream counters; resets are corrected per complete source series before aggregation. Means are weighted by observations; idle windows remain absent. Namespace and deployment identity are retained. Chart series are limited to 20; select one cluster and scrape profile for single-value panels.
    search: |
      | `openbao_metric_samples("${p}_core_handle_request_*")`
      | where metric_name="${p}_core_handle_request_sum" OR metric_name="${p}_core_handle_request_count"
      | eval series=case(metric_name="${p}_core_handle_request_sum","core_handle_request",metric_name="${p}_core_handle_request_count","core_handle_request") ." | ".coalesce(openbao_namespace,"(missing)") ." | ".cluster ." | ".scrape_profile
      | `openbao_metric_rate5m`
      | stats sum(eval(if(match(metric_name,"_sum$"),value,null()))) AS total sum(eval(if(match(metric_name,"_count$"),value,null()))) AS observations BY bucket_time cluster scrape_profile series
      | where observations>0
      | eval value=total/observations
      | eval _time=bucket_time
      | timechart span=15s max(value) BY series limit=20 useother=f cont=f
  - sourcePanel: login-latency
    description: Rolling 5m calculation from upstream counters; resets are corrected per complete source series before aggregation. Means are weighted by observations; idle windows remain absent. Namespace and deployment identity are retained. Chart series are limited to 20; select one cluster and scrape profile for single-value panels.
    search: |
      | `openbao_metric_samples("${p}_core_handle_login_request_*")`
      | where metric_name="${p}_core_handle_login_request_sum" OR metric_name="${p}_core_handle_login_request_count"
      | eval series=case(metric_name="${p}_core_handle_login_request_sum","core_handle_login_request",metric_name="${p}_core_handle_login_request_count","core_handle_login_request") ." | ".coalesce(openbao_namespace,"(missing)") ." | ".cluster ." | ".scrape_profile
      | `openbao_metric_rate5m`
      | stats sum(eval(if(match(metric_name,"_sum$"),value,null()))) AS total sum(eval(if(match(metric_name,"_count$"),value,null()))) AS observations BY bucket_time cluster scrape_profile series
      | where observations>0
      | eval value=total/observations
      | eval _time=bucket_time
      | timechart span=15s max(value) BY series limit=20 useother=f cont=f
  - sourcePanel: token-check-latency
    description: Rolling 5m calculation from upstream counters; resets are corrected per complete source series before aggregation. Means are weighted by observations; idle windows remain absent. Namespace and deployment identity are retained. Chart series are limited to 20; select one cluster and scrape profile for single-value panels.
    search: |
      | `openbao_metric_samples("${p}_core_check_token_*")`
      | where metric_name="${p}_core_check_token_sum" OR metric_name="${p}_core_check_token_count"
      | eval series=case(metric_name="${p}_core_check_token_sum","core_check_token",metric_name="${p}_core_check_token_count","core_check_token") ." | ".coalesce(openbao_namespace,"(missing)") ." | ".cluster ." | ".scrape_profile
      | `openbao_metric_rate5m`
      | stats sum(eval(if(match(metric_name,"_sum$"),value,null()))) AS total sum(eval(if(match(metric_name,"_count$"),value,null()))) AS observations BY bucket_time cluster scrape_profile series
      | where observations>0
      | eval value=total/observations
      | eval _time=bucket_time
      | timechart span=15s max(value) BY series limit=20 useother=f cont=f
  - sourcePanel: scrape-availability
    description: One-hour mean of observed scrape-success samples per source target. Missing samples are not counted as success or failure. A successful scrape is not proof that authentication or secret writes work.
    search: |
      | `openbao_metric_samples("up")`
      | where metric_name="up"
      | sort 0 _time
      | streamstats time_window=1h avg(value) AS value BY _timeseries
      | eval series=instance ." | ".job ." | ".cluster ." | ".scrape_profile
      | eval _time=bucket_time
      | timechart span=15s max(value) BY series limit=20 useother=f cont=f
  - sourcePanel: active-node-context
    description: Sum of observed active flags across source targets per bucket. Missing targets are unknown; an observed zero remains zero.
    search: |
      | `openbao_metric_samples("${p}_core_active")`
      | where metric_name="${p}_core_active"
      | eval series=cluster ." | ".scrape_profile
      | stats sum(value) AS value BY bucket_time cluster scrape_profile series
      | eval _time=bucket_time
      | timechart span=15s max(value) BY series limit=20 useother=f cont=f
  - sourcePanel: operational-availability-context
    description: OpenBao JSON operational logs. Only timestamp, host, severity, module, and message are exposed. Error text can contain sensitive information. Charts use disjoint five-minute buckets; this is not a client-latency measurement.
    search: |
      `openbao_operational_events`
      | where match(message,"(?i)(timeout|unavailable|latency|slow|error|failed|connection refused)")
      | sort 100 - _time
      | table _time host severity module message
  inputs:
  - name: probe_job
    default: "*openbao*"
  - name: slo_target
    default: '0.999'
- id: openbao_transit
  source: contracts/dashboards/openbao-transit.yaml

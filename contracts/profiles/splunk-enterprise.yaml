  - sourcePanel: completed-request-logging
    description: Completed-request log entries in the trailing 15 minutes to now, independent of the picker. Source logging is optional and disabled by default. A strict event-kind filter excludes ordinary operational logs. The macro exposes only timestamp, host, and event kind.

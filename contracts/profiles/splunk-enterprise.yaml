- id: openbao_secret_engines_mounts
  source: contracts/dashboards/openbao-secret-engines-mounts.yaml
  description: OpenBao secret engines and mounts. Native SPL operator-question bindings. Read panel descriptions for windows, missing data, and required external sources. Native alert parity is not mapped. See the profile validation record for tested environments.
  panels:
  - sourcePanel: secret-engine-events
    description: Audit metadata for the reference secret, kv-v1, database, transit, and pki mounts. Customize the source binding for other mount names. Counts use the selected range and include separate audit entries unless a type is selected.
    search: |
      `openbao_audit_events`
      | where match(request_path,"^(secret|kv-v1|database|transit|pki)(/|$)")
      | stats count AS value
  - sourcePanel: mount-lifecycle-events
    description: Audit metadata for the reference secret, kv-v1, database, transit, and pki mounts. Customize the source binding for other mount names. Counts use the selected range and include separate audit entries unless a type is selected.
    search: |
      `openbao_audit_events`
      | where match(request_path,"^sys/mounts(/|$)")
      | stats count AS value
  - sourcePanel: kv-events
    description: Audit metadata for the reference secret, kv-v1, database, transit, and pki mounts. Customize the source binding for other mount names. Counts use the selected range and include separate audit entries unless a type is selected.
    search: |
      `openbao_audit_events`
      | where match(request_path,"^(secret/(data|metadata)/|kv-v1/)")

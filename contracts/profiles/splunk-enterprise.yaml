    scope: archive
  - sourcePanel: audit-archive-delivery-failures
    description: Requires the separate audit-archive health exporter. These are exporter reports, not proof that an object-store copy is complete or immutable. Failure counters use 15-minute reset-corrected increases; missing telemetry is unknown. Last-success age is in seconds.

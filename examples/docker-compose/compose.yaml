name: openbao-observability

services:
  openbao-seal-init:
    image: ${OPENBAO_IMAGE:-quay.io/openbao/openbao:2.5.4}
    user: "0"
    command:
      - sh
      - -ec
      - |
        if [ ! -s /openbao/seal/static-unseal.key ]; then
          head -c 32 /dev/urandom > /openbao/seal/static-unseal.key
        fi
        chown -R 100:1000 \
          /openbao/seal \
          /openbao/node0/audit /openbao/node0/data /openbao/node0/logs \
          /openbao/node1/audit /openbao/node1/data /openbao/node1/logs \
          /openbao/node2/audit /openbao/node2/data /openbao/node2/logs
        chmod 0600 /openbao/seal/static-unseal.key
    volumes:
      - openbao-seal:/openbao/seal
      - openbao-node0-audit:/openbao/node0/audit
      - openbao-node0-data:/openbao/node0/data
      - openbao-node0-logs:/openbao/node0/logs
      - openbao-node1-audit:/openbao/node1/audit
      - openbao-node1-data:/openbao/node1/data
      - openbao-node1-logs:/openbao/node1/logs
      - openbao-node2-audit:/openbao/node2/audit
      - openbao-node2-data:/openbao/node2/data
      - openbao-node2-logs:/openbao/node2/logs
    restart: "no"

  openbao-node0:
    image: ${OPENBAO_IMAGE:-quay.io/openbao/openbao:2.5.4}
    user: "0"
    depends_on:
      openbao-seal-init:
        condition: service_completed_successfully
    command:
      - server
      - -config=/openbao/node0.hcl
    ports:
      - 127.0.0.1:${OPENBAO_NODE0_PORT:-18200}:8200
    volumes:
      - ./openbao/node0.hcl:/openbao/node0.hcl:ro
      - openbao-seal:/openbao/seal:ro
      - openbao-node0-audit:/openbao/audit
      - openbao-node0-data:/openbao/data
      - openbao-node0-logs:/openbao/logs
    healthcheck:
      test: ["CMD-SHELL", "BAO_ADDR=http://127.0.0.1:8200 bao status >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 24

  openbao-node1:
    image: ${OPENBAO_IMAGE:-quay.io/openbao/openbao:2.5.4}
    user: "0"
    depends_on:
      openbao-node0:
        condition: service_healthy
    command:
      - server
      - -config=/openbao/node1.hcl
    ports:
      - 127.0.0.1:${OPENBAO_NODE1_PORT:-18201}:8200
    volumes:
      - ./openbao/node1.hcl:/openbao/node1.hcl:ro
      - openbao-seal:/openbao/seal:ro
      - openbao-node1-audit:/openbao/audit
      - openbao-node1-data:/openbao/data
      - openbao-node1-logs:/openbao/logs
    healthcheck:
      test: ["CMD-SHELL", "BAO_ADDR=http://127.0.0.1:8200 bao status >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 24

  openbao-node2:
    image: ${OPENBAO_IMAGE:-quay.io/openbao/openbao:2.5.4}
    user: "0"
    depends_on:
      openbao-node0:
        condition: service_healthy
    command:
      - server
      - -config=/openbao/node2.hcl
    ports:
      - 127.0.0.1:${OPENBAO_NODE2_PORT:-18202}:8200
    volumes:
      - ./openbao/node2.hcl:/openbao/node2.hcl:ro
      - openbao-seal:/openbao/seal:ro
      - openbao-node2-audit:/openbao/audit
      - openbao-node2-data:/openbao/data
      - openbao-node2-logs:/openbao/logs
    healthcheck:
      test: ["CMD-SHELL", "BAO_ADDR=http://127.0.0.1:8200 bao status >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 24

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.11.2}
    depends_on:
      openbao-node0:
        condition: service_healthy
      openbao-node1:
        condition: service_healthy
      openbao-node2:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - 127.0.0.1:${PROMETHEUS_PORT:-19090}:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../generated/prometheus:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus

  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.7.2}
    command:
      - -config.file=/etc/loki/loki.yaml
    ports:
      - 127.0.0.1:${LOKI_PORT:-13100}:3100
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki

  alloy:
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.16.1}
    depends_on:
      - loki
      - openbao-node0
      - openbao-node1
      - openbao-node2
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - 127.0.0.1:${ALLOY_PORT:-12345}:12345
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - openbao-node0-audit:/var/lib/openbao/node0/audit:ro
      - openbao-node0-logs:/var/lib/openbao/node0/logs:ro
      - openbao-node1-audit:/var/lib/openbao/node1/audit:ro
      - openbao-node1-logs:/var/lib/openbao/node1/logs:ro
      - openbao-node2-audit:/var/lib/openbao/node2/audit:ro
      - openbao-node2-logs:/var/lib/openbao/node2/logs:ro
      - alloy-data:/var/lib/alloy/data

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.0.1}
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: light
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-13000}:3000
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../generated/grafana:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  alloy-data:
  grafana-data:
  loki-data:
  openbao-node0-audit:
  openbao-node0-data:
  openbao-node0-logs:
  openbao-node1-audit:
  openbao-node1-data:
  openbao-node1-logs:
  openbao-node2-audit:
  openbao-node2-data:
  openbao-node2-logs:
  openbao-seal:
  prometheus-data:

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: openbao
    metrics_path: /v1/sys/metrics
    params:
      format:
        - prometheus
    bearer_token_file: /etc/prometheus/secrets/openbao-metrics-token/metrics-token
    static_configs:
      - targets:
          - openbao:8200
        labels:
          cluster: compose
          deployment_profile: docker-compose
          environment: local

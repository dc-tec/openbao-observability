global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: openbao
    metrics_path: /v1/sys/metrics
    params:
      format:
        - prometheus
    static_configs:
      - targets:
          - openbao-node0:8200
          - openbao-node1:8200
          - openbao-node2:8200
        labels:
          cluster: compose
          deployment_profile: docker-compose
          environment: local
          scrape_profile: all_nodes
    relabel_configs:
      - source_labels:
          - __address__
        regex: "([^:]+):.*"
        replacement: "$1"
        target_label: pod
    metric_relabel_configs:
      - source_labels:
          - __name__
          - exported_cluster
        regex: "(vault|openbao)_core_unsealed;"
        action: drop
      - source_labels:
          - namespace
        regex: "(.+)"
        replacement: "$1"
        target_label: openbao_namespace
      - regex: "namespace|exported_cluster"
        action: labeldrop

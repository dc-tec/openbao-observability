# Disposable local fixture data only. Do not deploy these retention limits to production.
[openbao_metrics]
datatype = metric
homePath = $SPLUNK_DB/openbao_metrics/db
coldPath = $SPLUNK_DB/openbao_metrics/colddb
thawedPath = $SPLUNK_DB/openbao_metrics/thaweddb
maxTotalDataSizeMB = 256
frozenTimePeriodInSecs = 604800

[openbao_audit]
homePath = $SPLUNK_DB/openbao_audit/db
coldPath = $SPLUNK_DB/openbao_audit/colddb
thawedPath = $SPLUNK_DB/openbao_audit/thaweddb
maxTotalDataSizeMB = 128
frozenTimePeriodInSecs = 604800

[openbao_operational]
homePath = $SPLUNK_DB/openbao_operational/db
coldPath = $SPLUNK_DB/openbao_operational/colddb
thawedPath = $SPLUNK_DB/openbao_operational/thaweddb
maxTotalDataSizeMB = 64
frozenTimePeriodInSecs = 604800

# Optional completed-request logs are separate from normal operational access.
[openbao_completed]
homePath = $SPLUNK_DB/openbao_completed/db
coldPath = $SPLUNK_DB/openbao_completed/colddb
thawedPath = $SPLUNK_DB/openbao_completed/thaweddb
maxTotalDataSizeMB = 32
frozenTimePeriodInSecs = 259200

[openbao_platform]
homePath = $SPLUNK_DB/openbao_platform/db
coldPath = $SPLUNK_DB/openbao_platform/colddb
thawedPath = $SPLUNK_DB/openbao_platform/thaweddb
maxTotalDataSizeMB = 64
frozenTimePeriodInSecs = 604800
